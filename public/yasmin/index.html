          { id: 55, emoji: '💎', name: 'יהלום', speak: 'יַהֲלוֹם' },
          { id: 56, emoji: '🏠', name: 'בית', speak: 'בַּיִת' }
        ];

        // בנייה מתמטית של חפיסת דאבל אמיתית (57 כרטיסים – לכל זוג כרטיסים יש בדיוק סמל משותף אחד!)
        const generateDobbleDeck = () => {
          const p = 7;
          const rawCards = [];

          // קלף ראשון
          rawCards.push(Array.from({ length: p + 1 }, (_, i) => i));

          // p קלפים החולקים את סמל 0
          for (let j = 0; j < p; j++) {
            const card = [0];
            for (let k = 0; k < p; k++) {
              card.push(p + 1 + p * j + k);
            }
            rawCards.push(card);
          }

          // p*p קלפים נוספים במישור הפרויקטיבי
          for (let i = 0; i < p; i++) {
            for (let j = 0; j < p; j++) {
              const card = [i + 1];
              for (let k = 0; k < p; k++) {
                card.push(p + 1 + p * k + ((i * k + j) % p));
              }
              rawCards.push(card);
            }
          }

          const scales = [0.52, 1.56, 0.64, 1.36, 0.76, 1.2, 0.92, 1.46];

          const deckCards = rawCards
            .sort(() => Math.random() - 0.5)
            .map((symIds, cIdx) => {
              const shuffledSyms = [...symIds].sort(() => Math.random() - 0.5);
              const shuffledScales = [...scales].sort(() => Math.random() - 0.5);
              const ringOffsetDeg = Math.floor(Math.random() * 360);
              return {
                uid: `dobble-card-${cIdx}-${Math.random().toString(36).slice(2, 6)}`,
                ringOffsetDeg,
                entries: shuffledSyms.map((sid, sIdx) => ({
                  symbol: DOBBLE_SYMBOLS[sid],
                  rot: Math.round((Math.random() - 0.5) * 90),
                  scale: shuffledScales[sIdx]
                }))
              };
            });

          // מוודא שבכל זוג כרטיסים שנפתח יחד, הצורה המשותפת תופיע בגדלים שונים (למשל גדולה בכרטיס אחד וקטנה בשני)
          for (let i = 0; i + 1 < deckCards.length; i += 2) {
            const cardA = deckCards[i];
            const cardB = deckCards[i + 1];
            const idsA = new Set(cardA.entries.map(e => e.symbol.id));
            const matchBIdx = cardB.entries.findIndex(e => idsA.has(e.symbol.id));
            if (matchBIdx !== -1) {
              const sharedId = cardB.entries[matchBIdx].symbol.id;
              const entryA = cardA.entries.find(e => e.symbol.id === sharedId);
              const entryB = cardB.entries[matchBIdx];
              if (entryA && Math.abs(entryA.scale - entryB.scale) < 0.45) {
                const targetContrastIdx = cardB.entries.findIndex((e, idx) =>
                  idx !== matchBIdx && (entryA.scale >= 1.0 ? e.scale <= 0.78 : e.scale >= 1.3)
                );
                if (targetContrastIdx !== -1) {
                  const tempScale = entryB.scale;
                  entryB.scale = cardB.entries[targetContrastIdx].scale;
                  cardB.entries[targetContrastIdx].scale = tempScale;
                }
              }
            }
          }

          return deckCards;
        };

        const DobbleGame = () => {
          const [deck, setDeck] = useState(() => generateDobbleDeck());
          const [pairIndex, setPairIndex] = useState(0);
          const [score, setScore] = useState(0);
          const [matchedSymbolId, setMatchedSymbolId] = useState(null);
          const [wrongPickKey, setWrongPickKey] = useState(null);
          const [isFinished, setIsFinished] = useState(false);

          const speak = useSpeech('he-IL');
          const nextTimerRef = React.useRef(null);
          const hasSpokenIntroRef = React.useRef(false);

          const totalPairs = Math.floor(deck.length / 2); // 28 זוגות בחפיסה

          useEffect(() => {
            if (!hasSpokenIntroRef.current) {
              hasSpokenIntroRef.current = true;
              const t = setTimeout(() => speak('מִצְאוּ אֶת הַצּוּרָה הַמְּשׁוּתֶּפֶת לִשְׁנֵי הַכַּרְטִיסִים!'), 450);
              return () => clearTimeout(t);
            }
          }, [speak]);

          useEffect(() => {
            return () => {
              if (nextTimerRef.current) clearTimeout(nextTimerRef.current);
            };
          }, []);

          const restartDobble = () => {
            if (nextTimerRef.current) clearTimeout(nextTimerRef.current);
            setDeck(generateDobbleDeck());
            setPairIndex(0);
            setScore(0);
            setMatchedSymbolId(null);
            setWrongPickKey(null);
            setIsFinished(false);
          };

          const cardRight = deck[pairIndex * 2];
          const cardLeft = deck[pairIndex * 2 + 1];

          const sharedSymbol = React.useMemo(() => {
            if (!cardRight || !cardLeft) return null;
            const rightIds = new Set(cardRight.entries.map(e => e.symbol.id));
            const found = cardLeft.entries.find(e => rightIds.has(e.symbol.id));
            return found ? found.symbol : null;
          }, [cardRight, cardLeft]);

          const handleSymbolTap = (symbol, cardSide, e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            if (matchedSymbolId !== null || isFinished || !sharedSymbol) return;

            if (symbol.id === sharedSymbol.id) {
              setWrongPickKey(null);
              setMatchedSymbolId(symbol.id);
              setScore(s => s + 1);
              speak(symbol.speak);

              nextTimerRef.current = setTimeout(() => {
                if (pairIndex + 1 >= totalPairs) {
                  setIsFinished(true);
                  speak('כּוֹל הַכָּבוֹד! מְצָאתֶם אֶת כּוֹל הַזּוּגוֹת בְּדָאבֶּל!');
                } else {
                  setPairIndex(p => p + 1);
                  setMatchedSymbolId(null);
                }
              }, 1050);
            } else {
              const key = `${cardSide}-${symbol.id}`;
              setWrongPickKey(key);
              speak('נַסּוּ שׁוּב');
              setTimeout(() => {
                setWrongPickKey(prev => (prev === key ? null : prev));
              }, 650);
            }
          };

          const renderDobbleCircleCard = (card, side, borderClass) => {
            if (!card) return null;
            return (
              <div
                className={`relative w-64 h-64 sm:w-72 sm:h-72 md:w-80 md:h-80 rounded-full bg-white border-8 ${borderClass} shadow-xl shrink-0 transition-all`}
              >
                {card.entries.map((entry, idx) => {
                  // idx 0 במרכז, idx 1..7 במעגל מסביב כדי למנוע חפיפה לחלוטין
                  let leftPct = 50;
                  let topPct = 50;
                  if (idx > 0) {
                    const angleRad = ((card.ringOffsetDeg + ((idx - 1) * 360) / 7) * Math.PI) / 180;
                    const radius = 33.5;
                    leftPct = 50 + radius * Math.cos(angleRad);
                    topPct = 50 + radius * Math.sin(angleRad);
                  }

                  const isMatched = matchedSymbolId === entry.symbol.id;
                  const isWrong = wrongPickKey === `${side}-${entry.symbol.id}`;

                  return (
                    <button
                      key={entry.symbol.id}
                      type="button"
                      onClick={(e) => handleSymbolTap(entry.symbol, side, e)}
                      style={{
                        left: `${leftPct}%`,
                        top: `${topPct}%`,
                        transform: 'translate(-50%, -50%)'
                      }}
                      className={`
                        absolute w-12 h-12 sm:w-14 sm:h-14 md:w-16 md:h-16 rounded-full flex items-center justify-center
                        transition-all duration-200 focus:outline-none cursor-pointer
                        ${isMatched
                          ? 'bg-green-100 ring-4 ring-green-400 shadow-lg z-20 scale-125'
                          : isWrong
                            ? 'bg-red-100 ring-4 ring-red-300 opacity-70'
                            : 'hover:bg-amber-50/80 active:scale-90'
                        }
                      `}
                    >
                      <span
                        style={{
                          transform: `rotate(${entry.rot}deg) scale(${isMatched ? 1.25 : entry.scale})`
                        }}
                        className="text-3xl sm:text-4xl md:text-[40px] leading-none select-none inline-block transition-transform duration-200"
                      >
                        {entry.symbol.emoji}
                      </span>
                    </button>
                  );
                })}
              </div>
            );
          };

          return (
            <div className="flex flex-col items-center w-full max-w-4xl mx-auto select-none">
              <div className="flex flex-wrap items-center justify-center gap-3 mb-5">
                <button
                  type="button"
                  onClick={() => speak('מִצְאוּ אֶת הַצּוּרָה הַמְּשׁוּתֶּפֶת לִשְׁנֵי הַכַּרְטִיסִים!')}
                  className="bg-orange-100 hover:bg-orange-200 text-orange-800 px-5 py-2.5 rounded-full font-bold text-base md:text-lg flex items-center gap-2 shadow-sm transition-all"
                >
                  <Volume2Icon /> מצאו את הצורה המשותפת!
                </button>

                <div className="bg-amber-50 border-2 border-amber-200 px-4 py-2 rounded-full font-black text-amber-800 text-sm md:text-base flex items-center gap-2">
                  <span>🎯 זוגות שמצאתם:</span>
                  <span className="text-orange-600 text-lg">{score}</span>
                </div>

                <button
                  type="button"
                  onClick={restartDobble}
                  className="px-4 py-2.5 rounded-full bg-gray-100 text-gray-700 font-bold text-sm hover:bg-gray-200 transition-all"
                >
                  🔄 חפיסה חדשה
                </button>
              </div>

              <div className="h-8 mb-3 flex items-center justify-center">
                {matchedSymbolId !== null && sharedSymbol && (
                  <div className="text-xl sm:text-2xl font-black text-green-600 animate-bounce">
                    מצוין! {sharedSymbol.emoji} {sharedSymbol.name}! 🎉
                  </div>
                )}
              </div>

              {isFinished ? (
                <div className="flex flex-col items-center gap-4 bg-amber-50 border-4 border-amber-300 rounded-3xl px-8 py-8 shadow-md animate-fade-in-up">
                  <div className="text-5xl">🎯🏆🎉</div>
                  <div className="text-2xl md:text-3xl font-black text-amber-800 text-center">
                    כל הכבוד! מצאתם את כל {score} הזוגות בחפיסה!
                  </div>
                  <button
                    type="button"
                    onClick={restartDobble}
                    className="bg-orange-500 hover:bg-orange-600 text-white font-black text-xl px-8 py-3.5 rounded-full shadow-lg transition-all"
                  >
                    שחקו שוב 🔄
                  </button>
                </div>
              ) : (
                <>
                  <div
                    key={cardRight?.uid}
                    className="flex flex-col sm:flex-row items-center justify-center gap-6 md:gap-10 my-2 animate-fade-in-up"
                  >
                    {renderDobbleCircleCard(cardRight, 'right', 'border-purple-300')}
                    {renderDobbleCircleCard(cardLeft, 'left', 'border-amber-300')}
                  </div>

                  <div className="mt-6 text-orange-400 font-bold text-base">
                    זוג {pairIndex + 1} מתוך {totalPairs}
                  </div>
                </>
              )}
            </div>
          );
        };

        // ============================================================================
        // 3. SET JUNIOR GAME (סט ג'וניור - 27 קלפים, מיחזור סטים לקופה ופתיחת קלפים חדשים תמיד)
        // ============================================================================
        const SET_JR_COLORS = [
          { id: 'red', label: 'אדום', hex: '#EF4444' },
          { id: 'green', label: 'ירוק', hex: '#16A34A' },
          { id: 'purple', label: 'סגול', hex: '#9333EA' }
        ];
        const SET_JR_SHAPES = ['diamond', 'oval', 'squiggle'];
        const SET_JR_COUNTS = [1, 2, 3];

        const SetJuniorShapeSVG = ({ shape, hex, className = 'w-12 h-7 sm:w-14 sm:h-8' }) => {
          if (shape === 'diamond') {
            return (
              <svg viewBox="0 0 60 36" className={className}>
                <polygon points="30,3 57,18 30,33 3,18" fill={hex} />
              </svg>
            );
          }
          if (shape === 'oval') {
            return (
              <svg viewBox="0 0 60 36" className={className}>
                <rect x="4" y="4" width="52" height="28" rx="14" fill={hex} />
              </svg>
            );
          }
          return (
            <svg viewBox="0 0 60 36" className={className}>
              <path
                d="M7,24 C4,12 16,4 27,10 C35,14 43,12 48,6 C54,2 58,10 55,20 C52,30 41,34 31,28 C23,24 15,26 11,31 C6,34 3,29 7,24 Z"
                fill={hex}
              />
            </svg>
          );
        };

        const buildFullSetJuniorDeck = () => {
          const cards = [];
          SET_JR_COLORS.forEach(c => {
            SET_JR_SHAPES.forEach(s => {
              SET_JR_COUNTS.forEach(n => {
                cards.push({
                  id: `setjr-${c.id}-${s}-${n}`,
                  color: c.id,
                  colorHex: c.hex,
                  shape: s,
                  count: n
                });
              });
            });
          });
          return cards;
        };

        const isAttributeValid = (v1, v2, v3) =>
          (v1 === v2 && v2 === v3) || (v1 !== v2 && v2 !== v3 && v1 !== v3);

        const isSetJuniorValid = (c1, c2, c3) =>
          isAttributeValid(c1.color, c2.color, c3.color) &&
          isAttributeValid(c1.shape, c2.shape, c3.shape) &&
          isAttributeValid(c1.count, c2.count, c3.count);

        const findFirstValidSetIndices = (boardCards) => {
          const len = boardCards.length;
          for (let i = 0; i < len - 2; i++) {
            for (let j = i + 1; j < len - 1; j++) {
              for (let k = j + 1; k < len; k++) {
                if (
                  boardCards[i] &&
                  boardCards[j] &&
                  boardCards[k] &&
                  isSetJuniorValid(boardCards[i], boardCards[j], boardCards[k])
                ) {
                  return [i, j, k];
                }
              }
            }
          }
          return null;
        };

        const createInitialSetJuniorState = () => {
          const all27 = buildFullSetJuniorDeck();
          for (let attempt = 0; attempt < 60; attempt++) {
            const shuffled = [...all27].sort(() => Math.random() - 0.5);
            const board = shuffled.slice(0, 9);
            const deck = shuffled.slice(9);
            if (findFirstValidSetIndices(board)) {
              return { board, deck };
            }
          }
          const shuffled = [...all27].sort(() => Math.random() - 0.5);
          return { board: shuffled.slice(0, 9), deck: shuffled.slice(9) };
        };

        const SetJuniorGame = () => {
          const [gameState, setGameState] = useState(() => createInitialSetJuniorState());
          const [selectedIds, setSelectedIds] = useState([]);
          const [evalStatus, setEvalStatus] = useState(null); // null | 'valid' | 'invalid'
          const [statusText, setStatusText] = useState('בחרו 3 קלפים שיוצרים סט!');
          const [setsFound, setSetsFound] = useState(0);
          const [hintIds, setHintIds] = useState([]);
          const [showRules, setShowRules] = useState(false);

          const speak = useSpeech('he-IL');
          const actionTimerRef = React.useRef(null);

          useEffect(() => {
            return () => {
              if (actionTimerRef.current) clearTimeout(actionTimerRef.current);
            };
          }, []);

          const resetSetGame = () => {
            if (actionTimerRef.current) clearTimeout(actionTimerRef.current);
            setGameState(createInitialSetJuniorState());
            setSelectedIds([]);
            setEvalStatus(null);
            setSetsFound(0);
            setHintIds([]);
            setStatusText('בחרו 3 קלפים שיוצרים סט!');
          };

          const explainInvalidSet = (c1, c2, c3) => {
            if (!isAttributeValid(c1.color, c2.color, c3.color)) {
              return 'לא סט – בצבע יש 2 זהים ו-1 שונה (צריך או כולם באותו צבע או כולם בצבעים שונים).';
            }
            if (!isAttributeValid(c1.shape, c2.shape, c3.shape)) {
              return 'לא סט – בצורה יש 2 זהות ו-1 שונה (צריך או כולן אותה צורה או כולן צורות שונות).';
            }
            return 'לא סט – בכמות יש 2 קלפים עם אותו מספר צורות ו-1 שונה.';
          };

          const handleCardSelect = (card, e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            if (evalStatus !== null) return;

            setHintIds([]);

            if (selectedIds.includes(card.id)) {
              setSelectedIds(prev => prev.filter(id => id !== card.id));
              return;
            }

            if (selectedIds.length >= 3) return;

            const nextSelected = [...selectedIds, card.id];
            setSelectedIds(nextSelected);

            if (nextSelected.length === 3) {
              const pickedCards = nextSelected
                .map(id => gameState.board.find(c => c.id === id))
                .filter(Boolean);

              if (pickedCards.length === 3 && isSetJuniorValid(pickedCards[0], pickedCards[1], pickedCards[2])) {
                setEvalStatus('valid');
                setSetsFound(s => s + 1);
                setStatusText('סט! כל הכבוד! קלפים חדשים נפתחים מהקופה...');
                speak('סֶט! כּוֹל הַכָּבוֹד!');

                actionTimerRef.current = setTimeout(() => {
                  setGameState(prev => {
                    const replacedPositions = prev.board
                      .map((c, idx) => (nextSelected.includes(c.id) ? idx : -1))
                      .filter(idx => idx !== -1);
                    const removedCards = prev.board.filter(c => nextSelected.includes(c.id));

                    // שולפים 3 קלפים חדשים מהקופה (18 הקלפים שבחוץ) כך שתמיד יהיה סט על הלוח,
                    // ואת 3 הקלפים של הסט שנמצא מחזירים חזרה ומערבבים לתוך הקופה!
                    let chosenThree = null;
                    let remainingInDeck = null;

                    for (let attempt = 0; attempt < 60; attempt++) {
                      const shuffledDeck = [...prev.deck].sort(() => Math.random() - 0.5);
                      const candidateThree = shuffledDeck.slice(0, 3);
                      const candidateBoard = prev.board.map(c =>
                        nextSelected.includes(c.id) ? null : c
                      );
                      replacedPositions.forEach((pos, i) => {
                        candidateBoard[pos] = candidateThree[i];
                      });

                      if (findFirstValidSetIndices(candidateBoard)) {
                        chosenThree = candidateThree;
                        remainingInDeck = shuffledDeck.slice(3);
                        break;
                      }
                    }

                    if (!chosenThree) {
                      const shuffledDeck = [...prev.deck].sort(() => Math.random() - 0.5);
                      chosenThree = shuffledDeck.slice(0, 3);
                      remainingInDeck = shuffledDeck.slice(3);
                    }

                    const nextBoard = [...prev.board];
                    replacedPositions.forEach((pos, i) => {
                      nextBoard[pos] = chosenThree[i];
                    });

                    // הקלפים של הסט שנמצא חוזרים חזרה לקופה ומעורבבים בה
                    const recycledDeck = [...remainingInDeck, ...removedCards].sort(() => Math.random() - 0.5);

                    return { board: nextBoard, deck: recycledDeck };
                  });

                  setSelectedIds([]);
                  setEvalStatus(null);
                  setStatusText('מעולה! מצאו עוד סט על הלוח!');
                }, 1150);
              } else if (pickedCards.length === 3) {
                setEvalStatus('invalid');
                setStatusText(explainInvalidSet(pickedCards[0], pickedCards[1], pickedCards[2]));
                speak('לֹא סֶט, נַסּוּ שׁוּב');

                actionTimerRef.current = setTimeout(() => {
                  setSelectedIds([]);
                  setEvalStatus(null);
                }, 1450);
              }
            }
          };

          const handleHint = () => {
            if (evalStatus !== null) return;
            const setIndices = findFirstValidSetIndices(gameState.board);
            if (setIndices) {
              const twoCardIds = [
                gameState.board[setIndices[0]].id,
                gameState.board[setIndices[1]].id
              ];
              setHintIds(twoCardIds);
              setSelectedIds(twoCardIds);
              setStatusText('רמז: שני הקלפים המסומנים שייכים לסט – מצאו את הקלף השלישי שמשלים אותם!');
              speak('הִנֵּה שְׁנֵי קְלָפִים מֵהַסֶּט, מִצְאוּ אֶת הַשְּׁלִישִׁי!');
            }
          };

          return (
            <div className="flex flex-col items-center w-full max-w-3xl mx-auto select-none">
              {/* סרגל פעולות עליון */}
              <div className="flex flex-wrap items-center justify-center gap-2.5 sm:gap-3 mb-4">
                <div className="bg-amber-50 border-2 border-amber-200 px-4 py-2 rounded-full font-black text-amber-800 text-sm md:text-base flex items-center gap-2">
                  <span>💠 סטים שמצאתם:</span>
                  <span className="text-orange-600 text-lg">{setsFound}</span>
                </div>

                <button
                  type="button"
                  onClick={handleHint}
                  className="px-4 py-2 rounded-full bg-amber-100 hover:bg-amber-200 text-amber-900 font-bold text-sm transition-all shadow-sm"
                >
                  💡 רמז
                </button>

                <button
                  type="button"
                  onClick={() => setShowRules(r => !r)}
                  className="px-4 py-2 rounded-full bg-sky-50 border-2 border-sky-200 text-sky-700 font-bold text-sm hover:bg-sky-100 transition-all"
                >
                  ❓ מה זה סט?
                </button>

                <button
                  type="button"
                  onClick={resetSetGame}
                  className="px-4 py-2 rounded-full bg-gray-100 text-gray-700 font-bold text-sm hover:bg-gray-200 transition-all"
                >
                  🔄 ערבב מחדש
                </button>
              </div>

              {showRules && (
                <div className="w-full max-w-2xl mb-4 bg-sky-50 border-2 border-sky-200 rounded-3xl p-4 text-sm md:text-base text-gray-700 leading-relaxed shadow-sm">
                  <div className="flex justify-between items-center mb-2">
                    <span className="font-black text-sky-800 text-lg">💠 איך מוצאים סט בסט ג'וניור?</span>
                    <button type="button" onClick={() => setShowRules(false)} className="text-sky-600 font-bold px-2 py-0.5 rounded-lg hover:bg-sky-100">סגור ✕</button>
                  </div>
                  <p className="mb-1">
                    <strong>סט</strong> הוא שלישייה של 3 קלפים שבהם בכל אחד משלושת המאפיינים – <strong>צבע</strong>, <strong>צורה</strong> ו-<strong>כמות</strong> – מתקיים:
                  </p>
                  <ul className="list-disc pr-5 space-y-1">
                    <li>או שכל 3 הקלפים <strong>זהים לגמרי</strong> באותו מאפיין,</li>
                    <li>או שכל 3 הקלפים <strong>שונים לגמרי</strong> זה מזה באותו מאפיין!</li>
                    <li>אם יש 2 זהים ו-1 יוצא דופן – זה לא סט. בכל פעם שמוצאים סט נפתחים 3 קלפים חדשים מהקופה!</li>
                  </ul>
                </div>
              )}

              {/* הודעת חיווי */}
              <div
                className={`w-full max-w-xl mb-5 px-4 py-2.5 rounded-2xl border-2 text-center font-bold text-sm sm:text-base transition-all ${
                  evalStatus === 'valid'
                    ? 'bg-green-50 border-green-300 text-green-800'
                    : evalStatus === 'invalid'
                      ? 'bg-red-50 border-red-300 text-red-700'
                      : 'bg-indigo-50 border-indigo-200 text-indigo-900'
                }`}
              >
                {statusText}
              </div>

              {/* לוח 9 קלפים (3x3) */}
              <div className="grid grid-cols-3 gap-3 sm:gap-4 md:gap-5 w-full max-w-xl">
                {gameState.board.map((card) => {
                  const isSelected = selectedIds.includes(card.id);
                  const isHinted = hintIds.includes(card.id);

                  let cardBorderClasses = 'bg-white border-slate-200 hover:border-orange-300 shadow-md hover:shadow-xl';
                  if (isSelected && evalStatus === 'valid') {
                    cardBorderClasses = 'bg-green-50 border-green-500 ring-4 ring-green-200 scale-105 shadow-xl';
                  } else if (isSelected && evalStatus === 'invalid') {
                    cardBorderClasses = 'bg-red-50 border-red-400 ring-4 ring-red-200 scale-95';
                  } else if (isSelected) {
                    cardBorderClasses = 'bg-orange-50/70 border-orange-500 ring-4 ring-orange-200 -translate-y-1 shadow-xl';
                  } else if (isHinted) {
                    cardBorderClasses = 'bg-amber-50 border-amber-400 ring-4 ring-amber-200';
                  }

                  return (
                    <button
                      key={card.id}
                      type="button"
                      onClick={(e) => handleCardSelect(card, e)}
                      className={`
                        h-28 sm:h-36 md:h-40 rounded-2xl sm:rounded-3xl border-4 p-2 sm:p-3
                        flex flex-col items-center justify-center gap-1.5 sm:gap-2
                        transition-all duration-200 focus:outline-none cursor-pointer
                        ${cardBorderClasses}
                      `}
                    >
                      {Array.from({ length: card.count }).map((_, i) => (
                        <SetJuniorShapeSVG
                          key={i}
                          shape={card.shape}
                          hex={card.colorHex}
                          className="w-12 h-6 sm:w-16 sm:h-8 md:w-20 md:h-9 shrink-0"
                        />
                      ))}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        };

        // --- Main App Component ---
        const App = () => {
          const [activeItem, setActiveItem] = useState(null);
          const [activeCategoryTheme, setActiveCategoryTheme] = useState(null);
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

          const handleSelectItem = (item, category) => {
            setActiveItem(item);
            setActiveCategoryTheme(category.theme);
            setIsMobileMenuOpen(false);
          };

          const renderInteractiveContent = () => {
            switch(activeItem.id) {
              case 'heb-letters':
                return <InteractiveModule key={activeItem.id} items={HEBREW_LETTERS} lang="he-IL" themeClass="pink" renderItem={renderTextCardItem('pink', 'w-16 h-16 md:w-24 md:h-24', 'text-2xl md:text-4xl')} />;
              case 'heb-combinations':
                return <WordCombinationsModule key={activeItem.id} />;
              case 'heb-rhymes':
                return <RhymesGame key={activeItem.id} />;
              case 'heb-sounds':
                return <StartingSoundsGame key={activeItem.id} />;
              case 'heb-sound-pairs':
                return <StartingSoundPairsGame key={activeItem.id} />;
              case 'heb-opposites':
                return <OppositesModule key={activeItem.id} />;
              case 'ar-colors':
                return <InteractiveModule key={activeItem.id} items={ARABIC_COLORS} lang="ar-SA" themeClass="emerald" renderItem={renderColorItem} />;
              case 'ar-animals':
                return <InteractiveModule key={activeItem.id} items={ARABIC_ANIMALS} lang="ar-SA" themeClass="emerald" renderItem={renderAnimalItem('emerald')} />;
              case 'ar-fruits-veggies':
                return <InteractiveModule key={activeItem.id} items={ARABIC_FRUITS_VEGGIES} lang="ar-SA" themeClass="emerald" renderItem={renderAnimalItem('emerald')} />;
              case 'ar-nature':
                return <InteractiveModule key={activeItem.id} items={ARABIC_NATURE} lang="ar-SA" themeClass="emerald" renderItem={renderAnimalItem('emerald')} />;
              case 'ar-body':
                return <InteractiveModule key={activeItem.id} items={ARABIC_BODY_PARTS} lang="ar-SA" themeClass="emerald" renderItem={renderAnimalItem('emerald')} />;
              case 'ar-family':
                return <InteractiveModule key={activeItem.id} items={ARABIC_FAMILY} lang="ar-SA" themeClass="emerald" renderItem={renderAnimalItem('emerald')} />;
              case 'ar-rosh-hashana':
                return <InteractiveModule key={activeItem.id} items={ARABIC_ROSH_HASHANA} lang="ar-SA" themeClass="emerald" renderItem={renderAnimalItem('emerald')} />;
              case 'ar-days':
                return <InteractiveModule key={activeItem.id} items={ARABIC_DAYS} lang="ar-SA" themeClass="emerald" renderItem={renderTextCardItem('emerald', 'w-20 h-20 md:w-28 md:h-28', 'text-2xl md:text-4xl')} />;
              case 'ar-numbers':
                return <InteractiveModule key={activeItem.id} items={ARABIC_NUMBERS} lang="ar-SA" themeClass="emerald" renderItem={renderTextCardItem('emerald', 'w-16 h-16 md:w-24 md:h-24', 'text-2xl md:text-4xl')} />;
              case 'en-colors':
                return <InteractiveModule key={activeItem.id} items={ENGLISH_COLORS} lang="en-US" themeClass="blue" renderItem={renderColorItem} />;
              case 'en-animals':
                return <InteractiveModule key={activeItem.id} items={ENGLISH_ANIMALS} lang="en-US" themeClass="blue" renderItem={renderAnimalItem('blue')} />;
              case 'en-numbers':
                return <InteractiveModule key={activeItem.id} items={ENGLISH_NUMBERS} lang="en-US" themeClass="blue" renderItem={renderTextCardItem('blue', 'w-16 h-16 md:w-24 md:h-24', 'text-2xl md:text-4xl')} />;
              case 'math-30':
                return <InteractiveModule key={activeItem.id} items={MATH_NUMBERS} lang="he-IL" themeClass="purple" renderItem={renderTextCardItem('purple', 'w-14 h-14 md:w-20 md:h-20', 'text-xl md:text-2xl')} />;
              case 'math-count':
                return <CountingGame key={activeItem.id} />;
              case 'math-compare':
                return <ComparisonGame key={activeItem.id} />;
              case 'songs-letters':
                return <SongsModule key={activeItem.id} videos={HEBREW_LETTERS_SONGS} themeClass="amber" />;
              case 'songs-numbers':
                return <SongsModule key={activeItem.id} videos={MATH_NUMBERS_SONGS} themeClass="amber" />;
              case 'game-memory':
                return <MemoryGame key={activeItem.id} />;
              case 'game-clack':
                return <ClackGame key={activeItem.id} />;
              case 'game-dobble':
                return <DobbleGame key={activeItem.id} />;
              case 'game-set-junior':
                return <SetJuniorGame key={activeItem.id} />;
              case 'game-war':
                return <WarCardGame key={activeItem.id} />;
              case 'game-sherlock':
                return <SherlockGame key={activeItem.id} />;
              default:
                return (
                  <div className="flex flex-col items-center">
                    <div className="w-24 h-2 bg-amber-400 rounded-full mb-8"></div>
                    <p className="text-xl md:text-2xl leading-relaxed text-gray-600 font-medium bg-amber-50/50 p-6 rounded-2xl border-2 border-dashed border-amber-200">
                      {activeItem.content}
                    </p>
                  </div>
                );
            }
          };

          return (
            <div className="min-h-screen flex flex-col md:flex-row bg-amber-50 h-screen overflow-hidden">
              {/* Header (Mobile) */}
              <div className="md:hidden bg-white shadow-sm p-4 flex justify-between items-center z-20 shrink-0">
                <div className="flex items-center text-amber-600 font-bold text-xl">
                  <span className="text-2xl ml-2">🌸</span> גן יסמין
                </div>
                <button
                  type="button"
                  onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)}
                  className="p-2 bg-amber-100 text-amber-700 rounded-full hover:bg-amber-200 transition-colors"
                >
                  {isMobileMenuOpen ? <XIcon /> : <MenuIcon />}
                </button>
              </div>

              {/* Sidebar */}
              <nav className={`
                ${isMobileMenuOpen ? 'translate-x-0' : 'translate-x-full'}
                md:translate-x-0 transition-transform duration-300 ease-in-out
                absolute md:relative top-0 right-0 w-72 h-full bg-white shadow-xl md:shadow-lg z-30 overflow-y-auto shrink-0
              `}>
                <div className="hidden md:flex items-center p-6 text-amber-600 font-black text-3xl border-b border-amber-100 sticky top-0 bg-white z-10">
                  <span className="text-4xl ml-3 animate-spin-slow">🌸</span> גן יסמין
                </div>
                <div className="p-4 pt-6 space-y-6">
                  {MENU_DATA.map((section, idx) => (
                    <div key={idx} className="space-y-2">
                      <h2 className={`flex items-center font-bold text-lg p-2 rounded-xl ${section.color}`}>
                        <span className="ml-2 text-xl">{section.icon}</span> {section.category}
                      </h2>
                      <ul className="space-y-1 pr-2">
                        {section.items.map((item) => (
                          <li key={item.id}>
                            <button
                              type="button"
                              onClick={() => handleSelectItem(item, section)}
                              className={`
                                w-full text-right flex items-center px-4 py-3 rounded-xl transition-all
                                ${activeItem?.id === item.id
                                  ? `${section.color} font-bold shadow-sm scale-[1.02]`
                                  : `hover:bg-gray-50 text-gray-600 ${section.hover}`
                                }
                              `}
                            >
                              <span className="ml-3 text-xl inline-flex">{item.icon}</span> {item.title}
                            </button>
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>
              </nav>

              {/* Mobile Overlay */}
              {isMobileMenuOpen && (
                <div
                  className="absolute inset-0 bg-black/20 z-20 md:hidden backdrop-blur-sm"
                  onClick={() => setIsMobileMenuOpen(false)}
                />
              )}

              {/* Main Content */}
              <main className="flex-1 p-4 md:p-8 overflow-y-auto relative h-full">
                <div className="max-w-5xl mx-auto pb-20">
                  {activeItem ? (
                    <div className="bg-white rounded-3xl shadow-xl p-6 md:p-12 border-4 border-white transform transition-all animate-fade-in-up flex flex-col items-center">
                      <h1 className="text-3xl md:text-5xl font-black text-gray-800 mb-8 flex items-center">
                        <span className="ml-4 text-4xl md:text-5xl">{activeItem.icon}</span> {activeItem.title}
                      </h1>
                      {renderInteractiveContent()}
                    </div>
                  ) : (
                    <div className="bg-white rounded-3xl shadow-xl p-8 md:p-16 text-center border-4 border-amber-100 flex flex-col items-center justify-center min-h-[60vh]">
                      <div className="w-24 h-24 md:w-32 md:h-32 bg-amber-100 rounded-full flex items-center justify-center mb-8 shadow-inner">
                        <span className="text-5xl md:text-7xl">🌸</span>
                      </div>
                      <h1 className="text-3xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-orange-400 mb-6">
                        ברוכים הבאים לגן יסמין!
                      </h1>
                      <p className="text-lg md:text-2xl text-gray-500 max-w-lg mx-auto">
                        בחרו נושא מהתפריט בצד ימין כדי להתחיל ללמוד, לשחק ולגלות דברים חדשים.
                      </p>
                      <div className="mt-12 flex space-x-3 space-x-reverse justify-center">
                        <div className="w-3 h-3 rounded-full bg-pink-400 animate-bounce" style={{ animationDelay: '0ms' }}></div>
                        <div className="w-3 h-3 rounded-full bg-emerald-400 animate-bounce" style={{ animationDelay: '150ms' }}></div>
                        <div className="w-3 h-3 rounded-full bg-blue-400 animate-bounce" style={{ animationDelay: '300ms' }}></div>
                        <div className="w-3 h-3 rounded-full bg-purple-400 animate-bounce" style={{ animationDelay: '450ms' }}></div>
                      </div>
                    </div>
                  )}
                </div>
              </main>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
