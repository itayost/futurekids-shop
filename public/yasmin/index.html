        const renderAnimalItem = (themeColor) => {

              </div>

                {item.text}

                  {item.hint}
                </span>

          );
        };

        const renderTextCardItem = (themeColor, sizeClass, mainTextSize) => {
          const styles = getThemeClasses(themeColor);
          return (item, onClick, disabled) => (
            <button 
              key={item.id} 
              onClick={onClick} 
              disabled={disabled}
              className={`
                ${sizeClass} bg-white rounded-3xl flex flex-col items-center justify-center 
                shadow-md hover:shadow-xl hover:-translate-y-2 transition-all border-b-4 ${styles.border} 
                ${disabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}
              `}
            >
              <span className={`${mainTextSize} font-black ${styles.textMain} ${item.sub ? 'mb-1' : ''}`}>{item.display || item.main}</span>
              {item.sub && <span className={`font-bold text-xs md:text-sm ${styles.textSub} select-none text-center leading-tight px-1`}>{item.sub}</span>}
            </button>
          );
        };

        // --- Generic Interactive Module ---
        const InteractiveModule = ({ items, lang, renderItem, themeClass, videos = [] }) => {
          const [mode, setMode] = useState('learn');
          const [targetItem, setTargetItem] = useState(null);
          const [practiceOptions, setPracticeOptions] = useState([]);
          const [feedback, setFeedback] = useState('');
          const [preferredVoice, setPreferredVoice] = useState(null);
          const [roundId, setRoundId] = useState(0); 
          const [selectedVideoIndex, setSelectedVideoIndex] = useState(0);
          const [failedThumbs, setFailedThumbs] = useState({});

          const theme = getThemeClasses(themeClass);

          useEffect(() => {
            const initVoice = () => {
              const availableVoices = window.speechSynthesis.getVoices();
              if (availableVoices.length > 0) {
                const langPrefix = lang.split('-')[0];
                
                const langVoices = availableVoices.filter(v => 
                  v.lang.startsWith(langPrefix) || 
                  (langPrefix === 'he' && (v.lang.includes('iw') || v.name.includes('Hebrew') || v.name.includes('עברית')))
                );
                
                // העדפת קולות אזוריים לערבית מדוברת במידה וקיימים במכשיר, או קול טבעי של גוגל
                const bestVoice = (langPrefix === 'ar' && langVoices.find(v =>
                  v.lang.includes('IL') || v.lang.includes('PS') || v.lang.includes('JO') || v.lang.includes('LB') || v.lang.includes('EG')
                )) || langVoices.find(v => 
                  v.name.includes('Google') || 
                  v.name.includes('Natural') || 
                  v.name.toLowerCase().includes('female')
                ) || langVoices[0];
                
                if (bestVoice) setPreferredVoice(bestVoice);
              }
            };
            initVoice();
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
              window.speechSynthesis.onvoiceschanged = initVoice;
            }
          }, [lang]);

          const speak = (text) => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              
              setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(text);
                if (lang === 'he-IL' && preferredVoice && preferredVoice.lang.includes('iw')) {
                  utterance.lang = 'iw-IL';
                } else if (preferredVoice && preferredVoice.lang) {
                  utterance.lang = preferredVoice.lang;
                } else {
                  utterance.lang = lang; 
                }
                if (preferredVoice) utterance.voice = preferredVoice;
                
                utterance.pitch = 1.3;
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
              }, 150); 
            }
          };

          const getPracticeOptions = (target) => {
            const usedGroups = new Set();
            if (target.conflictGroup) usedGroups.add(target.conflictGroup);
            const others = items.filter(c => c.id !== target.id);
            const shuffledOthers = [...others].sort(() => 0.5 - Math.random());
            const distractors = [];
            for (const candidate of shuffledOthers) {
              if (distractors.length >= 3) break;
              if (candidate.conflictGroup && usedGroups.has(candidate.conflictGroup)) continue;
              if (candidate.conflictGroup) usedGroups.add(candidate.conflictGroup);
              distractors.push(candidate);
            }
            return [...distractors, target].sort(() => 0.5 - Math.random());
          };

          const startPractice = () => {
            let randomItem;
            do {
              randomItem = items[Math.floor(Math.random() * items.length)];
            } while (targetItem && randomItem.id === targetItem.id && items.length > 1);
            
            setTargetItem(randomItem);
            setPracticeOptions(getPracticeOptions(randomItem));
            setFeedback('');
            setRoundId(prev => prev + 1);
            speak(randomItem.spoken || randomItem.speak);
          };

          const handleItemClick = (item) => {
            if (mode === 'learn') {
              speak(item.spoken || item.speak);
            } else if (mode === 'practice' && targetItem) {
              if (item.id === targetItem.id) {
                setFeedback('correct');
                setTimeout(() => setTargetItem(prev => prev ? (startPractice(), prev) : prev), 1500);
              } else {
                setFeedback('wrong');
                const tryAgainMsgs = { 'he-IL': 'נַסּוּ שׁוּב', 'en-US': 'Try again', 'ar-SA': 'حَاوِلْ كَمَانْ مَرَّةْ' };
                speak(tryAgainMsgs[lang] || 'Try again'); 
              }
            }
          };

          return (
            <div className="flex flex-col items-center w-full">
              <div className="flex flex-wrap justify-center gap-2 mb-8 bg-gray-100 p-2 rounded-2xl">
                <button 
                  onClick={() => { setMode('learn'); setFeedback(''); setTargetItem(null); }} 
                  className={`px-6 py-2 rounded-xl font-bold transition-all ${mode === 'learn' ? `bg-white shadow-md ${theme.text}` : 'text-gray-500 hover:text-gray-700'}`}
                >
                  למידה
                </button>
                <button 
                  onClick={() => { setMode('practice'); setFeedback(''); setTargetItem(null); }} 
                  className={`px-6 py-2 rounded-xl font-bold transition-all ${mode === 'practice' ? `bg-white shadow-md ${theme.text}` : 'text-gray-500 hover:text-gray-700'}`}
                >
                  תרגול
                </button>
                {videos.length > 0 && (
                  <button 
                    onClick={() => {
                      if ('speechSynthesis' in window) window.speechSynthesis.cancel();
                      setMode('songs');
                      setSelectedVideoIndex(0);
                      setFeedback('');
                      setTargetItem(null);
                    }} 
                    className={`px-6 py-2 rounded-xl font-bold transition-all flex items-center gap-1.5 ${mode === 'songs' ? `bg-white shadow-md ${theme.text}` : 'text-gray-500 hover:text-gray-700'}`}
                  >
                    <span>🎵</span> שירים
                  </button>
                )}
              </div>
              
              {mode === 'practice' && (
                <div className="mb-8 flex flex-col items-center gap-4 min-h-[120px]">
                  {!targetItem ? (
                    <button 
                      onClick={startPractice} 
                      className={`${theme.button} text-white px-8 py-3 rounded-full font-black text-xl ${theme.buttonHover} transition-all shadow-lg hover:shadow-xl flex items-center gap-2`}
                    >
                      <PlayIcon /> התחל תרגול
                    </button>
                  ) : (
                    <div className="flex flex-col items-center gap-3">
                      <button 
                        onClick={() => speak(targetItem.spoken || targetItem.speak)} 
                        className="bg-sky-500 text-white px-6 py-2 rounded-full font-bold text-lg hover:bg-sky-600 transition-all shadow-md flex items-center gap-2"
                      >
                        <Volume2Icon /> שמע שוב
                      </button>
                      <div className="h-8 mt-2">
                        {feedback === 'correct' && <div className="text-2xl font-black text-green-500 animate-bounce">כל הכבוד! 🎉</div>}
                        {feedback === 'wrong' && <div className="text-xl font-bold text-red-500 animate-pulse">נסה שוב! 💪</div>}
                      </div>
                    </div>
                  )}
                </div>
              )}

              {mode === 'songs' && videos.length > 0 && (() => {
                const activeVideo = videos[selectedVideoIndex] || videos[0];
                return (
                  <div className="w-full max-w-4xl flex flex-col items-center gap-6 animate-fade-in-up">
                    {/* בחירת שיר במידה ויש יותר משיר אחד */}
                    {videos.length > 1 && (
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 w-full">
                        {videos.map((vid, idx) => {
                          const isSelected = idx === selectedVideoIndex;
                          return (
                            <button
                              key={vid.id}
                              type="button"
                              onClick={() => setSelectedVideoIndex(idx)}
                              className={`flex items-center gap-3 p-3 rounded-2xl border-4 transition-all text-right cursor-pointer ${
                                isSelected
                                  ? `bg-white ${theme.border} ring-4 ring-amber-300 shadow-lg scale-[1.02]`
                                  : 'bg-gray-50 border-transparent hover:bg-white hover:shadow-md opacity-80 hover:opacity-100'
                              }`}
                            >
                              <div className="relative w-20 aspect-video rounded-xl overflow-hidden shrink-0 bg-amber-100 flex items-center justify-center">
                                {!failedThumbs[vid.id] ? (
                                  <img
                                    src={`https://i.ytimg.com/vi/${vid.videoId}/mqdefault.jpg`}
                                    alt={vid.title}
                                    onError={() => setFailedThumbs(prev => ({ ...prev, [vid.id]: true }))}
                                    className="w-full h-full object-cover"
                                  />
                                ) : (
                                  <span className="text-2xl">🎵</span>
                                )}
                              </div>
                              <span className={`font-bold text-sm md:text-base leading-snug ${isSelected ? theme.textSub : 'text-gray-700'}`}>
                                {vid.title}
                              </span>
                            </button>
                          );
                        })}
                      </div>
                    )}

                    {/* נגן וידאו פנימי מובנה */}
                    <div className={`w-full max-w-3xl bg-black rounded-3xl overflow-hidden shadow-2xl border-4 ${theme.border} aspect-video`}>
                      <iframe
                        key={activeVideo.videoId}
                        className="w-full h-full"
                        src={`https://www.youtube.com/embed/${activeVideo.videoId}?rel=0`}
                        title={activeVideo.title}
                        frameBorder="0"
                        referrerPolicy="strict-origin-when-cross-origin"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                        allowFullScreen
                      />
                    </div>

                    <div className="flex flex-col items-center gap-2 text-center">
                      <h3 className={`text-xl md:text-2xl font-black ${theme.textSub}`}>
                        {activeVideo.title}
                      </h3>
                      <a
                        href={`https://www.youtube.com/watch?v=${activeVideo.videoId}`}
                        target="_blank"
                        rel="noopener noreferrer"
                        className="text-xs md:text-sm font-semibold text-gray-400 hover:text-gray-600 underline transition-colors"
                      >
                        בדיקה מקומית לפני העלאה לאתר? לחצו כאן לפתיחה ישירה ביוטיוב
                      </a>
                    </div>
                  </div>
                );
              })()}
              
              {mode !== 'songs' && (
                <div className="flex flex-wrap justify-center gap-3 md:gap-4 max-w-4xl">
                  {(mode === 'practice' && targetItem ? practiceOptions : items).map(item => {
                     const isDisabled = mode === 'practice' && !targetItem;
                     const element = renderItem(item, (e) => {
                         if (e && e.currentTarget) e.currentTarget.blur();
                         handleItemClick(item);
                     }, isDisabled);
                     return <React.Fragment key={`${mode}-${roundId}-${item.id}`}>{element}</React.Fragment>;
                  })}
                </div>
              )}
            </div>
          );
        };

        // --- Word Combinations Module ---
        const WordCombinationsModule = () => {
          const [shuffledData] = useState(() => [...WORD_COMBINATIONS].sort(() => 0.5 - Math.random()));
          const [currentIndex, setCurrentIndex] = useState(0);
          const [isAnswerRevealed, setIsAnswerRevealed] = useState(false);
          
          const [preferredVoice, setPreferredVoice] = useState(null);
          const preferredVoiceRef = React.useRef(null);
          const timeoutRef = React.useRef(null);
          const spokenRef = React.useRef(false);

          useEffect(() => { preferredVoiceRef.current = preferredVoice; }, [preferredVoice]);

          useEffect(() => {
            const initVoice = () => {
              const availableVoices = window.speechSynthesis.getVoices();
              if (availableVoices.length > 0) {
                const langVoices = availableVoices.filter(v => 
                  v.lang.startsWith('he') || v.lang.includes('iw') || v.name.includes('Hebrew') || v.name.includes('עברית')
                );
                const bestVoice = langVoices.find(v => 
                  v.name.includes('Google') || v.name.includes('Natural') || v.name.toLowerCase().includes('female')
                ) || langVoices[0];
                if (bestVoice) setPreferredVoice(bestVoice);
              }
            };
            initVoice();
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
              window.speechSynthesis.onvoiceschanged = initVoice;
            }
            return () => { if (timeoutRef.current) clearTimeout(timeoutRef.current); };
          }, []);

          const speak = (text) => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(text);
                const voice = preferredVoiceRef.current;
                utterance.lang = (voice && voice.lang.includes('iw')) ? 'iw-IL' : 'he-IL';
                if (voice) utterance.voice = voice;
                utterance.pitch = 1.3;
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
              }, 150); 
            }
          };

          useEffect(() => {
             if (preferredVoice && !spokenRef.current) {
                spokenRef.current = true;
                setTimeout(() => speak('מָה יוֹצֵא מֵהַחִבּוּר שֶׁל שְׁתֵּי הַמִּילִים?'), 600);
             }
          }, [preferredVoice]);

          const handleNext = () => {
            if (timeoutRef.current) clearTimeout(timeoutRef.current);
            if (currentIndex < shuffledData.length - 1) {
              setCurrentIndex(prev => prev + 1);
              setIsAnswerRevealed(false);
            }
          };
          
          const handlePrev = () => {
            if (timeoutRef.current) clearTimeout(timeoutRef.current);
            if (currentIndex > 0) {
              setCurrentIndex(prev => prev - 1);
              setIsAnswerRevealed(false);
            }
          };

          const handleReveal = () => {
            setIsAnswerRevealed(true);
            speak(combo.resultSpeak || combo.result);
            
            if (timeoutRef.current) clearTimeout(timeoutRef.current);
            timeoutRef.current = setTimeout(() => {
               setCurrentIndex(prev => {
                  if (prev < shuffledData.length - 1) {
                     setIsAnswerRevealed(false);
                     return prev + 1;
                  }
                  return prev;
               });
            }, 2500);
          };

          const combo = shuffledData[currentIndex];

          return (
            <div className="flex flex-col items-center w-full max-w-3xl mx-auto">
              <div 
                className="bg-pink-100 border-4 border-pink-300 rounded-full px-6 py-3 flex items-center shadow-md w-max justify-center mb-8 cursor-pointer transform hover:scale-105 transition-transform gap-3"
                onClick={() => speak('מָה יוֹצֵא מֵהַחִבּוּר שֶׁל שְׁתֵּי הַמִּילִים?')}
              >
                <Volume2Icon />
                <span className="text-xl md:text-2xl font-bold text-pink-600">מה יוצא מהחיבור של שתי המילים?</span>
              </div>
              <div className="flex flex-wrap items-center justify-center gap-3 md:gap-6 mb-12">
                {/* Word 1 (Clickable to hear the word) */}
                <button
                  type="button"
                  onClick={(e) => {
                    if (e && e.currentTarget) e.currentTarget.blur();
                    speak(combo.w1Speak || combo.w1);
                  }}
                  className="bg-pink-50 border-4 border-pink-200 rounded-3xl p-4 md:p-8 flex flex-col items-center shadow-lg w-28 h-40 md:w-40 md:h-56 justify-center transform transition-transform hover:scale-105 cursor-pointer"
                >
                  <span className="text-5xl md:text-7xl mb-3 md:mb-6">{combo.e1}</span>
                  <span className="text-xl md:text-3xl font-black text-pink-600 text-center">{combo.w1}</span>
                </button>
                
                <div className="text-4xl md:text-6xl font-black text-pink-400 mt-4">+</div>

                {/* Word 2 (Clickable to hear the word) */}
                <button
                  type="button"
                  onClick={(e) => {
                    if (e && e.currentTarget) e.currentTarget.blur();
                    speak(combo.w2Speak || combo.w2);
                  }}
                  className="bg-pink-50 border-4 border-pink-200 rounded-3xl p-4 md:p-8 flex flex-col items-center shadow-lg w-28 h-40 md:w-40 md:h-56 justify-center transform transition-transform hover:scale-105 cursor-pointer"
                >
                  <span className="text-5xl md:text-7xl mb-3 md:mb-6">{combo.e2}</span>
                  <span className="text-xl md:text-3xl font-black text-pink-600 text-center">{combo.w2}</span>
                </button>
                
                <div className="text-4xl md:text-6xl font-black text-pink-400 mt-4">=</div>
                
                {/* Guess / Answer Box */}
                <button 
                  onClick={(e) => {
                      if (e && e.currentTarget) e.currentTarget.blur();
                      if (!isAnswerRevealed) handleReveal(); else speak(combo.resultSpeak || combo.result);
                  }}
                  className={`border-4 rounded-3xl p-2 md:p-4 flex flex-col items-center justify-center w-28 h-40 md:w-40 md:h-56 transform transition-all hover:scale-105 cursor-pointer ${isAnswerRevealed ? 'bg-pink-100 border-pink-300 shadow-lg' : 'bg-gray-100 border-dashed border-gray-300 shadow-inner'}`}
                >
                  {!isAnswerRevealed ? (
                    <>
                      <span className="text-5xl md:text-7xl font-black text-gray-300">❓</span>
                      <span className="mt-2 text-xs md:text-base font-bold text-gray-400 text-center">לחצו לתשובה!</span>
                    </>
                  ) : (
                    <>
                      <span className="text-5xl md:text-7xl mb-2 md:mb-4 animate-fade-in-up">{combo.resultEmoji}</span>
                      <span className="text-base md:text-2xl font-black text-pink-600 text-center animate-fade-in-up leading-tight">{combo.result}</span>
                    </>
                  )}
                </button>
              </div>

              <div className="flex gap-4 md:gap-8 w-full justify-center">
                <button 
                  onClick={handlePrev} 
                  disabled={currentIndex === 0}
                  className={`px-6 py-3 md:px-10 md:py-4 rounded-full font-bold text-lg md:text-xl transition-all shadow-md ${currentIndex === 0 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-pink-100 text-pink-700 hover:bg-pink-200 hover:shadow-lg'}`}
                >
                  הקודם
                </button>
                <button 
                  onClick={handleNext} 
                  disabled={currentIndex === shuffledData.length - 1}
                  className={`px-6 py-3 md:px-10 md:py-4 rounded-full font-bold text-lg md:text-xl transition-all shadow-md ${currentIndex === shuffledData.length - 1 ? 'bg-gray-200 text-gray-400 cursor-not-allowed' : 'bg-pink-500 text-white hover:bg-pink-600 hover:shadow-lg'}`}
                >
                  הבא
                </button>
              </div>
              
              <div className="mt-8 text-pink-400 font-bold text-lg">
                {currentIndex + 1} מתוך {shuffledData.length}
              </div>
            </div>
          );
        };

        // --- Opposites Module (Text Only, No Images) ---
        const OppositesModule = () => {
          const [shuffledData] = useState(() => [...OPPOSITES_DATA].sort(() => 0.5 - Math.random()));
          const [currentIndex, setCurrentIndex] = useState(0);
          const [isAnswerRevealed, setIsAnswerRevealed] = useState(false);

          const [preferredVoice, setPreferredVoice] = useState(null);
          const preferredVoiceRef = React.useRef(null);
          const timeoutRef = React.useRef(null);
          const spokenIndexRef = React.useRef(-1);

          useEffect(() => { preferredVoiceRef.current = preferredVoice; }, [preferredVoice]);

          useEffect(() => {
            const initVoice = () => {
              const availableVoices = window.speechSynthesis.getVoices();
              if (availableVoices.length > 0) {
                const langVoices = availableVoices.filter(v =>
                  v.lang.startsWith('he') || v.lang.includes('iw') || v.name.includes('Hebrew') || v.name.includes('עברית')
                );
                const bestVoice = langVoices.find(v =>
                  v.name.includes('Google') || v.name.includes('Natural') || v.name.toLowerCase().includes('female')
                ) || langVoices[0];
                if (bestVoice) setPreferredVoice(bestVoice);
              }
            };
            initVoice();
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
              window.speechSynthesis.onvoiceschanged = initVoice;
            }
            return () => { if (timeoutRef.current) clearTimeout(timeoutRef.current); };
          }, []);

          const speak = (text) => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(text);
                const voice = preferredVoiceRef.current;
                utterance.lang = (voice && voice.lang.includes('iw')) ? 'iw-IL' : 'he-IL';
                if (voice) utterance.voice = voice;
                utterance.pitch = 1.3;
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
              }, 150);
            }
          };

          const current = shuffledData[currentIndex];

          useEffect(() => {
            if (spokenIndexRef.current !== currentIndex) {
              spokenIndexRef.current = currentIndex;
              setTimeout(() => {
                speak(`מה ההפך של ${current.w1Speak || current.w1}?`);
              }, 600);
            }
          }, [currentIndex, current]);

          const handleNext = () => {
            if (timeoutRef.current) clearTimeout(timeoutRef.current);
            if (currentIndex < shuffledData.length - 1) {
              setCurrentIndex(prev => prev + 1);
              setIsAnswerRevealed(false);
            }
          };

          const handlePrev = () => {
            if (timeoutRef.current) clearTimeout(timeoutRef.current);
            if (currentIndex > 0) {
              setCurrentIndex(prev => prev - 1);
              setIsAnswerRevealed(false);
            }
          };

          const handleReveal = () => {
            setIsAnswerRevealed(true);
            speak(current.w2Speak || current.w2);
            if (timeoutRef.current) clearTimeout(timeoutRef.current);
            timeoutRef.current = setTimeout(() => {
              setCurrentIndex(prev => {
                if (prev < shuffledData.length - 1) {
                  setIsAnswerRevealed(false);
                  return prev + 1;
                }
                return prev;
              });
            }, 2000);

                const bestVoice = langVoices.find(v =>
                  v.name.includes('Google') || v.name.includes('Natural') || v.name.toLowerCase().includes('female')
                ) || langVoices[0];
                if (bestVoice) setPreferredVoice(bestVoice);
              }
            };
            initVoice();
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
              window.speechSynthesis.onvoiceschanged = initVoice;
            }
          }, []);

          const speak = (text) => {
            if ('speechSynthesis' in window) {
              window.speechSynthesis.cancel();
              setTimeout(() => {
                const utterance = new SpeechSynthesisUtterance(text);
                const voice = preferredVoiceRef.current;
                utterance.lang = (voice && voice.lang.includes('iw')) ? 'iw-IL' : 'he-IL';
                if (voice) utterance.voice = voice;
                utterance.pitch = 1.3;
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
              }, 150);
            }
          };

          const handleNext = () => {
            setCurrentIndex((prev) => (prev + 1) % shuffledData.length);
          };

          const handlePrev = () => {
            setCurrentIndex((prev) => (prev - 1 + shuffledData.length) % shuffledData.length);
          };

          const current = shuffledData[currentIndex];

          useEffect(() => {
            const choices = [current.match, ...current.distractors].sort(() => Math.random() - 0.5);
            setOptions(choices);
            setFeedback(null);
          }, [currentIndex, current]);

          useEffect(() => {
            if (spokenIndexRef.current !== currentIndex) {
              spokenIndexRef.current = currentIndex;
              setTimeout(() => {
                speak(`מה מתחיל בְּ... ${current.soundSpeak}?`);
              }, 600);
            }
          }, [currentIndex, current]);

          const handleGuess = (item) => {
            if (feedback === 'correct') return;

            speak(item.speak || item.w);

            if (item.w === current.match.w) {
              setFeedback('correct');
              setTimeout(() => {
                handleNext();
              }, 1500);
            } else {
              setFeedback('wrong');
              setTimeout(() => {
                speak('נַסּוּ שׁוּב');
              }, 800);
            }
          };

          return (
            <div className="flex flex-col items-center w-full max-w-3xl mx-auto">
              {/* Target Area */}
              <div
                className="bg-pink-100 border-4 border-pink-300 rounded-3xl p-6 flex flex-col items-center shadow-lg w-56 h-64 md:w-64 justify-center mb-10 cursor-pointer transform hover:scale-105 transition-transform"
                onClick={() => speak(`מה מתחיל בְּ... ${current.soundSpeak}?`)}
              >
                <span className="text-xl md:text-2xl font-bold text-pink-500 mb-2 text-center">מה מתחיל ב-</span>
                <span className="text-7xl md:text-8xl mb-4 font-black text-pink-700 leading-none">{current.soundDisplay}</span>
                <div className="bg-pink-200 text-pink-600 px-4 py-2 rounded-full font-bold flex items-center gap-2 mt-2">
                  <Volume2Icon /> שמע שוב
                </div>
              </div>

              {/* Options Grid */}
              <div className="grid grid-cols-2 gap-4 md:gap-8 w-full max-w-lg mb-10">
                {options.map((opt, i) => {
                  const isCorrect = feedback === 'correct' && opt.w === current.match.w;
                  const isWrong = feedback === 'wrong' && opt.w !== current.match.w;
                  return (
                    <button
                      key={`sound-${currentIndex}-${i}-${opt.w}`}
                      onClick={(e) => {
                        if (e && e.currentTarget) e.currentTarget.blur();
                        handleGuess(opt);
                      }}
                      className={`
                        bg-white border-4 rounded-3xl p-4 flex flex-col items-center justify-center h-36 md:h-48 shadow-md hover:shadow-xl hover:scale-105 transition-all
                        ${isCorrect ? 'border-green-400 bg-green-50 shadow-green-200' : 'border-gray-200'}
                        ${isWrong ? 'opacity-50 scale-95 border-red-200' : ''}
                      `}
                    >
                      <span className={`text-6xl md:text-7xl mb-3 ${isCorrect ? 'animate-bounce' : ''}`}>{opt.e}</span>
                      <span className={`text-xl md:text-2xl font-bold ${isCorrect ? 'text-green-600' : 'text-gray-700'}`}>{opt.w}</span>
                    </button>
                  );
                })}
              </div>

              <div className="flex gap-4 md:gap-8 w-full justify-center">
                <button
                  onClick={handlePrev}
                  className="px-6 py-3 md:px-10 md:py-4 rounded-full font-bold text-lg md:text-xl transition-all shadow-md bg-pink-100 text-pink-700 hover:bg-pink-200 hover:shadow-lg"
                >
                  הקודם
                </button>
                <button
                  onClick={handleNext}
                  className="px-6 py-3 md:px-10 md:py-4 rounded-full font-bold text-lg md:text-xl transition-all shadow-md bg-pink-500 text-white hover:bg-pink-600 hover:shadow-lg"
                >
                  הבא
                </button>
              </div>

              <div className="mt-8 text-pink-400 font-bold text-lg">
                {currentIndex + 1} מתוך {shuffledData.length}
              </div>
            </div>
          );
        };

        // --- Main App Component ---
        const App = () => {
          const [activeItem, setActiveItem] = useState(null);
          const [activeCategoryTheme, setActiveCategoryTheme] = useState(null);
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

          const handleSelectItem = (item, category) => {
            setActiveItem(item);
            setActiveCategoryTheme(category.theme);
            setIsMobileMenuOpen(false);
          };

          const renderInteractiveContent = () => {
            switch(activeItem.id) {
              case 'ar-colors':
                return <InteractiveModule key={activeItem.id} items={ARABIC_COLORS} lang="ar-SA" themeClass="emerald" renderItem={renderColorItem} />;
              case 'ar-animals':
                return <InteractiveModule key={activeItem.id} items={ARABIC_ANIMALS} lang="ar-SA" themeClass="emerald" renderItem={renderAnimalItem('emerald')} />;
              case 'ar-body':
                return <InteractiveModule key={activeItem.id} items={ARABIC_BODY_PARTS} lang="ar-SA" themeClass="emerald" renderItem={renderAnimalItem('emerald')} />;
              case 'ar-family':
                return <InteractiveModule key={activeItem.id} items={ARABIC_FAMILY} lang="ar-SA" themeClass="emerald" renderItem={renderAnimalItem('emerald')} />;
              case 'ar-rosh-hashana':
                return <InteractiveModule key={activeItem.id} items={ARABIC_ROSH_HASHANA} lang="ar-SA" themeClass="emerald" renderItem={renderAnimalItem('emerald')} />;
              case 'ar-days':
                return <InteractiveModule key={activeItem.id} items={ARABIC_DAYS} lang="ar-SA" themeClass="emerald" renderItem={renderTextCardItem('emerald', 'w-16 h-16 md:w-24 md:h-24', 'text-2xl md:text-4xl')} />;
              case 'ar-numbers':
                return <InteractiveModule key={activeItem.id} items={ARABIC_NUMBERS} lang="ar-SA" themeClass="emerald" renderItem={renderTextCardItem('emerald', 'w-16 h-16 md:w-24 md:h-24', 'text-2xl md:text-4xl')} />;
              case 'en-colors':
                return <InteractiveModule key={activeItem.id} items={ENGLISH_COLORS} lang="en-US" themeClass="blue" renderItem={renderColorItem} />;
              case 'en-animals':
                return <InteractiveModule key={activeItem.id} items={ENGLISH_ANIMALS} lang="en-US" themeClass="blue" renderItem={renderAnimalItem('blue')} />;
              case 'heb-letters':
                return <InteractiveModule key={activeItem.id} items={HEBREW_LETTERS} videos={HEBREW_LETTERS_SONGS} lang="he-IL" themeClass="pink" renderItem={renderTextCardItem('pink', 'w-16 h-16 md:w-24 md:h-24', 'text-2xl md:text-4xl')} />;
              case 'heb-rhymes':
                return <RhymesGame key={activeItem.id} />;
              case 'heb-sounds':
                return <StartingSoundsGame key={activeItem.id} />;
              case 'en-numbers':
                return <InteractiveModule key={activeItem.id} items={ENGLISH_NUMBERS} lang="en-US" themeClass="blue" renderItem={renderTextCardItem('blue', 'w-16 h-16 md:w-24 md:h-24', 'text-2xl md:text-4xl')} />;
              case 'math-30':
                return <InteractiveModule key={activeItem.id} items={MATH_NUMBERS} videos={MATH_NUMBERS_SONGS} lang="he-IL" themeClass="purple" renderItem={renderTextCardItem('purple', 'w-14 h-14 md:w-20 md:h-20', 'text-xl md:text-2xl')} />;
              case 'math-count':
                return <CountingGame key={activeItem.id} />;
              case 'math-compare':
                return <ComparisonGame key={activeItem.id} />;
              case 'heb-combinations':
                return <WordCombinationsModule key={activeItem.id} />;
              case 'heb-opposites':
                return <OppositesModule key={activeItem.id} />;
              default:
                return (
                  <div className="flex flex-col items-center">
                    <div className="w-24 h-2 bg-amber-400 rounded-full mb-8"></div>
                    <p className="text-xl md:text-2xl leading-relaxed text-gray-600 font-medium bg-amber-50/50 p-6 rounded-2xl border-2 border-dashed border-amber-200">
                      {activeItem.content}
                    </p>
                    <div className="mt-12 grid grid-cols-2 md:grid-cols-4 gap-4">
                      {['🌟','🎈','🎨','🧸'].map((emoji, i) => (
                        <div key={i} className="aspect-square w-20 h-20 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200 flex items-center justify-center text-4xl hover:scale-110 transition-transform cursor-pointer hover:bg-white hover:shadow-md">
                           {emoji}
                        </div>
                      ))}
                    </div>
                  </div>
                );
            }
          };

          const isInteractive = ['ar-colors', 'ar-animals', 'ar-body', 'ar-family', 'ar-rosh-hashana', 'ar-days', 'ar-numbers', 'en-colors', 'en-animals', 'heb-letters', 'en-numbers', 'math-30', 'math-count', 'math-compare', 'heb-combinations', 'heb-rhymes', 'heb-sounds', 'heb-opposites'].includes(activeItem?.id);
          const themeStyles = activeCategoryTheme ? getThemeClasses(activeCategoryTheme) : null;

          return (
            <div className="min-h-screen flex flex-col md:flex-row bg-amber-50 h-screen overflow-hidden">
              
              {/* Header (Mobile) */}
              <div className="md:hidden bg-white shadow-sm p-4 flex justify-between items-center z-20 shrink-0">
                <div className="flex items-center text-amber-600 font-bold text-xl">
                  <span className="text-2xl ml-2">🌸</span> גן יסמין
                </div>
                <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 bg-amber-100 text-amber-700 rounded-full hover:bg-amber-200 transition-colors">
                  {isMobileMenuOpen ? <XIcon /> : <MenuIcon />}
                </button>
              </div>

              {/* Sidebar */}
              <nav className={`
                ${isMobileMenuOpen ? 'translate-x-0' : 'translate-x-full'} 
                md:translate-x-0 transition-transform duration-300 ease-in-out
                absolute md:relative top-0 right-0 w-72 h-full bg-white shadow-xl md:shadow-lg z-30 overflow-y-auto shrink-0
              `}>
                <div className="hidden md:flex items-center p-6 text-amber-600 font-black text-3xl border-b border-amber-100 sticky top-0 bg-white z-10">
                  <span className="text-4xl ml-3 animate-spin-slow">🌸</span> גן יסמין
                </div>
                <div className="p-4 pt-6 space-y-6">
                  {MENU_DATA.map((section, idx) => (
                    <div key={idx} className="space-y-2">
                      <h2 className={`flex items-center font-bold text-lg p-2 rounded-xl ${section.color}`}>
                        <span className="ml-2 text-xl">{section.icon}</span> {section.category}
                      </h2>
                      <ul className="space-y-1 pr-2">
                        {section.items.map((item) => (
                          <li key={item.id}>
                            <button
                              onClick={() => handleSelectItem(item, section)}
                              className={`
                                w-full text-right flex items-center px-4 py-3 rounded-xl transition-all
                                ${activeItem?.id === item.id 
                                  ? `${section.color} font-bold shadow-sm scale-[1.02]` 
                                  : `hover:bg-gray-50 text-gray-600 ${section.hover}`
                                }
                              `}
                            >
                              <span className="ml-3 text-xl inline-flex">{item.icon}</span> {item.title}
                            </button>
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>
              </nav>

              {/* Mobile Overlay */}
              {isMobileMenuOpen && (
                <div className="absolute inset-0 bg-black/20 z-20 md:hidden backdrop-blur-sm" onClick={() => setIsMobileMenuOpen(false)} />
              )}

              {/* Main Content */}
              <main className="flex-1 p-4 md:p-8 overflow-y-auto relative h-full">
                <div className="max-w-5xl mx-auto pb-20">
                  {activeItem ? (
                    <div className="bg-white rounded-3xl shadow-xl p-6 md:p-12 border-4 border-white transform transition-all animate-fade-in-up flex flex-col items-center">
                      <div className={`inline-flex items-center px-4 py-1 rounded-full text-sm font-bold mb-6 bg-${activeCategoryTheme}-100 ${themeStyles?.text}`}>
                        {activeItem.title} {isInteractive && "- אינטראקטיבי"}
                      </div>
                      <h1 className="text-3xl md:text-5xl font-black text-gray-800 mb-8 flex items-center">
                        <span className="ml-4 text-4xl md:text-5xl">{activeItem.icon}</span> {activeItem.title}
                      </h1>
                      {renderInteractiveContent()}
                    </div>
                  ) : (
                    <div className="bg-white rounded-3xl shadow-xl p-8 md:p-16 text-center border-4 border-amber-100 flex flex-col items-center justify-center min-h-[60vh]">
                      <div className="w-24 h-24 md:w-32 md:h-32 bg-amber-100 rounded-full flex items-center justify-center mb-8 shadow-inner">
                        <span className="text-5xl md:text-7xl">🌸</span>
                      </div>
                      <h1 className="text-3xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-orange-400 mb-6">
                        ברוכים הבאים לגן יסמין!
                      </h1>
                      <p className="text-lg md:text-2xl text-gray-500 max-w-lg mx-auto">
                        בחרו נושא מהתפריט בצד ימין כדי להתחיל ללמוד, לשחק ולגלות דברים חדשים.
                      </p>
                      <div className="mt-12 flex space-x-3 space-x-reverse justify-center">
                        <div className="w-3 h-3 rounded-full bg-pink-400 animate-bounce" style={{animationDelay: '0ms'}}></div>
                        <div className="w-3 h-3 rounded-full bg-emerald-400 animate-bounce" style={{animationDelay: '150ms'}}></div>
                        <div className="w-3 h-3 rounded-full bg-blue-400 animate-bounce" style={{animationDelay: '300ms'}}></div>
                        <div className="w-3 h-3 rounded-full bg-purple-400 animate-bounce" style={{animationDelay: '450ms'}}></div>
                      </div>
                    </div>
                  )}
                </div>
              </main>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
