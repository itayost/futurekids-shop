            const nextItem = speechQueueRef.current.shift();
            if (!nextItem) return;

            const myGen = speechGenRef.current;

            if (!voiceEnabledRef.current) {
              if (nextItem.onDone) {
                speechPauseTimerRef.current = setTimeout(() => {
                  if (myGen !== speechGenRef.current) return;
                  speechPauseTimerRef.current = null;
                  nextItem.onDone();
                  processSpeechQueue();
                }, 600);
              } else {
                processSpeechQueue();
              }
              return;
            }

            isSpeakingRef.current = true;
            speak(nextItem.text, {
              cancelPrevious: nextItem.cancelPrevious,
              langOverride: nextItem.lang || 'he-IL',
              onEnd: () => {
                if (myGen !== speechGenRef.current) return;
                speechPauseTimerRef.current = setTimeout(() => {
                  if (myGen !== speechGenRef.current) return;
                  speechPauseTimerRef.current = null;
                  isSpeakingRef.current = false;
                  if (nextItem.onDone) nextItem.onDone();
                  processSpeechQueue();
                }, 260);
              }
            });
          }, [speak]);

          const say = React.useCallback((text, options = {}) => {
            const { interrupt = false, onDone = null, lang = 'he-IL' } = options;
            if (interrupt) {
              speechGenRef.current += 1;
              speechQueueRef.current = [];
              isSpeakingRef.current = false;
              if (speechPauseTimerRef.current) {
                clearTimeout(speechPauseTimerRef.current);
                speechPauseTimerRef.current = null;
              }
            }
            speechQueueRef.current.push({
              text,
              cancelPrevious: interrupt,
              onDone,
              lang
            });
            processSpeechQueue();
          }, [processSpeechQueue]);

          const clearAllTimers = () => {
            timersRef.current.forEach(id => clearTimeout(id));
            timersRef.current = [];
          };

          const schedule = (fn, delay) => {
            const id = setTimeout(fn, delay);
            timersRef.current.push(id);
            return id;
          };

          useEffect(() => {
            return () => {
              clearAllTimers();
              clearSpeechQueue();
            };
          }, [clearSpeechQueue]);

          const refreshChoicesForCircle = (circleCards) => {
            const items = circleCards.map(c => c.item).sort(() => Math.random() - 0.5);
            setChoiceItems(items);
          };

          const clearActiveFocus = () => {
            if (document.activeElement instanceof HTMLElement) {
              document.activeElement.blur();
            }
          };

          const initGame = (selectedTopic = topic, selectedLang = langKey) => {
            clearAllTimers();
            clearSpeechQueue();
            clearActiveFocus();

            const activeLang = selectedTopic === 'objects' ? 'he' : selectedLang;
            const prompts = getSherlockTopicPrompts(selectedTopic);
            const fullDeck = createSherlockDeck(selectedTopic, activeLang);
            const initialCircle = fullDeck.slice(0, 8).map(c => ({
              ...c,
              isRevealed: true
            }));
            const remainingDeck = fullDeck.slice(8);

            setCircle(initialCircle);
            setDeck(remainingDeck);
            refreshChoicesForCircle(initialCircle);
            setSherlockPos(0);
            setWonCards([]);
            setWrongGuessChoiceId(null);
            setExpectedTargetPos(null);
            setWrongTargetPos(null);
            setNewCardPos(null);
            setTurnId(prev => prev + 1);
            setPhase('memorize');
            setPromptText(prompts.memorizeText);
            say(prompts.memorizeSpeak, { interrupt: true, lang: 'he-IL' });
          };

          useEffect(() => {
            initGame(topic, langKey);
          }, [topic, langKey]);

          const handleFlipCardsToStart = (e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            clearActiveFocus();
            if (phase !== 'memorize') return;
            clearAllTimers();

            const wasSingleNewCard = newCardPos !== null;
            setCircle(prev => prev.map(c => ({ ...c, isRevealed: false })));
            setNewCardPos(null);
            setTurnId(prev => prev + 1);
            setPhase('guessing');
            setPromptText(
              wasSingleNewCard
                ? topicPrompts.questionAfterFlipSingle
                : topicPrompts.questionAfterFlipAll
            );
            say(topicPrompts.questionSpeak, { interrupt: true, lang: 'he-IL' });
          };

          const finishGame = (finalWonCards) => {
            clearAllTimers();
            clearActiveFocus();
            setPromptText(`החקירה הסתיימה! סיימתם את כל הקופה ואספתם ${finalWonCards.length} קלפים!`);
            say('כּוֹל הַכָּבוֹד! סִיַּמְתֶּם אֶת כּוֹל הַקּוּפָּה!', { interrupt: false, lang: 'he-IL' });
            setPhase('game_over');
          };

          // Animate Sherlock walking `steps` in direction `dir` (1 = clockwise, -1 = counter-clockwise)
          const walkSherlock = (startPos, steps, dir, currentCircle, currentDeck, currentWon) => {
            clearAllTimers();
            clearActiveFocus();
            setPhase('moving');
            setWrongGuessChoiceId(null);
            setWrongTargetPos(null);
            const dirLabel = dir === 1 ? 'עם כיוון השעון' : 'נגד כיוון השעון';
            setPromptText(`מצוין! שרלוק צועד ${steps} צעדים ${dirLabel}...`);

            for (let s = 1; s <= steps; s++) {
              schedule(() => {
                const nextIdx = (startPos + s * dir + 80) % 8;
                setSherlockPos(nextIdx);

                if (s === steps) {
                  schedule(() => {
                    const landedCard = currentCircle[nextIdx];
                    if (landedCard.isRevealed) {
                      handleLandOnRevealedCard(nextIdx, landedCard, currentCircle, currentDeck, currentWon);
                    } else {
                      setTurnId(prev => prev + 1);
                      setPhase('guessing');
                      setPromptText(topicPrompts.questionText);
                      say(topicPrompts.questionSpeak, { interrupt: false, lang: 'he-IL' });
                    }
                  }, 320);
                }
              }, s * 360);
            }
          };

          const handleLandOnRevealedCard = (pos, wonCard, currentCircle, currentDeck, currentWon) => {
            const nextWon = [...currentWon, wonCard];
            setWonCards(nextWon);
            setPhase('won_card');

            if (currentDeck.length === 0) {
              setPromptText('שרלוק עצר ליד קלף גלוי – זכיתם בקלף והקופה הסתיימה!');
              say('זָכִיתֶם בַּקְּלָף!', {
                interrupt: false,
                lang: 'he-IL',
                onDone: () => {
                  schedule(() => finishGame(nextWon), 400);
                }
              });
              return;
            }

            setPromptText('שרלוק עצר ליד קלף גלוי – זכיתם בקלף! מיד נניח קלף חדש מהקופה.');
            say('זָכִיתֶם בַּקְּלָף!', {
              interrupt: false,
              lang: 'he-IL',
              onDone: () => {
                schedule(() => {
                  // מציגים את הקלף החדש גלוי במקומו במעגל כדי שהילד ישנן אותו וילחץ על התחלה כמו בסבב הראשון
                  const replacementCard = { ...currentDeck[0], isRevealed: true };
                  const updatedDeck = currentDeck.slice(1);
                  const updatedCircle = currentCircle.map((c, idx) =>
                    idx === pos ? replacementCard : { ...c, isRevealed: false }
                  );
                  const nextStartPos = (pos + 1) % 8;

                  clearActiveFocus();
                  setCircle(updatedCircle);
                  setDeck(updatedDeck);
                  refreshChoicesForCircle(updatedCircle);
                  setSherlockPos(nextStartPos);
                  setNewCardPos(pos);
                  setTurnId(prev => prev + 1);
                  setPhase('memorize');
                  setPromptText(`קלף חדש הונח במעגל: ${replacementCard.item.name}! שננו את מיקומו וכשאתם מוכנים לחצו על "התחלה".`);

                  if (itemSpeechLang === 'he-IL') {
                    say(`קְלָף חָדָשׁ בַּמַּעְגָּל: ${replacementCard.item.speak}. זִכְרוּ אֵיפֹה הוּא נִמְצָא וְלִחְצוּ עַל הַתְחָלָה`, { interrupt: false, lang: 'he-IL' });
                  } else {
                    say('קְלָף חָדָשׁ בַּמַּעְגָּל', { interrupt: false, lang: 'he-IL' });
                    say(replacementCard.item.speak, { interrupt: false, lang: itemSpeechLang });
                    say('זִכְרוּ אֵיפֹה הוּא נִמְצָא וְלִחְצוּ עַל הַתְחָלָה', { interrupt: false, lang: 'he-IL' });
                  }
                }, 400);
              }
            });
          };

          const handleGuessObject = (guessedItem, e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            clearActiveFocus();
            if (phase !== 'guessing') return;

            const targetCard = circle[sherlockPos];
            if (!targetCard) return;

            const revealedCircle = circle.map((c, idx) =>
              idx === sherlockPos ? { ...c, isRevealed: true } : c
            );
            setCircle(revealedCircle);

            if (guessedItem.id === targetCard.item.id) {
              const nextSteps = targetCard.steps;
              const nextDir = targetCard.dir;
              const dirText = nextDir === 1 ? 'עם כיוון השעון' : 'נגד כיוון השעון';
              const targetIdx = (sherlockPos + nextSteps * nextDir + 80) % 8;
              const stepSpokenMap = {
                1: 'צַעַד אֶחָד',
                2: 'שְׁנֵי צְעָדִים',
                3: 'שְׁלוֹשָׁה צְעָדִים',
                4: 'אַרְבָּעָה צְעָדִים',
                5: 'חֲמִישָּׁה צְעָדִים'
              };

              setExpectedTargetPos(targetIdx);
              setWrongTargetPos(null);
              setTurnId(prev => prev + 1);
              setPhase('pick_target');
              setPromptText(`פגיעה מדויקת! בקלף מופיע המספר ${nextSteps} (${dirText}) – לחצו על הקלף במעגל שאליו שרלוק צריך להגיע!`);

              if (topic === 'objects') {
                say(`פְּגִיעָה מְדֻיֶּקֶת! סִפְרוּ ${stepSpokenMap[nextSteps]} בכיוון הַחֵץ וְלִחְצוּ עַל הַקְּלָף הַנָּכוֹן`, { interrupt: true, lang: 'he-IL' });
              } else if (itemSpeechLang === 'he-IL') {
                say(`${guessedItem.speak}! פְּגִיעָה מְדֻיֶּקֶת! סִפְרוּ ${stepSpokenMap[nextSteps]} בכיוון הַחֵץ וְלִחְצוּ עַל הַקְּלָף הַנָּכוֹן`, { interrupt: true, lang: 'he-IL' });
              } else {
                say(guessedItem.speak, { interrupt: true, lang: itemSpeechLang });
                say(`פְּגִיעָה מְדֻיֶּקֶת! סִפְרוּ ${stepSpokenMap[nextSteps]} בכיוון הַחֵץ וְלִחְצוּ עַל הַקְּלָף הַנָּכוֹן`, { interrupt: false, lang: 'he-IL' });
              }
            } else {
              clearAllTimers();
              setWrongGuessChoiceId(guessedItem.id);
              setPhase('wrong_reveal');
              setPromptText('לא הפעם! זכרו את הרמז להמשך.');

              let minDelayDone = false;
              let speechDone = false;
              const advanceAfterWrong = () => {
                if (!minDelayDone || !speechDone) return;
                const flippedBackCircle = revealedCircle.map(c => ({ ...c, isRevealed: false }));
                const nextPos = (sherlockPos + 1) % 8;
                clearActiveFocus();
                setCircle(flippedBackCircle);
                setSherlockPos(nextPos);
                setWrongGuessChoiceId(null);
                setTurnId(prev => prev + 1);
                setPhase('guessing');
                setPromptText(topicPrompts.questionAfterWrong);
                say(topicPrompts.questionSpeak, { interrupt: false, lang: 'he-IL' });
              };

              schedule(() => {
                minDelayDone = true;
                advanceAfterWrong();
              }, 1900);

              say('לֹא הַפַּעַם', {
                interrupt: true,
                lang: 'he-IL',
                onDone: () => {
                  speechDone = true;
                  advanceAfterWrong();
                }
              });
            }
          };

          const handleCircleCardClick = (clickedIdx, e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            clearActiveFocus();

            // בשלב השינון לחיצה על קלף גלוי משמיעה את שמו בשפה שנבחרה
            if (phase === 'memorize' && circle[clickedIdx]?.isRevealed) {
              say(circle[clickedIdx].item.speak, { interrupt: true, lang: itemSpeechLang });
              return;
            }

            if (phase !== 'pick_target' || expectedTargetPos === null) return;
            if (clickedIdx === sherlockPos) return;

            const currentCard = circle[sherlockPos];
            if (!currentCard) return;

            if (clickedIdx === expectedTargetPos) {
              setWrongTargetPos(null);
              setExpectedTargetPos(null);
              say('מְצֻיָּן!', { interrupt: true, lang: 'he-IL' });
              walkSherlock(sherlockPos, currentCard.steps, currentCard.dir, circle, deck, wonCards);
            } else {
              setWrongTargetPos(clickedIdx);
              const dirText = currentCard.dir === 1 ? 'עם כיוון השעון' : 'נגד כיוון השעון';
              setPromptText(`לא הקלף הזה... ספרו שוב ${currentCard.steps} צעדים ${dirText} מהקלף של שרלוק ולחצו על הקלף הנכון!`);
              say('נַסּוּ לִסְפּוֹר שׁוּב בכיוון הַחֵץ', { interrupt: true, lang: 'he-IL' });
            }
          };

          // Compute circular coordinates for the 8 cards and for Sherlock's pawn
          const getCircleCoords = (idx, radiusPct) => {
            const angleRad = ((idx * 45) - 90) * (Math.PI / 180);
            return {
              left: `${50 + radiusPct * Math.cos(angleRad)}%`,
              top: `${50 + radiusPct * Math.sin(angleRad)}%`
            };
          };

          // Tangent angle along the ring so the arrow inside each card physically points in Sherlock's travel direction
          const getCardArrowAngle = (idx, dir) => {
            return dir === 1 ? idx * 45 : idx * 45 + 180;
          };

          const sherlockBadgeCoords = getCircleCoords(sherlockPos, 21);

          return (
            <div className="flex flex-col items-center w-full max-w-4xl mx-auto select-none">
              {/* בחירת נושא לשרלוק */}
              <div className="flex flex-wrap items-center justify-center gap-2 mb-3">
                {[
                  { id: 'objects', label: '🕵️‍♂️ חפצים' },
                  { id: 'colors', label: '🎨 צבעים' },
                  { id: 'animals', label: '🐾 חיות' },
                  { id: 'numbers', label: '🔢 מספרים' }
                ].map(t => (
                  <button
                    key={t.id}
                    type="button"
                    onClick={() => setTopic(t.id)}
                    className={`px-4 py-2 rounded-xl font-bold text-sm transition-all ${
                      topic === t.id ? 'bg-orange-500 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                    }`}
                  >
                    {t.label}
                  </button>
                ))}
              </div>

              {/* בחירת שפה (עבור צבעים, חיות ומספרים) + סרגל פעולות */}
              <div className="flex flex-wrap items-center justify-center gap-2.5 mb-4 w-full">
                {topic !== 'objects' && (
                  <div className="flex gap-1.5 bg-gray-100 p-1 rounded-xl">
                    {[
                      { id: 'he', label: 'עברית' },
                      { id: 'ar', label: 'ערבית' },
                      { id: 'en', label: 'אנגלית' }
                    ].map(l => (
                      <button
                        key={l.id}
                        type="button"
                        onClick={() => setLangKey(l.id)}
                        className={`px-3 py-1.5 rounded-lg font-bold text-xs sm:text-sm transition-all ${
                          langKey === l.id ? 'bg-white text-orange-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'
                        }`}
                      >
                        {l.label}
                      </button>
                    ))}
                  </div>
                )}

                <button
                  type="button"
                  onClick={() => setVoiceEnabled(v => !v)}
                  className={`px-4 py-2 rounded-2xl font-bold text-sm border-2 transition-all ${voiceEnabled ? 'bg-amber-50 border-amber-200 text-amber-700' : 'bg-gray-100 border-gray-200 text-gray-400'}`}
                >
                  {voiceEnabled ? '🔊 קול פעיל' : '🔇 מושתק'}
                </button>

                <button
                  type="button"
                  onClick={() => setShowRules(r => !r)}
                  className="px-4 py-2 rounded-2xl bg-sky-50 border-2 border-sky-200 text-sky-700 font-bold text-sm hover:bg-sky-100 transition-all"
                >
                  ❓ הוראות
                </button>

                <button
                  type="button"
                  onClick={() => initGame(topic, langKey)}
                  className="px-4 py-2 rounded-2xl bg-orange-100 text-orange-700 font-bold text-sm hover:bg-orange-200 transition-all"
                >
                  🔄 משחק חדש
                </button>
              </div>

              {/* חלונית הסבר חוקים מתקפלת */}
              {showRules && (
                <div className="w-full max-w-2xl mb-4 bg-sky-50 border-2 border-sky-200 rounded-3xl p-4 text-sm md:text-base text-gray-700 leading-relaxed shadow-sm">
                  <div className="flex justify-between items-center mb-2">
                    <span className="font-black text-sky-800 text-lg">🕵️‍♂️ איך משחקים בשרלוק?</span>
                    <button type="button" onClick={() => setShowRules(false)} className="text-sky-600 font-bold px-2 py-0.5 rounded-lg hover:bg-sky-100">סגור ✕</button>
                  </div>
                  <ul className="list-disc pr-5 space-y-1">
                    <li>כל הקלפים במשחק ייחודיים וללא כפילויות: 8 מונחים במעגל והשאר בקופה המרכזית.</li>
                    <li>בתחילת המשחק מתבוננים ב-8 הקלפים הגלויים במעגל וזוכרים אותם (אפשר גם ללחוץ עליהם כדי לשמוע איך אומרים אותם), ואז לוחצים על <strong>"התחלה"</strong> כדי להפוך את הקלפים.</li>
                    <li>מנחשים מה מסתתר בקלף ההפוך שלידו שרלוק עומד.</li>
                    <li>צדקתם? הקלף נפתח וחושף <strong>מספר וחץ כיוון</strong> – ספרו את הצעדים בכיוון החץ <strong>ולחצו בעצמכם על הקלף שאליו שרלוק צריך להגיע</strong>! טעיתם בניחוש? רואים מה הסתתר בקלף, והקלפים מתהפכים חזרה.</li>
                    <li>הגעתם ליד <strong>קלף שכבר גלוי</strong>? זכיתם בקלף! קלף חדש מהקופה יוצג גלוי במקומו כדי שתוכלו לשנן גם אותו וללחוץ שוב על <strong>"התחלה"</strong> להמשך המשחק.</li>
                  </ul>
                </div>
              )}

              {/* לוח ניקוד של הבלש היחיד */}
              <div className="w-full max-w-md mb-4 rounded-2xl p-3 bg-amber-50 border-4 border-orange-300 shadow-sm flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <span className="text-3xl">🕵️‍♂️</span>
                  <div>
                    <div className="font-black text-gray-800 text-base">הבלש שרלוק</div>
                    <div className="flex flex-wrap gap-1 mt-1 min-h-[22px]">
                      {wonCards.slice(-8).map((c, cIdx) => (
                        <span key={cIdx} className="inline-flex items-center justify-center bg-white rounded-md p-0.5 shadow-sm border border-amber-100">
                          {renderSherlockItemIcon(c.item, 'sm')}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
                <div className="text-center bg-white px-4 py-1.5 rounded-xl border border-amber-200 shadow-sm shrink-0">
                  <div className="text-2xl font-black text-orange-600 leading-none">{wonCards.length}</div>
                  <div className="text-xs font-bold text-gray-500">קלפים שנאספו</div>
                </div>
              </div>

              {/* בועת הנחיה והודעות מערכת */}
              <div
                className={`w-full max-w-2xl mb-5 px-5 py-3 rounded-2xl border-2 text-center font-bold text-base md:text-lg shadow-sm transition-all ${
                  phase === 'pick_target' && wrongTargetPos !== null
                    ? 'bg-orange-50 border-orange-300 text-orange-800'
                    : phase === 'pick_target' || phase === 'won_card'
                      ? 'bg-green-50 border-green-300 text-green-800'
                      : phase === 'wrong_reveal'
                        ? 'bg-red-50 border-red-200 text-red-700'
                        : phase === 'game_over'
                          ? 'bg-amber-100 border-amber-400 text-amber-900 text-xl'
                          : 'bg-indigo-50 border-indigo-200 text-indigo-900'
                }`}
              >
                {promptText}
              </div>

              {/* מעגל 8 הקלפים + הקופה המרכזית + דמות שרלוק */}
              <div className="relative w-[305px] h-[305px] sm:w-[390px] sm:h-[390px] md:w-[450px] md:h-[450px] rounded-full bg-gradient-to-br from-amber-50 via-orange-50/60 to-amber-100/70 border-4 border-amber-200 shadow-inner mb-6 shrink-0">
                {/* מסלול מעגלי מקווקו */}
                <div className="absolute inset-[14%] rounded-full border-2 border-dashed border-amber-300/80 pointer-events-none" />

                {/* קופה מרכזית */}
                <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center pointer-events-none">
                  {deck.length > 0 ? (
                    <div className="w-16 h-20 sm:w-20 sm:h-24 rounded-2xl bg-gradient-to-br from-indigo-700 to-slate-800 border-2 border-amber-300 shadow-lg flex flex-col items-center justify-center text-white overflow-hidden p-1">
                      <span className="text-[10px] sm:text-xs font-bold text-amber-200">קופה</span>
                      <span className="text-xl sm:text-2xl font-black text-amber-300 leading-tight">{deck.length}</span>
                    </div>
                  ) : (
                    <div className="w-16 h-20 sm:w-20 sm:h-24 rounded-2xl border-2 border-dashed border-amber-400 bg-amber-50/70 flex items-center justify-center text-center p-1">
                      <span className="text-[10px] sm:text-xs font-bold text-amber-700 leading-tight">הקופה נגמרה!</span>
                    </div>
                  )}
                </div>

                {/* דמות הבלש שרלוק הצועדת בין הקלפים */}
                <div
                  style={{
                    left: sherlockBadgeCoords.left,
                    top: sherlockBadgeCoords.top,
                    transform: 'translate(-50%, -50%)'
                  }}
                  className="absolute z-20 transition-all duration-300 ease-out pointer-events-none"
                >
                  <div className="w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-amber-300 border-2 border-white shadow-lg flex items-center justify-center text-xl sm:text-2xl">
                    🕵️‍♂️
                  </div>
                </div>

                {/* 8 הקלפים במעגל */}
                {circle.map((card, idx) => {
                  const pos = getCircleCoords(idx, 38);
                  const isSherlockHere = idx === sherlockPos && phase !== 'memorize';
                  const isHighlightedNewCard = phase === 'memorize' && newCardPos === idx;
                  const arrowAngle = getCardArrowAngle(idx, card.dir);
                  const canPickCard = phase === 'pick_target' && idx !== sherlockPos;
                  const canTapToHear = phase === 'memorize' && card.isRevealed;
                  const isCardInteractive = canPickCard || canTapToHear;
                  const isWrongTarget = phase === 'pick_target' && wrongTargetPos === idx;

                  return (
                    <button
                      key={card.uid}
                      type="button"
                      disabled={!isCardInteractive}
                      onClick={(e) => handleCircleCardClick(idx, e)}
                      style={{
                        left: pos.left,
                        top: pos.top
                      }}
                      className={`
                        absolute -translate-x-1/2 -translate-y-1/2 w-[68px] h-[84px] sm:w-[86px] sm:h-[104px] md:w-[98px] md:h-[116px] rounded-2xl overflow-hidden flex flex-col items-center justify-between p-1 sm:p-1.5 transition-all duration-300 focus:outline-none
                        ${card.isRevealed
                          ? 'bg-white border-4 border-emerald-400 shadow-lg'
                          : 'bg-gradient-to-br from-indigo-600 via-indigo-700 to-slate-800 border-4 border-amber-200 text-white shadow-md'
                        }
                        ${isHighlightedNewCard ? 'ring-4 ring-amber-400 scale-110 z-20' : ''}
                        ${isSherlockHere ? 'ring-4 ring-orange-400 scale-105 z-10' : ''}
                        ${phase === 'guessing' && isSherlockHere ? 'ring-4 ring-pink-500 scale-105' : ''}
                        ${canPickCard ? 'cursor-pointer active:scale-95 [@media(hover:hover)]:hover:scale-110 [@media(hover:hover)]:hover:ring-4 [@media(hover:hover)]:hover:ring-sky-400' : canTapToHear ? 'cursor-pointer active:scale-95' : 'cursor-default'}
                        ${isWrongTarget ? 'ring-4 ring-red-500 scale-95 opacity-80' : ''}
                      `}
                    >
                      {!card.isRevealed ? (
                        /* גב הקלף – נקי ללא מספר וללא חץ */
                        <div className="w-full h-full rounded-xl border-2 border-amber-300/35 flex items-center justify-center">
                          <span className="text-2xl sm:text-3xl opacity-90 select-none">🕵️‍♂️</span>
                        </div>
                      ) : (
                        /* פני הכרטיס עצמו – כולל המספר וחץ כיוון ההתקדמות */
                        <div className="w-full h-full flex flex-col items-center justify-between overflow-hidden">
                          <div
                            title={card.dir === 1 ? `${card.steps} צעדים עם כיוון השעון` : `${card.steps} צעדים נגד כיוון השעון`}
                            className={`w-full flex items-center justify-center gap-1 rounded-lg px-1.5 py-0.5 text-xs sm:text-sm font-black ${
                              card.dir === 1
                                ? 'bg-sky-100 text-sky-800'
                                : 'bg-purple-100 text-purple-800'
                            } ${phase === 'pick_target' && isSherlockHere ? 'animate-pulse ring-2 ring-amber-400' : ''}`}
                          >
                            <span>{card.steps}</span>
                            <DirectionArrowSVG angleDeg={arrowAngle} className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
                          </div>

                          <div className="flex items-center justify-center my-auto">
                            {renderSherlockItemIcon(card.item, 'md')}
                          </div>

                          <span className="text-[9px] sm:text-[10px] font-black text-gray-700 text-center leading-tight px-0.5 line-clamp-2 w-full">
                            {card.item.name}
                          </span>
                        </div>
                      )}
                    </button>
                  );
                })}
              </div>

              {/* אזור פעולה תחתון לפי שלב המשחק */}
              <div className="w-full max-w-2xl min-h-[110px] flex flex-col items-center justify-center">
                {phase === 'memorize' && (
                  <button
                    type="button"
                    onClick={handleFlipCardsToStart}
                    className="bg-orange-500 hover:bg-orange-600 text-white font-black text-xl md:text-2xl px-10 py-4 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all flex items-center gap-3"
                  >
                    <span>🔄</span>
                    <span>{newCardPos !== null ? 'התחלה – הפוך את הקלף החדש' : 'התחלה – הפוך את הקלפים'}</span>
                  </button>
                )}

                {phase === 'pick_target' && circle[sherlockPos] && (
                  <div className="bg-sky-50 border-2 border-sky-300 rounded-2xl px-6 py-3 flex items-center gap-3 shadow-sm animate-fade-in-up">
                    <span className="text-3xl">👆</span>
                    <div className="text-sky-900 font-black text-base md:text-lg text-center">
                      ספרו <span className="text-orange-600 text-xl mx-1">{circle[sherlockPos].steps}</span> קלפים{' '}
                      {circle[sherlockPos].dir === 1 ? 'עם כיוון השעון' : 'נגד כיוון השעון'} ולחצו על הקלף במעגל!
                    </div>
                  </div>
                )}

                {(phase === 'guessing' || phase === 'wrong_reveal') && (
                  <div className="w-full">
                    <div className="text-center font-black text-gray-700 mb-3 text-base md:text-lg">
                      {topicPrompts.chooseLabel}
                    </div>
                    <div key={`choices-${turnId}`} className="grid grid-cols-4 sm:grid-cols-8 gap-2 md:gap-2.5">
                      {choiceItems.map(item => {
                        const isWrongPicked = phase === 'wrong_reveal' && wrongGuessChoiceId === item.id;
                        return (
                          <button
                            key={`${turnId}-${item.id}`}
                            type="button"
                            disabled={phase !== 'guessing'}
                            onClick={(e) => handleGuessObject(item, e)}
                            className={`
                              rounded-2xl p-2 md:p-2.5 flex flex-col items-center justify-center transition-all shadow-sm focus:outline-none
                              ${isWrongPicked
                                ? 'bg-red-100 border-2 border-red-400 opacity-75 scale-95'
                                : 'bg-white border-2 border-orange-200 active:scale-95 [@media(hover:hover)]:hover:border-orange-400 [@media(hover:hover)]:hover:bg-orange-50 [@media(hover:hover)]:hover:scale-105 [@media(hover:hover)]:hover:shadow-md cursor-pointer'
                              }
                              ${phase !== 'guessing' ? 'cursor-not-allowed opacity-70' : ''}
                            `}
                          >
                            <div className="h-9 flex items-center justify-center mb-1">
                              {renderSherlockItemIcon(item, 'md')}
                            </div>
                            <span className="text-[10px] md:text-xs font-black text-gray-700 text-center leading-tight line-clamp-2">
                              {item.name}
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                {phase === 'game_over' && (
                  <div className="flex flex-col items-center gap-4 bg-amber-50 border-4 border-amber-300 rounded-3xl px-8 py-6 shadow-md animate-fade-in-up">
                    <div className="text-4xl">🏆🕵️‍♂️🎉</div>
                    <div className="text-xl md:text-2xl font-black text-amber-800 text-center">
                      כל הכבוד! סיימתם את כל הקופה ואספתם {wonCards.length} קלפים!
                    </div>
                    <button
                      type="button"
                      onClick={() => initGame(topic, langKey)}
                      className="bg-orange-500 hover:bg-orange-600 text-white font-black text-lg px-8 py-3 rounded-full shadow-lg transition-all"
                    >
                      שחקו שוב 🔄
                    </button>
                  </div>
                )}
              </div>
            </div>
          );
        };

        // ============================================================================
        // 1. CLACK! GAME (קלאק קלאק - דיסקיות מגנטיות + קוביית צבע וקוביית צורה עם ג'וקר לבן)
        // ============================================================================
        const CLACK_COLORS = [
          { id: 'red', label: 'אדום', speak: 'אָדוֹם', hex: '#EF4444', stroke: '#B91C1C' },
          { id: 'blue', label: 'כחול', speak: 'כָּחוֹל', hex: '#2563EB', stroke: '#1D4ED8' },
          { id: 'green', label: 'ירוק', speak: 'יָרוֹק', hex: '#16A34A', stroke: '#15803D' },
          { id: 'yellow', label: 'צהוב', speak: 'צָהֹב', hex: '#FACC15', stroke: '#CA8A04' },
          { id: 'purple', label: 'סגול', speak: 'סָגֹל', hex: '#9333EA', stroke: '#6B21A8' }
        ];

        const CLACK_SHAPES = [
          { id: 'star', label: 'כוכב', speak: 'כּוֹכָב' },
          { id: 'flower', label: 'פרח', speak: 'פֶּרַח' },
          { id: 'arrow', label: 'חץ', speak: 'חֵץ' },
          { id: 'heart', label: 'לב', speak: 'לֵב' },
          { id: 'bolt', label: 'ברק', speak: 'בָּרָק' }
        ];

        const ClackShapeSVG = ({ shapeId, fillHex = '#334155', strokeHex = '#1E293B', className = 'w-6 h-6' }) => {
          switch (shapeId) {
            case 'star':
              return (
                <svg viewBox="0 0 48 48" className={className}>
                  <polygon
                    points="24,3 30.5,16.5 45,18.5 34.5,29 37,43.5 24,36.5 11,43.5 13.5,29 3,18.5 17.5,16.5"
                    fill={fillHex}
                    stroke={strokeHex}
                    strokeWidth="2.5"
                    strokeLinejoin="round"
                  />
                </svg>
              );
            case 'flower':
              return (
                <svg viewBox="0 0 48 48" className={className}>
                  <g fill={fillHex} stroke={strokeHex} strokeWidth="2.2">
                    <circle cx="24" cy="11" r="8" />
                    <circle cx="36" cy="20" r="8" />
                    <circle cx="32" cy="34" r="8" />
                    <circle cx="16" cy="34" r="8" />
                    <circle cx="12" cy="20" r="8" />
                  </g>
                  <circle cx="24" cy="24" r="6.5" fill="#FEF9C3" stroke={strokeHex} strokeWidth="2" />
                </svg>
              );
            case 'arrow':
              return (
                <svg viewBox="0 0 48 48" className={className}>
                  <polygon
                    points="6,18 26,18 26,8 44,24 26,40 26,30 6,30"
                    fill={fillHex}
                    stroke={strokeHex}
                    strokeWidth="2.5"
                    strokeLinejoin="round"
                  />
                </svg>
              );
            case 'heart':
              return (
                <svg viewBox="0 0 48 48" className={className}>
                  <path
                    d="M24,42 C24,42 5,29 5,16 C5,9.5 10,5 16,5 C19.8,5 22.8,7 24,9.8 C25.2,7 28.2,5 32,5 C38,5 43,9.5 43,16 C43,29 24,42 24,42 Z"
                    fill={fillHex}
                    stroke={strokeHex}
                    strokeWidth="2.5"
                    strokeLinejoin="round"
                  />
                </svg>
              );
            case 'bolt':
            default:
              return (
                <svg viewBox="0 0 48 48" className={className}>
                  <polygon
                    points="27,3 10,26 22,26 18,45 38,20 25,20"
                    fill={fillHex}
                    stroke={strokeHex}
                    strokeWidth="2.5"
                    strokeLinejoin="round"
                  />
                </svg>
              );
          }
        };

        // צליל מגנטי קצר ונעים ("קלאק!") באמצעות Web Audio API ללא קבצים חיצוניים
        const playMagneticClackSound = () => {
          try {
            const AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (!AudioCtx) return;
            const ctx = new AudioCtx();
            const now = ctx.currentTime;

            const makeClick = (offset, freqStart, freqEnd) => {
              const osc = ctx.createOscillator();
              const gain = ctx.createGain();
              osc.type = 'triangle';
              osc.frequency.setValueAtTime(freqStart, now + offset);
              osc.frequency.exponentialRampToValueAtTime(freqEnd, now + offset + 0.055);
              gain.gain.setValueAtTime(0.28, now + offset);
              gain.gain.exponentialRampToValueAtTime(0.001, now + offset + 0.06);
              osc.connect(gain);
              gain.connect(ctx.destination);
              osc.start(now + offset);
              osc.stop(now + offset + 0.065);
            };

            makeClick(0, 720, 190);
            makeClick(0.05, 920, 260);
            setTimeout(() => ctx.close && ctx.close(), 250);
          } catch (err) {
            // Ignore audio errors on restricted devices
          }
        };

        const TOTAL_CLACK_DISCS = 18;

        const createSingleClackDisc = () => {
          const allCombos = [];
          CLACK_COLORS.forEach(c => {
            CLACK_SHAPES.forEach(s => {
              allCombos.push({ colorId: c.id, shapeId: s.id });
            });
          });

          const shuffled = [...allCombos].sort(() => Math.random() - 0.5);
          const chosen = shuffled.slice(0, 3);

          return {
            id: `clack-disc-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`,
            figures: chosen.map(fig => ({
              ...fig,
              rot: Math.round((Math.random() - 0.5) * 30)
            })),
            discRot: Math.round((Math.random() - 0.5) * 24),
            collected: false
          };
        };

        const generateClackDiscs = () =>
          Array.from({ length: TOTAL_CLACK_DISCS }, () => createSingleClackDisc());

        const doesDiscMatchDice = (disc, colorDie, shapeDie) => {
          if (!disc || disc.collected || !colorDie || !shapeDie) return false;
          return disc.figures.some(fig => {
            const colorMatch = colorDie === 'joker' || fig.colorId === colorDie;
            const shapeMatch = shapeDie === 'joker' || fig.shapeId === shapeDie;
            return colorMatch && shapeMatch;
          });
        };

        const ClackGame = () => {
          const [discs, setDiscs] = useState(() => generateClackDiscs());
          const [colorDie, setColorDie] = useState(null); // null | 'red' | ... | 'joker'
          const [shapeDie, setShapeDie] = useState(null); // null | 'star' | ... | 'joker'
          const [isRolling, setIsRolling] = useState(false);
          const [collectedStack, setCollectedStack] = useState([]);
          const [wrongDiscId, setWrongDiscId] = useState(null);
          const [statusMsg, setStatusMsg] = useState('לחצו על "הטל קוביות" כדי להתחיל!');
          const [showRules, setShowRules] = useState(false);

          const speak = useSpeech('he-IL');
          const rollTimerRef = React.useRef(null);
          const refillTimerRef = React.useRef(null);

          useEffect(() => {
            return () => {
              if (rollTimerRef.current) clearTimeout(rollTimerRef.current);
              if (refillTimerRef.current) clearTimeout(refillTimerRef.current);
            };
          }, []);

          const colorFaces = [...CLACK_COLORS.map(c => c.id), 'joker'];
          const shapeFaces = [...CLACK_SHAPES.map(s => s.id), 'joker'];

          const remainingMatchingDiscs = discs.filter(d => !d.collected && doesDiscMatchDice(d, colorDie, shapeDie));

          const startNewGame = () => {
            if (rollTimerRef.current) clearTimeout(rollTimerRef.current);
            if (refillTimerRef.current) clearTimeout(refillTimerRef.current);
            setDiscs(generateClackDiscs());
            setColorDie(null);
            setShapeDie(null);
            setIsRolling(false);
            setCollectedStack([]);
            setWrongDiscId(null);
            setStatusMsg('לחצו על "הטל קוביות" כדי להתחיל!');
          };

          const describeDiceSpeak = (cDie, sDie) => {
            if (cDie === 'joker' && sDie === 'joker') return 'פַּעֲמַיִם לָבָן! כּוֹל הַדִּיסְקִיּוֹת מַתְאִימוֹת!';
            const colorObj = CLACK_COLORS.find(c => c.id === cDie);
            const shapeObj = CLACK_SHAPES.find(s => s.id === sDie);
            if (cDie === 'joker' && shapeObj) return `${shapeObj.speak} בְּכָל צֶבַע`;
            if (sDie === 'joker' && colorObj) return `כּוֹל צוּרָה בְּצֶבַע ${colorObj.speak}`;
            if (colorObj && shapeObj) return `${shapeObj.speak} ${colorObj.speak}`;
            return '';
          };

          const describeDiceLabel = (cDie, sDie) => {
            if (!cDie || !sDie) return '';
            if (cDie === 'joker' && sDie === 'joker') return 'פעמיים לבן! אספו את כל הדיסקיות!';
            const colorObj = CLACK_COLORS.find(c => c.id === cDie);
            const shapeObj = CLACK_SHAPES.find(s => s.id === sDie);
            if (cDie === 'joker' && shapeObj) return `אספו את כל הדיסקיות שיש עליהן ${shapeObj.label} (בכל צבע)!`;
            if (sDie === 'joker' && colorObj) return `אספו את כל הדיסקיות שיש עליהן צורה בצבע ${colorObj.label}!`;
            return `אספו את כל הדיסקיות שיש עליהן ${shapeObj.label} בצבע ${colorObj.label}!`;
          };

          const handleRollDice = (e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            if (isRolling) return;

            // אם עדיין נותרו דיסקיות מתאימות להטלה הנוכחית – מזכירים לילד לאסוף את כולן
            if (colorDie && shapeDie && remainingMatchingDiscs.length > 0) {
              setStatusMsg('רגע! עדיין מסתתרות על הלוח דיסקיות שמתאימות לקוביות האלו – מצאו את כולן!');
              speak('יֵשׁ עוֹד דִּיסְקִיּוֹת מַתְאִימוֹת עַל הַלּוּחַ, חַפְּשׂוּ אוֹתָן!');
              return;
            }

            if (refillTimerRef.current) {
              clearTimeout(refillTimerRef.current);
              refillTimerRef.current = null;
            }

            // השלמת דיסקיות חדשות בכל המקומות שנאספו לפני ההטלה החדשה
            const replenishedDiscs = discs.map(d => (d.collected ? createSingleClackDisc() : d));
            setDiscs(replenishedDiscs);

            setIsRolling(true);
            setWrongDiscId(null);
            setStatusMsg('הקוביות מתגלגלות...');

            let ticks = 0;
            const animateRoll = () => {
              ticks += 1;
              const randC = colorFaces[Math.floor(Math.random() * colorFaces.length)];
              const randS = shapeFaces[Math.floor(Math.random() * shapeFaces.length)];
              setColorDie(randC);
              setShapeDie(randS);

              if (ticks < 7) {
                rollTimerRef.current = setTimeout(animateRoll, 75);
              } else {
                // בחירה הוגנת של קוביות שמוודאת שיש לפחות דיסקית מתאימה אחת על הלוח
                let finalC = colorFaces[Math.floor(Math.random() * colorFaces.length)];
                let finalS = shapeFaces[Math.floor(Math.random() * shapeFaces.length)];

                if (!replenishedDiscs.some(d => doesDiscMatchDice(d, finalC, finalS))) {
                  const validPairs = [];
                  colorFaces.forEach(cf => {
                    shapeFaces.forEach(sf => {
                      if (replenishedDiscs.some(d => doesDiscMatchDice(d, cf, sf))) {
                        validPairs.push([cf, sf]);
                      }
                    });
                  });
                  if (validPairs.length > 0) {
                    const picked = validPairs[Math.floor(Math.random() * validPairs.length)];
                    finalC = picked[0];
                    finalS = picked[1];
                  }
                }

                setColorDie(finalC);
                setShapeDie(finalS);
                setIsRolling(false);
                setStatusMsg(describeDiceLabel(finalC, finalS));
                speak(describeDiceSpeak(finalC, finalS));
              }
            };

            animateRoll();
          };

          const handleDiscClick = (disc, e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            if (isRolling || disc.collected) return;

            if (!colorDie || !shapeDie) {
              setStatusMsg('הטילו קודם את שתי הקוביות!');
              speak('הָטִילוּ קוֹדֶם אֶת הַקּוּבִּיּוֹת');
              return;
            }

            if (doesDiscMatchDice(disc, colorDie, shapeDie)) {
              playMagneticClackSound();
              setWrongDiscId(null);

              const updatedDiscs = discs.map(d => (d.id === disc.id ? { ...d, collected: true } : d));
              const nextStack = [...collectedStack, disc.id];
              setDiscs(updatedDiscs);
              setCollectedStack(nextStack);

              const stillRemainingForRoll = updatedDiscs.filter(
                d => !d.collected && doesDiscMatchDice(d, colorDie, shapeDie)
              );

              if (stillRemainingForRoll.length === 0) {
                setStatusMsg('קלאק! אספתם את כל הדיסקיות המתאימות – מיד מצטרפות דיסקיות חדשות!');
                speak('מְעוּלֶּה! הָטִילוּ שׁוּב קוּבִּיּוֹת');

                if (refillTimerRef.current) clearTimeout(refillTimerRef.current);
                refillTimerRef.current = setTimeout(() => {
                  refillTimerRef.current = null;
                  setDiscs(prev => prev.map(d => (d.collected ? createSingleClackDisc() : d)));
                  setColorDie(null);
                  setShapeDie(null);
                  setStatusMsg('דיסקיות חדשות הצטרפו ללוח! הטילו שוב את הקוביות 🎲');
                }, 650);
              } else {
                setStatusMsg('קלאק! יש עוד דיסקיות מתאימות על הלוח – המשיכו לאסוף!');
              }
            } else {
              setWrongDiscId(disc.id);
              setStatusMsg('בדיסקית הזו אין את הצירוף של שתי הקוביות יחד – בדקו שוב!');
              speak('בִּדְקוּ שׁוּב אֶת הַקּוּבִּיּוֹת');
              setTimeout(() => {
                setWrongDiscId(prev => (prev === disc.id ? null : prev));
              }, 700);
            }
          };

          // מיקומי 3 התמונות במשולש סביב מרכז הדיסקית

          { id: 53, emoji: '☂️', name: 'מטריה', speak: 'מִטְרִיָּה' },
