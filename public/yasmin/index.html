        const SherlockGame = () => {
          const [voiceEnabled, setVoiceEnabled] = useState(true);
          const [showRules, setShowRules] = useState(false);

          const [circle, setCircle] = useState([]); // 8 unique cards around the ring
          const [deck, setDeck] = useState([]); // remaining 41 unique cards
          const [choiceItems, setChoiceItems] = useState([]); // 8 current circle items in stable shuffled order
          const [sherlockPos, setSherlockPos] = useState(0);
          const [wonCards, setWonCards] = useState([]); // collected cards
          const [phase, setPhase] = useState('memorize');
          // Phases: 'memorize' | 'guessing' | 'pick_target' | 'moving' | 'wrong_reveal' | 'won_card' | 'game_over'
          const [promptText, setPromptText] = useState('');
          const [wrongGuessChoiceId, setWrongGuessChoiceId] = useState(null);
          const [expectedTargetPos, setExpectedTargetPos] = useState(null);
          const [wrongTargetPos, setWrongTargetPos] = useState(null);
          const [newCardPos, setNewCardPos] = useState(null);
          const [turnId, setTurnId] = useState(0);

          const speak = useSpeech('he-IL');
          const timersRef = React.useRef([]);
          const voiceEnabledRef = React.useRef(voiceEnabled);

          useEffect(() => {
            voiceEnabledRef.current = voiceEnabled;
            if (!voiceEnabled && 'speechSynthesis' in window) {
              window.speechSynthesis.cancel();
            }
          }, [voiceEnabled]);

          const say = React.useCallback((text) => {
            if (voiceEnabledRef.current) {
              speak(text);
            }
          }, [speak]);

          const clearAllTimers = () => {
            timersRef.current.forEach(id => clearTimeout(id));
            timersRef.current = [];
          };

          const schedule = (fn, delay) => {
            const id = setTimeout(fn, delay);
            timersRef.current.push(id);
            return id;
          };

          useEffect(() => {
            return () => clearAllTimers();
          }, []);

          const refreshChoicesForCircle = (circleCards) => {
            const items = circleCards.map(c => c.item).sort(() => Math.random() - 0.5);
            setChoiceItems(items);
          };

          const clearActiveFocus = () => {
            if (document.activeElement instanceof HTMLElement) {
              document.activeElement.blur();
            }
          };

          const initGame = () => {
            clearAllTimers();
            clearActiveFocus();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            const fullDeck = createSherlockDeck();
            const initialCircle = fullDeck.slice(0, 8).map(c => ({
              ...c,
              isRevealed: true
            }));
            const remainingDeck = fullDeck.slice(8);

            setCircle(initialCircle);
            setDeck(remainingDeck);
            refreshChoicesForCircle(initialCircle);
            setSherlockPos(0);
            setWonCards([]);
            setWrongGuessChoiceId(null);
            setExpectedTargetPos(null);
            setWrongTargetPos(null);
            setNewCardPos(null);
            setTurnId(prev => prev + 1);
            setPhase('memorize');
            setPromptText('הביטו היטב ב-8 החפצים במעגל ונסו לזכור איפה כל אחד מסתתר! כשאתם מוכנים לחצו על "התחלה".');
            say('נסו לזכור איפה כל חפץ מסתתר, וכשאתם מוכנים לחצו על התחלה');
          };

          useEffect(() => {
            initGame();
          }, []);

          const handleFlipCardsToStart = (e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            clearActiveFocus();
            if (phase !== 'memorize') return;
            clearAllTimers();

            const wasSingleNewCard = newCardPos !== null;
            setCircle(prev => prev.map(c => ({ ...c, isRevealed: false })));
            setNewCardPos(null);
            setTurnId(prev => prev + 1);
            setPhase('guessing');
            setPromptText(
              wasSingleNewCard
                ? 'הקלף החדש התהפך! איזה חפץ מסתתר כעת בקלף שליד שרלוק?'
                : 'הקלפים התהפכו! איזה חפץ מסתתר בקלף שליד שרלוק?'
            );
            say('איזה חפץ מסתתר כאן?');
          };

          const finishGame = (finalWonCards) => {
            clearAllTimers();
            clearActiveFocus();
            setPromptText(`החקירה הסתיימה! סיימתם את כל הקופה ואספתם ${finalWonCards.length} קלפים!`);
            say('כל הכבוד! סיימתם את כל הקופה!');
            setPhase('game_over');
          };

          // Animate Sherlock walking `steps` in direction `dir` (1 = clockwise, -1 = counter-clockwise)
          const walkSherlock = (startPos, steps, dir, currentCircle, currentDeck, currentWon) => {
            clearAllTimers();
            clearActiveFocus();
            setPhase('moving');
            setWrongGuessChoiceId(null);
            setWrongTargetPos(null);
            const dirLabel = dir === 1 ? 'עם כיוון השעון' : 'נגד כיוון השעון';
            setPromptText(`מצוין! שרלוק צועד ${steps} צעדים ${dirLabel}...`);

            for (let s = 1; s <= steps; s++) {
              schedule(() => {
                const nextIdx = (startPos + s * dir + 80) % 8;
                setSherlockPos(nextIdx);

                if (s === steps) {
                  schedule(() => {
                    const landedCard = currentCircle[nextIdx];
                    if (landedCard.isRevealed) {
                      handleLandOnRevealedCard(nextIdx, landedCard, currentCircle, currentDeck, currentWon);
                    } else {
                      setTurnId(prev => prev + 1);
                      setPhase('guessing');
                      setPromptText('איזה חפץ מסתתר בקלף שליד שרלוק?');
                      say('איזה חפץ מסתתר כאן?');
                    }
                  }, 320);
                }
              }, s * 360);
            }
          };

          const handleLandOnRevealedCard = (pos, wonCard, currentCircle, currentDeck, currentWon) => {
            const nextWon = [...currentWon, wonCard];
            setWonCards(nextWon);
            setPhase('won_card');

            if (currentDeck.length === 0) {
              setPromptText('בינגו! שרלוק עצר ליד קלף גלוי – זכיתם בקלף והקופה הסתיימה!');
              say('בינגו! זכית בקלף!');
              schedule(() => {
                finishGame(nextWon);
              }, 1500);
              return;
            }

            setPromptText('בינגו! שרלוק עצר ליד קלף גלוי – זכיתם בקלף! מיד נניח קלף חדש מהקופה.');
            say('בינגו! זכית בקלף!');

            schedule(() => {
              // מציגים את הקלף החדש גלוי במקומו במעגל כדי שהילד ישנן אותו וילחץ על התחלה כמו בסבב הראשון
              const replacementCard = { ...currentDeck[0], isRevealed: true };
              const updatedDeck = currentDeck.slice(1);
              const updatedCircle = currentCircle.map((c, idx) =>
                idx === pos ? replacementCard : { ...c, isRevealed: false }
              );
              const nextStartPos = (pos + 1) % 8;

              setCircle(updatedCircle);
              setDeck(updatedDeck);
              refreshChoicesForCircle(updatedCircle);
              setSherlockPos(nextStartPos);
              setNewCardPos(pos);
              setTurnId(prev => prev + 1);
              setPhase('memorize');
              setPromptText(`קלף חדש הונח במעגל: ${replacementCard.item.name}! שננו את מיקומו וכשאתם מוכנים לחצו על "התחלה".`);
              say(`קלף חדש במעגל: ${replacementCard.item.speak}. זכרו איפה הוא נמצא ולחצו על התחלה`);
            }, 1500);
          };

          const handleGuessObject = (guessedItem, e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            clearActiveFocus();
            if (phase !== 'guessing') return;

            const targetCard = circle[sherlockPos];
            if (!targetCard) return;

            const revealedCircle = circle.map((c, idx) =>
              idx === sherlockPos ? { ...c, isRevealed: true } : c
            );
            setCircle(revealedCircle);

            if (guessedItem.id === targetCard.item.id) {
              const nextSteps = targetCard.steps;
              const nextDir = targetCard.dir;
              const dirText = nextDir === 1 ? 'עם כיוון השעון' : 'נגד כיוון השעון';
              const targetIdx = (sherlockPos + nextSteps * nextDir + 80) % 8;
              const stepSpokenMap = {
                1: 'צַעַד אֶחָד',
                2: 'שְׁנֵי צְעָדִים',
                3: 'שְׁלוֹשָׁה צְעָדִים',
                4: 'אַרְבָּעָה צְעָדִים',
                5: 'חֲמִישָּׁה צְעָדִים'
              };

              setExpectedTargetPos(targetIdx);
              setWrongTargetPos(null);
              setTurnId(prev => prev + 1);
              setPhase('pick_target');
              setPromptText(`פגיעה מדויקת! בקלף מופיע המספר ${nextSteps} (${dirText}) – לחצו על הקלף במעגל שאליו שרלוק צריך להגיע!`);
              say(`פגיעה מדויקת! ספרו ${stepSpokenMap[nextSteps]} בכיוון החץ ולחצו על הקלף הנכון`);
            } else {
              setWrongGuessChoiceId(guessedItem.id);
              setPhase('wrong_reveal');
              setPromptText(`לא הפעם! זכרו שכאן מסתתר ${targetCard.item.name} להמשך.`);
              say(`לא הפעם, כאן מסתתר ${targetCard.item.speak}`);

              schedule(() => {
                const flippedBackCircle = revealedCircle.map(c => ({ ...c, isRevealed: false }));
                const nextPos = (sherlockPos + 1) % 8;
                clearActiveFocus();
                setCircle(flippedBackCircle);
                setSherlockPos(nextPos);
                setWrongGuessChoiceId(null);
                setTurnId(prev => prev + 1);
                setPhase('guessing');
                setPromptText('הקלפים התהפכו חזרה ושרלוק עבר לקלף הבא – איזה חפץ מסתתר כאן?');
              }, 2400);
            }
          };

          const handleSelectTargetCard = (clickedIdx, e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            clearActiveFocus();
            if (phase !== 'pick_target' || expectedTargetPos === null) return;
            if (clickedIdx === sherlockPos) return;

            const currentCard = circle[sherlockPos];
            if (!currentCard) return;

            if (clickedIdx === expectedTargetPos) {
              setWrongTargetPos(null);
              setExpectedTargetPos(null);
              say('מצוין!');
              walkSherlock(sherlockPos, currentCard.steps, currentCard.dir, circle, deck, wonCards);
            } else {
              setWrongTargetPos(clickedIdx);
              const dirText = currentCard.dir === 1 ? 'עם כיוון השעון' : 'נגד כיוון השעון';
              setPromptText(`לא הקלף הזה... ספרו שוב ${currentCard.steps} צעדים ${dirText} מהקלף של שרלוק ולחצו על הקלף הנכון!`);
              say('נסו לספור שוב בכיוון החץ');
            }
          };

          // Compute circular coordinates for the 8 cards and for Sherlock's pawn
          const getCircleCoords = (idx, radiusPct) => {
            const angleRad = ((idx * 45) - 90) * (Math.PI / 180);
            return {
              left: `${50 + radiusPct * Math.cos(angleRad)}%`,
              top: `${50 + radiusPct * Math.sin(angleRad)}%`
            };
          };

          // Tangent angle along the ring so the arrow inside each card physically points in Sherlock's travel direction
          const getCardArrowAngle = (idx, dir) => {
            return dir === 1 ? idx * 45 : idx * 45 + 180;
          };

          const sherlockBadgeCoords = getCircleCoords(sherlockPos, 21);

          return (
            <div className="flex flex-col items-center w-full max-w-4xl mx-auto select-none">
              {/* סרגל פעולות עליון נקי */}
              <div className="flex flex-wrap items-center justify-center gap-3 mb-4 w-full">
                <button
                  type="button"
                  onClick={() => setVoiceEnabled(v => !v)}
                  className={`px-4 py-2 rounded-2xl font-bold text-sm border-2 transition-all ${voiceEnabled ? 'bg-amber-50 border-amber-200 text-amber-700' : 'bg-gray-100 border-gray-200 text-gray-400'}`}
                >
                  {voiceEnabled ? '🔊 קול פעיל' : '🔇 מושתק'}
                </button>

                <button
                  type="button"
                  onClick={() => setShowRules(r => !r)}
                  className="px-4 py-2 rounded-2xl bg-sky-50 border-2 border-sky-200 text-sky-700 font-bold text-sm hover:bg-sky-100 transition-all"
                >
                  ❓ הוראות
                </button>

                <button
                  type="button"
                  onClick={() => initGame()}
                  className="px-4 py-2 rounded-2xl bg-orange-100 text-orange-700 font-bold text-sm hover:bg-orange-200 transition-all"
                >
                  🔄 משחק חדש
                </button>
              </div>

              {/* חלונית הסבר חוקים מתקפלת */}
              {showRules && (
                <div className="w-full max-w-2xl mb-4 bg-sky-50 border-2 border-sky-200 rounded-3xl p-4 text-sm md:text-base text-gray-700 leading-relaxed shadow-sm">
                  <div className="flex justify-between items-center mb-2">
                    <span className="font-black text-sky-800 text-lg">🕵️‍♂️ איך משחקים בשרלוק?</span>
                    <button type="button" onClick={() => setShowRules(false)} className="text-sky-600 font-bold px-2 py-0.5 rounded-lg hover:bg-sky-100">סגור ✕</button>
                  </div>
                  <ul className="list-disc pr-5 space-y-1">
                    <li>בחפיסה 49 קלפים ייחודיים ללא כפילויות: 8 מונחים במעגל ו-41 בקופה המרכזית.</li>
                    <li>בתחילת המשחק מתבוננים ב-8 החפצים הגלויים במעגל וזוכרים אותם, ואז לוחצים על <strong>"התחלה"</strong> כדי להפוך את הקלפים.</li>
                    <li>מנחשים איזה חפץ מסתתר בקלף ההפוך שלידו שרלוק עומד.</li>
                    <li>צדקתם? הקלף נפתח וחושף <strong>מספר וחץ כיוון</strong> – ספרו את הצעדים בכיוון החץ <strong>ולחצו בעצמכם על הקלף שאליו שרלוק צריך להגיע</strong>! טעיתם בחפץ? רואים מה הסתתר בקלף, והקלפים מתהפכים חזרה.</li>
                    <li>הגעתם ליד <strong>קלף שכבר גלוי</strong>? <strong>בינגו!</strong> זכיתם בקלף! קלף חדש מהקופה יוצג גלוי במקומו כדי שתוכלו לשנן גם אותו וללחוץ שוב על <strong>"התחלה"</strong> להמשך המשחק.</li>
                  </ul>
                </div>
              )}

              {/* לוח ניקוד של הבלש היחיד */}
              <div className="w-full max-w-md mb-4 rounded-2xl p-3 bg-amber-50 border-4 border-orange-300 shadow-sm flex items-center justify-between">
                <div className="flex items-center gap-2.5">
                  <span className="text-3xl">🕵️‍♂️</span>
                  <div>
                    <div className="font-black text-gray-800 text-base">הבלש שרלוק</div>
                    <div className="flex flex-wrap gap-1 mt-1 min-h-[22px]">
                      {wonCards.slice(-8).map((c, cIdx) => (
                        <span key={cIdx} className="inline-flex items-center justify-center bg-white rounded-md p-0.5 shadow-sm border border-amber-100">
                          {renderSherlockItemIcon(c.item, 'sm')}
                        </span>
                      ))}
                    </div>
                  </div>
                </div>
                <div className="text-center bg-white px-4 py-1.5 rounded-xl border border-amber-200 shadow-sm shrink-0">
                  <div className="text-2xl font-black text-orange-600 leading-none">{wonCards.length}</div>
                  <div className="text-xs font-bold text-gray-500">קלפים שנאספו</div>
                </div>
              </div>

              {/* בועת הנחיה והודעות מערכת */}
              <div
                className={`w-full max-w-2xl mb-5 px-5 py-3 rounded-2xl border-2 text-center font-bold text-base md:text-lg shadow-sm transition-all ${
                  phase === 'pick_target' && wrongTargetPos !== null
                    ? 'bg-orange-50 border-orange-300 text-orange-800'
                    : phase === 'pick_target' || phase === 'won_card'
                      ? 'bg-green-50 border-green-300 text-green-800'
                      : phase === 'wrong_reveal'
                        ? 'bg-red-50 border-red-200 text-red-700'
                        : phase === 'game_over'
                          ? 'bg-amber-100 border-amber-400 text-amber-900 text-xl'
                          : 'bg-indigo-50 border-indigo-200 text-indigo-900'
                }`}
              >
                {promptText}
              </div>

              {/* מעגל 8 הקלפים + הקופה המרכזית + דמות שרלוק */}
              <div className="relative w-[305px] h-[305px] sm:w-[390px] sm:h-[390px] md:w-[450px] md:h-[450px] rounded-full bg-gradient-to-br from-amber-50 via-orange-50/60 to-amber-100/70 border-4 border-amber-200 shadow-inner mb-6 shrink-0">
                {/* מסלול מעגלי מקווקו */}
                <div className="absolute inset-[14%] rounded-full border-2 border-dashed border-amber-300/80 pointer-events-none" />

                {/* קופה מרכזית */}
                <div className="absolute left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2 flex flex-col items-center justify-center pointer-events-none">
                  {deck.length > 0 ? (
                    <div className="w-16 h-20 sm:w-20 sm:h-24 rounded-2xl bg-gradient-to-br from-indigo-700 to-slate-800 border-2 border-amber-300 shadow-lg flex flex-col items-center justify-center text-white overflow-hidden p-1">
                      <span className="text-[10px] sm:text-xs font-bold text-amber-200">קופה</span>
                      <span className="text-xl sm:text-2xl font-black text-amber-300 leading-tight">{deck.length}</span>
                    </div>
                  ) : (
                    <div className="w-16 h-20 sm:w-20 sm:h-24 rounded-2xl border-2 border-dashed border-amber-400 bg-amber-50/70 flex items-center justify-center text-center p-1">
                      <span className="text-[10px] sm:text-xs font-bold text-amber-700 leading-tight">הקופה נגמרה!</span>
                    </div>
                  )}
                </div>

                {/* דמות הבלש שרלוק הצועדת בין הקלפים */}
                <div
                  style={{
                    left: sherlockBadgeCoords.left,
                    top: sherlockBadgeCoords.top,
                    transform: 'translate(-50%, -50%)'
                  }}
                  className="absolute z-20 transition-all duration-300 ease-out pointer-events-none"
                >
                  <div className="w-9 h-9 sm:w-11 sm:h-11 rounded-full bg-amber-300 border-2 border-white shadow-lg flex items-center justify-center text-xl sm:text-2xl">
                    🕵️‍♂️
                  </div>
                </div>

                {/* 8 הקלפים במעגל */}
                {circle.map((card, idx) => {
                  const pos = getCircleCoords(idx, 38);
                  const isSherlockHere = idx === sherlockPos && phase !== 'memorize';
                  const isHighlightedNewCard = phase === 'memorize' && newCardPos === idx;
                  const arrowAngle = getCardArrowAngle(idx, card.dir);
                  const canPickCard = phase === 'pick_target' && idx !== sherlockPos;
                  const isWrongTarget = phase === 'pick_target' && wrongTargetPos === idx;

                  return (
                    <button
                      key={card.uid}
                      type="button"
                      disabled={!canPickCard}
                      onClick={(e) => handleSelectTargetCard(idx, e)}
                      style={{
                        left: pos.left,
                        top: pos.top
                      }}
                      className={`
                        absolute -translate-x-1/2 -translate-y-1/2 w-[68px] h-[84px] sm:w-[86px] sm:h-[104px] md:w-[98px] md:h-[116px] rounded-2xl overflow-hidden flex flex-col items-center justify-between p-1 sm:p-1.5 transition-all duration-300 focus:outline-none
                        ${card.isRevealed
                          ? 'bg-white border-4 border-emerald-400 shadow-lg'
                          : 'bg-gradient-to-br from-indigo-600 via-indigo-700 to-slate-800 border-4 border-amber-200 text-white shadow-md'
                        }
                        ${isHighlightedNewCard ? 'ring-4 ring-amber-400 scale-110 z-20' : ''}
                        ${isSherlockHere ? 'ring-4 ring-orange-400 scale-105 z-10' : ''}
                        ${phase === 'guessing' && isSherlockHere ? 'ring-4 ring-pink-500 scale-105' : ''}
                        ${canPickCard ? 'cursor-pointer active:scale-95 [@media(hover:hover)]:hover:scale-110 [@media(hover:hover)]:hover:ring-4 [@media(hover:hover)]:hover:ring-sky-400' : 'cursor-default'}
                        ${isWrongTarget ? 'ring-4 ring-red-500 scale-95 opacity-80' : ''}
                      `}
                    >
                      {!card.isRevealed ? (
                        /* גב הקלף – נקי ללא מספר וללא חץ */
                        <div className="w-full h-full rounded-xl border-2 border-amber-300/35 flex items-center justify-center">
                          <span className="text-2xl sm:text-3xl opacity-90 select-none">🕵️‍♂️</span>
                        </div>
                      ) : (
                        /* פני הכרטיס עצמו – כולל המספר וחץ כיוון ההתקדמות */
                        <div className="w-full h-full flex flex-col items-center justify-between overflow-hidden">
                          <div
                            title={card.dir === 1 ? `${card.steps} צעדים עם כיוון השעון` : `${card.steps} צעדים נגד כיוון השעון`}
                            className={`w-full flex items-center justify-center gap-1 rounded-lg px-1.5 py-0.5 text-xs sm:text-sm font-black ${
                              card.dir === 1
                                ? 'bg-sky-100 text-sky-800'
                                : 'bg-purple-100 text-purple-800'
                            } ${phase === 'pick_target' && isSherlockHere ? 'animate-pulse ring-2 ring-amber-400' : ''}`}
                          >
                            <span>{card.steps}</span>
                            <DirectionArrowSVG angleDeg={arrowAngle} className="w-3.5 h-3.5 sm:w-4 sm:h-4" />
                          </div>

                          <div className="flex items-center justify-center my-auto">
                            {renderSherlockItemIcon(card.item, 'md')}
                          </div>

                          <span className="text-[9px] sm:text-[11px] font-black text-gray-700 text-center leading-tight px-0.5 truncate w-full">
                            {card.item.name}
                          </span>
                        </div>
                      )}
                    </button>
                  );
                })}
              </div>

              {/* אזור פעולה תחתון לפי שלב המשחק */}
              <div className="w-full max-w-2xl min-h-[110px] flex flex-col items-center justify-center">
                {phase === 'memorize' && (
                  <button
                    type="button"
                    onClick={handleFlipCardsToStart}
                    className="bg-orange-500 hover:bg-orange-600 text-white font-black text-xl md:text-2xl px-10 py-4 rounded-full shadow-lg hover:shadow-xl hover:scale-105 transition-all flex items-center gap-3"
                  >
                    <span>🔄</span>
                    <span>{newCardPos !== null ? 'התחלה – הפוך את הקלף החדש' : 'התחלה – הפוך את הקלפים'}</span>
                  </button>
                )}

                {phase === 'pick_target' && circle[sherlockPos] && (
                  <div className="bg-sky-50 border-2 border-sky-300 rounded-2xl px-6 py-3 flex items-center gap-3 shadow-sm animate-fade-in-up">
                    <span className="text-3xl">👆</span>
                    <div className="text-sky-900 font-black text-base md:text-lg text-center">
                      ספרו <span className="text-orange-600 text-xl mx-1">{circle[sherlockPos].steps}</span> קלפים{' '}
                      {circle[sherlockPos].dir === 1 ? 'עם כיוון השעון' : 'נגד כיוון השעון'} ולחצו על הקלף במעגל!
                    </div>
                  </div>
                )}

                {(phase === 'guessing' || phase === 'wrong_reveal') && (
                  <div className="w-full">
                    <div className="text-center font-black text-gray-700 mb-3 text-base md:text-lg">
                      בחרו איזה חפץ מסתתר מתחת לקלף שליד שרלוק:
                    </div>
                    <div key={`choices-${turnId}`} className="grid grid-cols-4 sm:grid-cols-8 gap-2 md:gap-2.5">
                      {choiceItems.map(item => {
                        const isWrongPicked = phase === 'wrong_reveal' && wrongGuessChoiceId === item.id;
                        return (
                          <button
                            key={`${turnId}-${item.id}`}
                            type="button"
                            disabled={phase !== 'guessing'}
                            onClick={(e) => handleGuessObject(item, e)}
                            className={`
                              rounded-2xl p-2 md:p-2.5 flex flex-col items-center justify-center transition-all shadow-sm focus:outline-none
                              ${isWrongPicked
                                ? 'bg-red-100 border-2 border-red-400 opacity-75 scale-95'
                                : 'bg-white border-2 border-orange-200 active:scale-95 [@media(hover:hover)]:hover:border-orange-400 [@media(hover:hover)]:hover:bg-orange-50 [@media(hover:hover)]:hover:scale-105 [@media(hover:hover)]:hover:shadow-md cursor-pointer'
                              }
                              ${phase !== 'guessing' ? 'cursor-not-allowed opacity-70' : ''}
                            `}
                          >
                            <div className="h-9 flex items-center justify-center mb-1">
                              {renderSherlockItemIcon(item, 'md')}
                            </div>
                            <span className="text-[11px] md:text-xs font-black text-gray-700 text-center leading-tight">
                              {item.name}
                            </span>
                          </button>
                        );
                      })}
                    </div>
                  </div>
                )}

                {phase === 'game_over' && (
                  <div className="flex flex-col items-center gap-4 bg-amber-50 border-4 border-amber-300 rounded-3xl px-8 py-6 shadow-md animate-fade-in-up">
                    <div className="text-4xl">🏆🕵️‍♂️🎉</div>
                    <div className="text-xl md:text-2xl font-black text-amber-800 text-center">
                      כל הכבוד! סיימתם את כל הקופה ואספתם {wonCards.length} קלפים!
                    </div>
                    <button
                      type="button"
                      onClick={() => initGame()}
                      className="bg-orange-500 hover:bg-orange-600 text-white font-black text-lg px-8 py-3 rounded-full shadow-lg transition-all"
                    >
                      שחקו שוב 🔄
                    </button>
                  </div>
                )}
              </div>
            </div>
          );
        };

        // --- Main App Component ---
        const App = () => {
          const [activeItem, setActiveItem] = useState(null);
          const [activeCategoryTheme, setActiveCategoryTheme] = useState(null);
          const [isMobileMenuOpen, setIsMobileMenuOpen] = useState(false);

          const handleSelectItem = (item, category) => {
            setActiveItem(item);
            setActiveCategoryTheme(category.theme);
            setIsMobileMenuOpen(false);
          };

          const renderInteractiveContent = () => {
            switch(activeItem.id) {
              case 'ar-colors':
                return <InteractiveModule key={activeItem.id} items={ARABIC_COLORS} lang="ar-SA" themeClass="emerald" renderItem={renderColorItem} />;
              case 'ar-animals':
                return <InteractiveModule key={activeItem.id} items={ARABIC_ANIMALS} lang="ar-SA" themeClass="emerald" renderItem={renderAnimalItem('emerald')} />;
              case 'ar-body':
                return <InteractiveModule key={activeItem.id} items={ARABIC_BODY_PARTS} lang="ar-SA" themeClass="emerald" renderItem={renderAnimalItem('emerald')} />;
              case 'ar-family':
                return <InteractiveModule key={activeItem.id} items={ARABIC_FAMILY} lang="ar-SA" themeClass="emerald" renderItem={renderAnimalItem('emerald')} />;
              case 'ar-rosh-hashana':
                return <InteractiveModule key={activeItem.id} items={ARABIC_ROSH_HASHANA} lang="ar-SA" themeClass="emerald" renderItem={renderAnimalItem('emerald')} />;
              case 'ar-days':
                return <InteractiveModule key={activeItem.id} items={ARABIC_DAYS} lang="ar-SA" themeClass="emerald" renderItem={renderTextCardItem('emerald', 'w-16 h-16 md:w-24 md:h-24', 'text-2xl md:text-4xl')} />;
              case 'ar-numbers':
                return <InteractiveModule key={activeItem.id} items={ARABIC_NUMBERS} lang="ar-SA" themeClass="emerald" renderItem={renderTextCardItem('emerald', 'w-16 h-16 md:w-24 md:h-24', 'text-2xl md:text-4xl')} />;
              case 'en-colors':
                return <InteractiveModule key={activeItem.id} items={ENGLISH_COLORS} lang="en-US" themeClass="blue" renderItem={renderColorItem} />;
              case 'en-animals':
                return <InteractiveModule key={activeItem.id} items={ENGLISH_ANIMALS} lang="en-US" themeClass="blue" renderItem={renderAnimalItem('blue')} />;
              case 'heb-letters':
                return <InteractiveModule key={activeItem.id} items={HEBREW_LETTERS} lang="he-IL" themeClass="pink" renderItem={renderTextCardItem('pink', 'w-16 h-16 md:w-24 md:h-24', 'text-2xl md:text-4xl')} />;
              case 'heb-rhymes':
                return <RhymesGame key={activeItem.id} />;
              case 'heb-sounds':
                return <StartingSoundsGame key={activeItem.id} />;
              case 'en-numbers':
                return <InteractiveModule key={activeItem.id} items={ENGLISH_NUMBERS} lang="en-US" themeClass="blue" renderItem={renderTextCardItem('blue', 'w-16 h-16 md:w-24 md:h-24', 'text-2xl md:text-4xl')} />;
              case 'math-30':
                return <InteractiveModule key={activeItem.id} items={MATH_NUMBERS} lang="he-IL" themeClass="purple" renderItem={renderTextCardItem('purple', 'w-14 h-14 md:w-20 md:h-20', 'text-xl md:text-2xl')} />;
              case 'math-count':
                return <CountingGame key={activeItem.id} />;
              case 'math-compare':
                return <ComparisonGame key={activeItem.id} />;
              case 'heb-combinations':
                return <WordCombinationsModule key={activeItem.id} />;
              case 'heb-opposites':
                return <OppositesModule key={activeItem.id} />;
              case 'songs-letters':
                return <SongsModule key={activeItem.id} videos={HEBREW_LETTERS_SONGS} themeClass="amber" />;
              case 'songs-numbers':
                return <SongsModule key={activeItem.id} videos={MATH_NUMBERS_SONGS} themeClass="amber" />;
              case 'game-memory':
                return <MemoryGame key={activeItem.id} />;
              case 'game-war':
                return <WarCardGame key={activeItem.id} />;
              case 'game-sherlock':
                return <SherlockGame key={activeItem.id} />;
              default:
                return (
                  <div className="flex flex-col items-center">
                    <div className="w-24 h-2 bg-amber-400 rounded-full mb-8"></div>
                    <p className="text-xl md:text-2xl leading-relaxed text-gray-600 font-medium bg-amber-50/50 p-6 rounded-2xl border-2 border-dashed border-amber-200">
                      {activeItem.content}
                    </p>
                    <div className="mt-12 grid grid-cols-2 md:grid-cols-4 gap-4">
                      {['🌟','🎈','🎨','🧸'].map((emoji, i) => (
                        <div key={i} className="aspect-square w-20 h-20 bg-gray-50 rounded-2xl border-2 border-dashed border-gray-200 flex items-center justify-center text-4xl hover:scale-110 transition-transform cursor-pointer hover:bg-white hover:shadow-md">
                           {emoji}
                        </div>
                      ))}
                    </div>
                  </div>
                );
            }
          };

          return (
            <div className="min-h-screen flex flex-col md:flex-row bg-amber-50 h-screen overflow-hidden">
              
              {/* Header (Mobile) */}
              <div className="md:hidden bg-white shadow-sm p-4 flex justify-between items-center z-20 shrink-0">
                <div className="flex items-center text-amber-600 font-bold text-xl">
                  <span className="text-2xl ml-2">🌸</span> גן יסמין
                </div>
                <button onClick={() => setIsMobileMenuOpen(!isMobileMenuOpen)} className="p-2 bg-amber-100 text-amber-700 rounded-full hover:bg-amber-200 transition-colors">
                  {isMobileMenuOpen ? <XIcon /> : <MenuIcon />}
                </button>
              </div>

              {/* Sidebar */}
              <nav className={`
                ${isMobileMenuOpen ? 'translate-x-0' : 'translate-x-full'} 
                md:translate-x-0 transition-transform duration-300 ease-in-out
                absolute md:relative top-0 right-0 w-72 h-full bg-white shadow-xl md:shadow-lg z-30 overflow-y-auto shrink-0
              `}>
                <div className="hidden md:flex items-center p-6 text-amber-600 font-black text-3xl border-b border-amber-100 sticky top-0 bg-white z-10">
                  <span className="text-4xl ml-3 animate-spin-slow">🌸</span> גן יסמין
                </div>
                <div className="p-4 pt-6 space-y-6">
                  {MENU_DATA.map((section, idx) => (
                    <div key={idx} className="space-y-2">
                      <h2 className={`flex items-center font-bold text-lg p-2 rounded-xl ${section.color}`}>
                        <span className="ml-2 text-xl">{section.icon}</span> {section.category}
                      </h2>
                      <ul className="space-y-1 pr-2">
                        {section.items.map((item) => (
                          <li key={item.id}>
                            <button
                              onClick={() => handleSelectItem(item, section)}
                              className={`
                                w-full text-right flex items-center px-4 py-3 rounded-xl transition-all
                                ${activeItem?.id === item.id 
                                  ? `${section.color} font-bold shadow-sm scale-[1.02]` 
                                  : `hover:bg-gray-50 text-gray-600 ${section.hover}`
                                }
                              `}
                            >
                              <span className="ml-3 text-xl inline-flex">{item.icon}</span> {item.title}
                            </button>
                          </li>
                        ))}
                      </ul>
                    </div>
                  ))}
                </div>
              </nav>

              {/* Mobile Overlay */}
              {isMobileMenuOpen && (
                <div className="absolute inset-0 bg-black/20 z-20 md:hidden backdrop-blur-sm" onClick={() => setIsMobileMenuOpen(false)} />
              )}

              {/* Main Content */}
              <main className="flex-1 p-4 md:p-8 overflow-y-auto relative h-full">
                <div className="max-w-5xl mx-auto pb-20">
                  {activeItem ? (
                    <div className="bg-white rounded-3xl shadow-xl p-6 md:p-12 border-4 border-white transform transition-all animate-fade-in-up flex flex-col items-center">
                      <h1 className="text-3xl md:text-5xl font-black text-gray-800 mb-8 flex items-center">
                        <span className="ml-4 text-4xl md:text-5xl">{activeItem.icon}</span> {activeItem.title}
                      </h1>
                      {renderInteractiveContent()}
                    </div>
                  ) : (
                    <div className="bg-white rounded-3xl shadow-xl p-8 md:p-16 text-center border-4 border-amber-100 flex flex-col items-center justify-center min-h-[60vh]">
                      <div className="w-24 h-24 md:w-32 md:h-32 bg-amber-100 rounded-full flex items-center justify-center mb-8 shadow-inner">
                        <span className="text-5xl md:text-7xl">🌸</span>
                      </div>
                      <h1 className="text-3xl md:text-6xl font-black text-transparent bg-clip-text bg-gradient-to-r from-amber-500 to-orange-400 mb-6">
                        ברוכים הבאים לגן יסמין!
                      </h1>
                      <p className="text-lg md:text-2xl text-gray-500 max-w-lg mx-auto">
                        בחרו נושא מהתפריט בצד ימין כדי להתחיל ללמוד, לשחק ולגלות דברים חדשים.
                      </p>
                      <div className="mt-12 flex space-x-3 space-x-reverse justify-center">
                        <div className="w-3 h-3 rounded-full bg-pink-400 animate-bounce" style={{animationDelay: '0ms'}}></div>
                        <div className="w-3 h-3 rounded-full bg-emerald-400 animate-bounce" style={{animationDelay: '150ms'}}></div>
                        <div className="w-3 h-3 rounded-full bg-blue-400 animate-bounce" style={{animationDelay: '300ms'}}></div>
                        <div className="w-3 h-3 rounded-full bg-purple-400 animate-bounce" style={{animationDelay: '450ms'}}></div>
                      </div>
                    </div>
                  )}
                </div>
              </main>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
