                ${sizeClass} bg-white rounded-3xl flex flex-col items-center justify-center
                shadow-md hover:shadow-xl hover:-translate-y-2 transition-all border-b-4 ${styles.border}
                focus:outline-none
                ${disabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}
              `}
            >
              <span className={`${mainTextSize} font-black ${styles.textMain} ${item.sub ? 'mb-1' : ''}`}>{item.display}</span>
              {item.sub && <span className={`font-bold text-xs md:text-sm ${styles.textSub} select-none text-center leading-tight px-1`}>{item.sub}</span>}
            </button>
          );
        };

        // Shared speech hook for consistent multi-language TTS
        const pickBestVoiceForLang = (targetLang, availableVoices) => {
          if (!availableVoices || availableVoices.length === 0) return null;
          const langPrefix = targetLang.split('-')[0].toLowerCase();
          const langVoices = availableVoices.filter(v => {
            const vLang = (v.lang || '').toLowerCase().replace('_', '-');
            const vName = (v.name || '').toLowerCase();
            return (
              vLang.startsWith(langPrefix) ||
              (langPrefix === 'he' && (vLang.includes('iw') || vName.includes('hebrew') || (v.name || '').includes('עברית'))) ||
              (langPrefix === 'ar' && (vName.includes('arabic') || (v.name || '').includes('العربية')))
            );
          });
          return (langPrefix === 'ar' && langVoices.find(v =>
            v.lang.includes('IL') || v.lang.includes('PS') || v.lang.includes('JO') || v.lang.includes('LB') || v.lang.includes('EG')
          )) || langVoices.find(v =>
            v.name.includes('Google') || v.name.includes('Natural') || v.name.toLowerCase().includes('female')
          ) || langVoices[0] || null;
        };

        const useSpeech = (lang = 'he-IL') => {
          const preferredVoiceRef = React.useRef(null);
          const pendingTimerRef = React.useRef(null);
          const activeUtteranceRef = React.useRef(null);

          useEffect(() => {
            // איפוס הקול השמור בכל החלפת שפה כדי שקול עברי לא יישאר נעול במעבר לערבית/אנגלית
            preferredVoiceRef.current = null;

            const initVoice = () => {
              if (!('speechSynthesis' in window)) return;
              preferredVoiceRef.current = pickBestVoiceForLang(lang, window.speechSynthesis.getVoices());
            };

            initVoice();
            if ('speechSynthesis' in window && window.speechSynthesis.addEventListener) {
              window.speechSynthesis.addEventListener('voiceschanged', initVoice);
            }
            return () => {
              if (pendingTimerRef.current) {
                clearTimeout(pendingTimerRef.current);
                pendingTimerRef.current = null;
              }
              if ('speechSynthesis' in window) {
                if (window.speechSynthesis.removeEventListener) {
                  window.speechSynthesis.removeEventListener('voiceschanged', initVoice);
                }
                window.speechSynthesis.cancel();
              }
            };
          }, [lang]);

          const speak = React.useCallback((text, options = {}) => {
            const { cancelPrevious = true, onEnd = null, langOverride = null } = options;
            const targetLang = langOverride || lang;

            if (!('speechSynthesis' in window) || !text) {
              if (onEnd) setTimeout(onEnd, 300);
              return;
            }

            if (pendingTimerRef.current) {
              clearTimeout(pendingTimerRef.current);
              pendingTimerRef.current = null;
            }

            if (cancelPrevious) {
              window.speechSynthesis.cancel();
            }

            const delay = cancelPrevious ? 110 : 30;
            pendingTimerRef.current = setTimeout(() => {
              pendingTimerRef.current = null;
              const utterance = new SpeechSynthesisUtterance(text);
              activeUtteranceRef.current = utterance;

              const availableVoices = window.speechSynthesis.getVoices();
              const voice = targetLang === lang && preferredVoiceRef.current
                ? preferredVoiceRef.current
                : pickBestVoiceForLang(targetLang, availableVoices);
              const langPrefix = targetLang.split('-')[0].toLowerCase();
              const normalizedVoiceLang = voice && voice.lang ? voice.lang.toLowerCase().replace('_', '-') : '';
              const voiceMatchesLang = Boolean(
                voice && (
                  normalizedVoiceLang.startsWith(langPrefix) ||
                  (langPrefix === 'he' && normalizedVoiceLang.includes('iw'))
                )
              );

              if (targetLang === 'he-IL' && voiceMatchesLang && voice.lang.includes('iw')) {
                utterance.lang = 'iw-IL';
              } else if (voiceMatchesLang && voice.lang) {
                utterance.lang = voice.lang.replace('_', '-');
              } else {
                utterance.lang = targetLang;
              }

              if (voiceMatchesLang) {
                utterance.voice = voice;
              }

              utterance.pitch = 1.3;
              utterance.rate = 0.85;

              if (onEnd) {
                let finished = false;
                const finishOnce = () => {
                  if (finished) return;
                  finished = true;
                  clearTimeout(safetyTimer);
                  onEnd();
                };
                const safetyMs = Math.min(7500, Math.max(1800, text.length * 115));
                const safetyTimer = setTimeout(finishOnce, safetyMs);
                utterance.onend = finishOnce;
                utterance.onerror = finishOnce;
              }

              window.speechSynthesis.speak(utterance);
            }, delay);
          }, [lang]);

          return speak;
        };

        // Helper to generate scattered non-overlapping coordinates (in %)
        const generateScatteredPositions = (count, minDist = 16) => {
          const positions = [];
          for (let i = 0; i < count; i++) {
            let best = null;
            for (let attempt = 0; attempt < 80; attempt++) {
              const x = 10 + Math.random() * 80;
              const y = 12 + Math.random() * 76;
              const currentMinDist = attempt > 50 ? minDist * 0.7 : minDist;
              const tooClose = positions.some(p => Math.hypot(p.x - x, p.y - y) < currentMinDist);
              if (!tooClose) {
                best = { x, y, rot: (Math.random() - 0.5) * 24 };
                break;
              }
            }
            if (!best) {
              best = { x: 10 + Math.random() * 80, y: 12 + Math.random() * 76, rot: 0 };
            }
            positions.push(best);
          }
          return positions;
        };

        // --- Generic Interactive Module (Learn & Practice) ---
        const InteractiveModule = ({ items, lang, renderItem, themeClass }) => {
          const [mode, setMode] = useState('learn');
          const [targetItem, setTargetItem] = useState(null);
          const [practiceOptions, setPracticeOptions] = useState([]);
          const [feedback, setFeedback] = useState('');
          const [roundId, setRoundId] = useState(0);
          const lastTargetIdRef = React.useRef(null);

          const speak = useSpeech(lang);
          const theme = getThemeClasses(themeClass);

          const getPracticeOptions = (target) => {
            const others = items.filter(c => {
              if (c.id === target.id) return false;
              if (target.conflictGroup && c.conflictGroup === target.conflictGroup) return false;
              return true;
            });
            const shuffledOthers = [...others].sort(() => 0.5 - Math.random());
            const distractors = [];
            const usedConflictGroups = new Set(target.conflictGroup ? [target.conflictGroup] : []);

            for (const candidate of shuffledOthers) {
              if (distractors.length >= 3) break;
              if (candidate.conflictGroup && usedConflictGroups.has(candidate.conflictGroup)) continue;
              if (candidate.conflictGroup) usedConflictGroups.add(candidate.conflictGroup);
              distractors.push(candidate);
            }

            return [...distractors, target].sort(() => 0.5 - Math.random());
          };

          const startPractice = () => {
            let candidates = items;
            if (items.length > 1 && lastTargetIdRef.current !== null) {
              candidates = items.filter(i => i.id !== lastTargetIdRef.current);
            }
            const randomItem = candidates[Math.floor(Math.random() * candidates.length)];
            lastTargetIdRef.current = randomItem.id;

            setRoundId(prev => prev + 1);
            setTargetItem(randomItem);
            setPracticeOptions(getPracticeOptions(randomItem));
            setFeedback('');
            speak(randomItem.spoken || randomItem.speak);
          };

          const handleItemClick = (item, e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            if (mode === 'learn') {
              speak(item.spoken || item.speak);
            } else if (mode === 'practice' && targetItem && feedback !== 'correct') {
              if (item.id === targetItem.id) {
                setFeedback('correct');
                const successMsgs = { 'he-IL': 'כל הכבוד', 'en-US': 'Excellent', 'ar-SA': 'مُمْتَازْ' };
                speak(successMsgs[lang] || 'Correct');
                setTimeout(() => {
                  startPractice();
                }, 1400);
              } else {
                setFeedback('wrong');
                const tryAgainMsgs = { 'he-IL': 'נַסּוּ שׁוּב', 'en-US': 'Try again', 'ar-SA': 'حَاوِلْ مَرَّةْ ثَانِيَةْ' };
                speak(tryAgainMsgs[lang] || 'Try again');
              }
            }
          };

          return (
            <div className="flex flex-col items-center w-full">
              <div className="flex space-x-4 space-x-reverse mb-8 bg-gray-100 p-2 rounded-2xl">
                <button
                  type="button"
                  onClick={() => { setMode('learn'); setFeedback(''); setTargetItem(null); }}
                  className={`px-6 py-2 rounded-xl font-bold transition-all ${mode === 'learn' ? `bg-white shadow-md ${theme.text}` : 'text-gray-500 hover:text-gray-700'}`}
                >
                  למידה
                </button>
                <button
                  type="button"
                  onClick={() => { setMode('practice'); setFeedback(''); setTargetItem(null); }}
                  className={`px-6 py-2 rounded-xl font-bold transition-all ${mode === 'practice' ? `bg-white shadow-md ${theme.text}` : 'text-gray-500 hover:text-gray-700'}`}
                >
                  תרגול
                </button>
              </div>

              {mode === 'practice' && (
                <div className="mb-8 flex flex-col items-center gap-4 min-h-[120px]">
                  {!targetItem ? (
                    <button
                      type="button"
                      onClick={startPractice}
                      className={`${theme.button} text-white px-8 py-3 rounded-full font-black text-xl ${theme.buttonHover} transition-all shadow-lg hover:shadow-xl flex items-center gap-2`}
                    >
                      <PlayIcon /> התחל תרגול
                    </button>
                  ) : (
                    <div className="flex flex-col items-center gap-3">
                      <button
                        type="button"
                        onClick={() => speak(targetItem.spoken || targetItem.speak)}
                        className="bg-sky-500 text-white px-6 py-2 rounded-full font-bold text-lg hover:bg-sky-600 transition-all shadow-md flex items-center gap-2"
                      >
                        <Volume2Icon /> שמע שוב
                      </button>
                      <div className="h-8 mt-2">
                        {feedback === 'correct' && <div className="text-2xl font-black text-green-500 animate-bounce">כל הכבוד! 🎉</div>}
                        {feedback === 'wrong' && <div className="text-xl font-bold text-red-500 animate-pulse">נסו שוב! 💪</div>}
                      </div>
                    </div>
                  )}
                </div>
              )}

              <div key={mode === 'practice' ? `round-${roundId}` : 'learn-grid'} className="flex flex-wrap justify-center gap-4 max-w-4xl">
                {(mode === 'practice' && targetItem ? practiceOptions : items).map(item => {
                  const isDisabled = mode === 'practice' && !targetItem;
                  const rendered = renderItem(item, (e) => handleItemClick(item, e), isDisabled);
                  return React.cloneElement(rendered, { key: `${roundId}-${item.id}` });
                })}
              </div>
            </div>
          );
        };

        // --- Word Combinations Module ---
        const WordCombinationsModule = () => {
          const [shuffledData] = useState(() => [...WORD_COMBINATIONS].sort(() => 0.5 - Math.random()));
          const [currentIndex, setCurrentIndex] = useState(0);
          const [isAnswerRevealed, setIsAnswerRevealed] = useState(false);
          const speak = useSpeech('he-IL');
          const autoNextTimerRef = React.useRef(null);
          const hasSpokenIntroRef = React.useRef(false);

          const instructionSpeech = 'מָה יוֹצֵא מֵהַחִבּוּר שֶׁל שְׁתֵּי הַמִּילִים?';

          useEffect(() => {
            if (!hasSpokenIntroRef.current) {
              hasSpokenIntroRef.current = true;
              const t = setTimeout(() => speak(instructionSpeech), 450);
              return () => clearTimeout(t);
            }
          }, [speak]);

          useEffect(() => {
            return () => {
              if (autoNextTimerRef.current) clearTimeout(autoNextTimerRef.current);
            };
          }, []);

          const clearAutoTimer = () => {
            if (autoNextTimerRef.current) {
              clearTimeout(autoNextTimerRef.current);
              autoNextTimerRef.current = null;
            }
          };

          const handleNext = () => {
            clearAutoTimer();
            setIsAnswerRevealed(false);
            setCurrentIndex(prev => (prev + 1) % shuffledData.length);
          };

          const handlePrev = () => {
            clearAutoTimer();
            setIsAnswerRevealed(false);
            setCurrentIndex(prev => (prev - 1 + shuffledData.length) % shuffledData.length);
          };

          const combo = shuffledData[currentIndex];

          const handleReveal = () => {
            clearAutoTimer();
            setIsAnswerRevealed(true);
            speak(combo.resultSpeak || combo.result);
            autoNextTimerRef.current = setTimeout(() => {
              setIsAnswerRevealed(false);
              setCurrentIndex(prev => (prev + 1) % shuffledData.length);
            }, 2200);
          };

          return (
            <div className="flex flex-col items-center w-full max-w-3xl mx-auto">
              <button
                type="button"
                onClick={() => speak(instructionSpeech)}
                className="mb-8 bg-pink-100 hover:bg-pink-200 text-pink-700 px-6 py-3 rounded-full font-bold text-lg md:text-xl flex items-center gap-2 shadow-sm transition-all"
              >
                <Volume2Icon /> מה יוצא מהחיבור של שתי המילים?
              </button>

              <div className="flex flex-wrap items-center justify-center gap-3 md:gap-6 mb-12">
                {/* Word 1 */}
                <button
                  type="button"
                  onClick={() => speak(combo.w1Speak || combo.w1)}
                  className="bg-pink-50 border-4 border-pink-200 rounded-3xl p-4 md:p-8 flex flex-col items-center shadow-lg w-28 h-40 md:w-40 md:h-56 justify-center transform transition-transform hover:scale-105 cursor-pointer"
                >
                  <span className="text-5xl md:text-7xl mb-3 md:mb-6">{combo.e1}</span>
                  <span className="text-xl md:text-3xl font-black text-pink-600">{combo.w1}</span>
                </button>

                <div className="text-4xl md:text-6xl font-black text-pink-400 mt-4">+</div>

                {/* Word 2 */}
                <button
                  type="button"
                  onClick={() => speak(combo.w2Speak || combo.w2)}
                  className="bg-pink-50 border-4 border-pink-200 rounded-3xl p-4 md:p-8 flex flex-col items-center shadow-lg w-28 h-40 md:w-40 md:h-56 justify-center transform transition-transform hover:scale-105 cursor-pointer"
                >
                  <span className="text-5xl md:text-7xl mb-3 md:mb-6">{combo.e2}</span>
                  <span className="text-xl md:text-3xl font-black text-pink-600">{combo.w2}</span>
                </button>

                <div className="text-4xl md:text-6xl font-black text-pink-400 mt-4">=</div>

                {/* Guess / Answer Box */}
                <button
                  type="button"
                  onClick={!isAnswerRevealed ? handleReveal : () => speak(combo.resultSpeak || combo.result)}
                  className={`border-4 rounded-3xl p-2 md:p-4 flex flex-col items-center justify-center w-28 h-40 md:w-40 md:h-56 transform transition-all hover:scale-105 cursor-pointer ${isAnswerRevealed ? 'bg-pink-100 border-pink-300 shadow-lg' : 'bg-gray-100 border-dashed border-gray-300 shadow-inner'}`}
                >
                  {!isAnswerRevealed ? (
                    <>
                      <span className="text-5xl md:text-7xl font-black text-gray-300">❓</span>
                      <span className="mt-2 text-xs md:text-base font-bold text-gray-400 text-center">לחצו לתשובה!</span>
                    </>
                  ) : (
                    <>
                      <span className="text-5xl md:text-7xl mb-2 md:mb-4 animate-fade-in-up">{combo.resultEmoji}</span>
                      <span className="text-base md:text-2xl font-black text-pink-600 text-center animate-fade-in-up leading-tight">{combo.result}</span>
                    </>
                  )}
                </button>
              </div>

              <div className="flex gap-4 md:gap-8 w-full justify-center">
                <button
                  type="button"
                  onClick={handlePrev}
                  className="px-6 py-3 md:px-10 md:py-4 rounded-full font-bold text-lg md:text-xl transition-all shadow-md bg-pink-100 text-pink-700 hover:bg-pink-200 hover:shadow-lg"
                >
                  הקודם
                </button>
                <button
                  type="button"
                  onClick={handleNext}
                  className="px-6 py-3 md:px-10 md:py-4 rounded-full font-bold text-lg md:text-xl transition-all shadow-md bg-pink-500 text-white hover:bg-pink-600 hover:shadow-lg"
                >
                  הבא
                </button>
              </div>

              <div className="mt-8 text-pink-400 font-bold text-lg">
                {currentIndex + 1} מתוך {shuffledData.length}
              </div>
            </div>
          );
        };

        // --- Opposites Module (הפכים - ללא תמונות) ---
        const OppositesModule = () => {
          const [shuffledData] = useState(() =>
            [...OPPOSITES_DATA]
              .map(pair => Math.random() > 0.5
                ? pair
                : { id: pair.id, w1: pair.w2, w1Speak: pair.w2Speak, w2: pair.w1, w2Speak: pair.w1Speak }
              )
              .sort(() => 0.5 - Math.random())
          );
          const [currentIndex, setCurrentIndex] = useState(0);
          const [isRevealed, setIsRevealed] = useState(false);
          const speak = useSpeech('he-IL');
          const autoTimerRef = React.useRef(null);
          const spokenIdxRef = React.useRef(-1);

          const current = shuffledData[currentIndex];

          const clearTimer = () => {
            if (autoTimerRef.current) {
              clearTimeout(autoTimerRef.current);
              autoTimerRef.current = null;
            }
          };

          useEffect(() => {
            return () => clearTimer();
          }, []);

          useEffect(() => {
            if (spokenIdxRef.current !== currentIndex) {
              spokenIdxRef.current = currentIndex;
              const t = setTimeout(() => {
                speak(`מָה הַהֵפֶךְ שֶׁל ${current.w1Speak || current.w1}?`);
              }, 450);
              return () => clearTimeout(t);
            }
          }, [currentIndex, current, speak]);

          const handleNext = () => {
            clearTimer();
            setIsRevealed(false);
            setCurrentIndex(prev => (prev + 1) % shuffledData.length);
          };

          const handlePrev = () => {
            clearTimer();
            setIsRevealed(false);
            setCurrentIndex(prev => (prev - 1 + shuffledData.length) % shuffledData.length);
          };

          const handleReveal = () => {
            clearTimer();
            setIsRevealed(true);
            speak(current.w2Speak || current.w2);
            autoTimerRef.current = setTimeout(() => {
              setIsRevealed(false);
              setCurrentIndex(prev => (prev + 1) % shuffledData.length);
            }, 2000);
          };

          return (
            <div className="flex flex-col items-center w-full max-w-2xl mx-auto">
              <button
                type="button"
                onClick={() => speak(`מָה הַהֵפֶךְ שֶׁל ${current.w1Speak || current.w1}?`)}
                className="mb-8 bg-pink-100 hover:bg-pink-200 text-pink-700 px-6 py-3 rounded-full font-bold text-lg md:text-xl flex items-center gap-2 shadow-sm transition-all"
              >
                <Volume2Icon /> מה ההפך של "{current.w1}"?
              </button>

              <div className="flex items-center justify-center gap-4 md:gap-8 mb-12 w-full">
                <button
                  type="button"
                  onClick={() => speak(current.w1Speak || current.w1)}
                  className="bg-pink-50 border-4 border-pink-200 rounded-3xl p-6 md:p-10 flex items-center justify-center shadow-lg w-36 h-36 md:w-52 md:h-52 hover:scale-105 transition-transform cursor-pointer"
                >
                  <span className="text-3xl md:text-5xl font-black text-pink-600 text-center">{current.w1}</span>
                </button>

                <span className="text-3xl md:text-5xl font-black text-pink-400">↔️</span>

                <button
                  type="button"
                  onClick={!isRevealed ? handleReveal : () => speak(current.w2Speak || current.w2)}
                  className={`border-4 rounded-3xl p-6 md:p-10 flex flex-col items-center justify-center w-36 h-36 md:w-52 md:h-52 hover:scale-105 transition-all cursor-pointer ${
                    isRevealed
                      ? 'bg-pink-100 border-pink-300 shadow-lg'
                      : 'bg-gray-100 border-dashed border-gray-300 shadow-inner'
                  }`}
                >
                  {!isRevealed ? (
                    <>
                      <span className="text-5xl md:text-6xl font-black text-gray-300">❓</span>
                      <span className="mt-2 text-xs md:text-base font-bold text-gray-400 text-center">לחצו לתשובה</span>
                    </>
                  ) : (
                    <span className="text-3xl md:text-5xl font-black text-pink-600 text-center animate-fade-in-up">
                      {current.w2}
                    </span>
                  )}
                </button>
              </div>

              <div className="flex gap-4 md:gap-8 w-full justify-center">
                <button
                  type="button"
                  onClick={handlePrev}
                  className="px-6 py-3 md:px-10 md:py-4 rounded-full font-bold text-lg md:text-xl transition-all shadow-md bg-pink-100 text-pink-700 hover:bg-pink-200"
                >
                  הקודם
                </button>
                <button
                  type="button"
                  onClick={handleNext}
                  className="px-6 py-3 md:px-10 md:py-4 rounded-full font-bold text-lg md:text-xl transition-all shadow-md bg-pink-500 text-white hover:bg-pink-600"
                >
                  הבא
                </button>
              </div>

              <div className="mt-8 text-pink-400 font-bold text-lg">
                {currentIndex + 1} מתוך {shuffledData.length}
              </div>
            </div>
          );
        };

        // --- Rhymes Game ---
        const RhymesGame = () => {
          const [shuffledData] = useState(() => [...RHYMES_DATA].sort(() => 0.5 - Math.random()));
          const [currentIndex, setCurrentIndex] = useState(0);
          const [options, setOptions] = useState([]);
          const [feedback, setFeedback] = useState(null);
          const speak = useSpeech('he-IL');
          const spokenIndexRef = React.useRef(-1);

          const current = shuffledData[currentIndex];

          const handleNext = () => setCurrentIndex(prev => (prev + 1) % shuffledData.length);
          const handlePrev = () => setCurrentIndex(prev => (prev - 1 + shuffledData.length) % shuffledData.length);

          useEffect(() => {
            const choices = [current.match, ...current.distractors].sort(() => Math.random() - 0.5);
            setOptions(choices);
            setFeedback(null);
          }, [currentIndex, current]);

          useEffect(() => {
            if (spokenIndexRef.current !== currentIndex) {
              spokenIndexRef.current = currentIndex;
              const t = setTimeout(() => {
                speak(`מה מתחרז עם ${current.target.speak || current.target.w}?`);
              }, 500);
              return () => clearTimeout(t);
            }
          }, [currentIndex, current, speak]);

          const handleGuess = (item, e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            if (feedback === 'correct') return;
            speak(item.speak || item.w);

            if (item.w === current.match.w) {
              setFeedback('correct');
              setTimeout(() => handleNext(), 1400);
            } else {
              setFeedback('wrong');
              setTimeout(() => speak('נַסּוּ שׁוּב'), 850);
            }
          };

          return (
            <div className="flex flex-col items-center w-full max-w-3xl mx-auto">
              <button
                type="button"
                onClick={() => speak(current.target.speak || current.target.w)}
                className="bg-pink-100 border-4 border-pink-300 rounded-3xl p-6 flex flex-col items-center shadow-lg w-56 h-64 justify-center mb-10 cursor-pointer transform hover:scale-105 transition-transform"
              >
                <span className="text-xl md:text-2xl font-bold text-pink-500 mb-2 text-center">מה מתחרז עם...</span>
                <span className="text-7xl md:text-8xl mb-4">{current.target.e}</span>
                <span className="text-3xl md:text-4xl font-black text-pink-700">{current.target.w}</span>
              </button>

              <div className="grid grid-cols-2 gap-4 md:gap-8 w-full max-w-lg mb-10">
                {options.map((opt, i) => {
                  const isCorrect = feedback === 'correct' && opt.w === current.match.w;
                  const isWrong = feedback === 'wrong' && opt.w !== current.match.w;
                  return (
                    <button
                      key={`${currentIndex}-${opt.w}-${i}`}
                      type="button"
                      onClick={(e) => handleGuess(opt, e)}
                      className={`
                        bg-white border-4 rounded-3xl p-4 flex flex-col items-center justify-center h-36 md:h-48 shadow-md hover:shadow-xl hover:scale-105 transition-all focus:outline-none
                        ${isCorrect ? 'border-green-400 bg-green-50 shadow-green-200' : 'border-gray-200'}
                        ${isWrong ? 'opacity-50 scale-95 border-red-200' : ''}
                      `}
                    >
                      <span className={`text-6xl md:text-7xl mb-3 ${isCorrect ? 'animate-bounce' : ''}`}>{opt.e}</span>
                      <span className={`text-xl md:text-2xl font-bold ${isCorrect ? 'text-green-600' : 'text-gray-700'}`}>{opt.w}</span>
                    </button>
                  );
                })}
              </div>

              <div className="flex gap-4 md:gap-8 w-full justify-center">
                <button type="button" onClick={handlePrev} className="px-6 py-3 md:px-10 md:py-4 rounded-full font-bold text-lg md:text-xl transition-all shadow-md bg-pink-100 text-pink-700 hover:bg-pink-200">
                  הקודם
                </button>
                <button type="button" onClick={handleNext} className="px-6 py-3 md:px-10 md:py-4 rounded-full font-bold text-lg md:text-xl transition-all shadow-md bg-pink-500 text-white hover:bg-pink-600">
                  הבא
                </button>
              </div>

              <div className="mt-8 text-pink-400 font-bold text-lg">
                {currentIndex + 1} מתוך {shuffledData.length}
              </div>
            </div>
          );
        };

        // --- Starting Sound Pairs Game (זוגות בצליל פותח) ---
        const StartingSoundPairsGame = () => {
          const PAIRS_PER_ROUND = 4;
          const [cards, setCards] = useState([]);
          const [selectedUid, setSelectedUid] = useState(null);
          const [wrongPairUids, setWrongPairUids] = useState([]);
          const [matchedPairIds, setMatchedPairIds] = useState([]);
          const [lastMatchedSound, setLastMatchedSound] = useState(null);
          const [roundsCompleted, setRoundsCompleted] = useState(0);
          const [isLocked, setIsLocked] = useState(false);

          const speak = useSpeech('he-IL');
          const timerRef = React.useRef(null);
          const hasSpokenIntroRef = React.useRef(false);

          const instructionSpeak = 'מִצְאוּ זּוּגוֹת שֶׁמַּתְחִילִים בְּאוֹתוֹ צְלִיל פּוֹתֵחַ!';

          const buildRound = () => {
            if (timerRef.current) clearTimeout(timerRef.current);
            const shuffledPool = [...STARTING_SOUND_PAIRS_DATA].sort(() => Math.random() - 0.5);
            const chosenPairs = [];
            const usedLetters = new Set();

            for (const pair of shuffledPool) {
              if (chosenPairs.length >= PAIRS_PER_ROUND) break;
              if (usedLetters.has(pair.letterGroup)) continue;
              usedLetters.add(pair.letterGroup);
              chosenPairs.push(pair);
            }

            const boardCards = chosenPairs
              .flatMap((pair) =>
                pair.items.map((item, idx) => ({
                  uid: `${pair.id}-${idx}-${Math.random().toString(36).slice(2, 6)}`,
                  pairId: pair.id,
                  soundDisplay: pair.soundDisplay,
                  soundSpeak: pair.soundSpeak,
                  w: item.w,
                  speak: item.speak,
                  e: item.e
                }))
              )
              .sort(() => Math.random() - 0.5);

            setCards(boardCards);
            setSelectedUid(null);
            setWrongPairUids([]);
            setMatchedPairIds([]);
            setLastMatchedSound(null);
            setIsLocked(false);
          };

          useEffect(() => {
            buildRound();
            return () => {
              if (timerRef.current) clearTimeout(timerRef.current);
            };
          }, []);

          useEffect(() => {
            if (!hasSpokenIntroRef.current && cards.length > 0) {
              hasSpokenIntroRef.current = true;
              const t = setTimeout(() => speak(instructionSpeak), 450);
              return () => clearTimeout(t);
            }
          }, [cards, speak]);

          const handleCardClick = (card, e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            if (isLocked || matchedPairIds.includes(card.pairId)) return;

            speak(card.speak);

            // לחיצה חוזרת על אותו קלף מבטלת בחירה
            if (selectedUid === card.uid) {
              setSelectedUid(null);
              return;
            }

            // בחירת הקלף הראשון בזוג
            if (!selectedUid) {
              setLastMatchedSound(null);
              setSelectedUid(card.uid);
              return;
            }

            // בחירת הקלף השני בזוג
            const firstCard = cards.find((c) => c.uid === selectedUid);
            if (!firstCard) {
              setSelectedUid(card.uid);
              return;
            }

            if (firstCard.pairId === card.pairId) {
              const nextMatched = [...matchedPairIds, card.pairId];
              setMatchedPairIds(nextMatched);
              setSelectedUid(null);
              setLastMatchedSound(card.soundDisplay);

              if (nextMatched.length === PAIRS_PER_ROUND) {
                setIsLocked(true);
                setRoundsCompleted((r) => r + 1);
                timerRef.current = setTimeout(() => {
                  speak('כּוֹל הַכָּבוֹד! מְצָאתֶם אֶת כּוֹל הַזּוּגוֹת!');
                  timerRef.current = setTimeout(() => {
                    buildRound();
                  }, 1700);
                }, 700);
              }
            } else {
              setIsLocked(true);
              setWrongPairUids([firstCard.uid, card.uid]);
              timerRef.current = setTimeout(() => {
                speak('נַסּוּ שׁוּב');
                setSelectedUid(null);
                setWrongPairUids([]);
                setIsLocked(false);
              }, 900);
            }
          };

          const allMatched = cards.length > 0 && matchedPairIds.length === PAIRS_PER_ROUND;

          return (
            <div className="flex flex-col items-center w-full max-w-3xl mx-auto">
              <div className="flex flex-wrap items-center justify-center gap-3 mb-5">
                <button
                  type="button"
                  onClick={() => speak(instructionSpeak)}
                  className="bg-pink-100 hover:bg-pink-200 text-pink-700 px-6 py-3 rounded-full font-bold text-base md:text-xl flex items-center gap-2 shadow-sm transition-all"
                >
                  <Volume2Icon /> בחרו זוגות שמתחילים באותו צליל פותח!
                </button>

                <button
                  type="button"
                  onClick={buildRound}
                  className="px-4 py-2.5 rounded-full bg-gray-100 hover:bg-gray-200 text-gray-700 font-bold text-sm transition-all"
                >
                  🔄 לוח חדש
                </button>
              </div>

              {/* חיווי הצלחה / צליל משותף */}
              <div className="h-10 mb-4 flex items-center justify-center">
                {allMatched ? (
                  <div className="text-xl md:text-2xl font-black text-green-600 animate-bounce">
                    כל הכבוד! מצאתם את כל הזוגות! מיד נפתח לוח חדש... 🎉
                  </div>
                ) : wrongPairUids.length > 0 ? (
                  <div className="text-lg md:text-xl font-bold text-red-500 animate-pulse">
                    לא אותו צליל פותח – נסו שוב! 💪
                  </div>
                ) : lastMatchedSound ? (
                  <div className="text-lg md:text-xl font-black text-green-600 animate-fade-in-up">
                    יופי! שתי המילים מתחילות בצליל "{lastMatchedSound}" ✨
                  </div>
                ) : null}
              </div>

              {/* לוח 8 הכרטיסים (4 זוגות) */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 sm:gap-4 md:gap-5 w-full">
                {cards.map((card) => {
                  const isMatched = matchedPairIds.includes(card.pairId);
                  const isSelected = selectedUid === card.uid;
                  const isWrong = wrongPairUids.includes(card.uid);

                  return (
                    <button
                      key={card.uid}
                      type="button"
                      disabled={isMatched}
                      onClick={(e) => handleCardClick(card, e)}
                      className={`
                        relative rounded-3xl border-4 p-4 h-36 sm:h-40 md:h-44 flex flex-col items-center justify-center transition-all duration-200 focus:outline-none
                        ${isMatched
                          ? 'bg-green-50 border-green-400 opacity-85 scale-95 shadow-sm cursor-default'
                          : isWrong
                            ? 'bg-red-50 border-red-400 ring-4 ring-red-200 scale-95'
                            : isSelected
                              ? 'bg-pink-50 border-pink-500 ring-4 ring-pink-200 -translate-y-1.5 shadow-xl cursor-pointer'
                              : 'bg-white border-pink-100 hover:border-pink-300 shadow-md hover:shadow-xl hover:-translate-y-1 cursor-pointer'
                        }
                      `}
                    >
                      {isMatched && (
                        <span className="absolute top-2 left-2 bg-green-200 text-green-800 text-xs sm:text-sm font-black px-2 py-0.5 rounded-full">
                          {card.soundDisplay} ✓
                        </span>
                      )}
                      <span className="text-5xl sm:text-6xl mb-2 select-none">{card.e}</span>
                      <span className={`text-lg sm:text-xl font-black select-none ${isMatched ? 'text-green-700' : 'text-gray-800'}`}>
                        {card.w}
                      </span>
                    </button>
                  );
                })}
              </div>

              {roundsCompleted > 0 && (
                <div className="mt-6 text-pink-500 font-bold text-base md:text-lg">
                  לוחות שהושלמו: {roundsCompleted} 🌟
                </div>
              )}
            </div>
          );
        };

        // --- Math Counting Game (מנייה: קל 1-10 מסודר | קשה עד 20 מפוזר) ---
        const COUNTING_ITEMS = [
          { emoji: '🚗', plural: 'מכוניות' },
          { emoji: '🐞', plural: 'חיפושיות' },
          { emoji: '🍎', plural: 'תפוחים' },
          { emoji: '⭐', plural: 'כוכבים' },
          { emoji: '🎈', plural: 'בלונים' },
          { emoji: '🦋', plural: 'פרפרים' },
          { emoji: '🍓', plural: 'תותים' },
          { emoji: '⚽', plural: 'כדורים' },
          { emoji: '🐟', plural: 'דגים' },
          { emoji: '🌻', plural: 'פרחים' }
        ];

        const CountingGame = () => {
          const [difficulty, setDifficulty] = useState('easy'); // 'easy' | 'hard'
          const [question, setQuestion] = useState(null);
          const [feedback, setFeedback] = useState('');
          const [roundId, setRoundId] = useState(0);
          const lastCountRef = React.useRef(null);
          const hasSpokenIntroRef = React.useRef(false);
          const speak = useSpeech('he-IL');

          const generateQuestion = (level = difficulty) => {
            const minCount = level === 'hard' ? 8 : 1;
            const maxCount = level === 'hard' ? 20 : 10;

            let count;
            do {
              count = minCount + Math.floor(Math.random() * (maxCount - minCount + 1));
            } while (count === lastCountRef.current && maxCount > minCount);
            lastCountRef.current = count;

            const itemType = COUNTING_ITEMS[Math.floor(Math.random() * COUNTING_ITEMS.length)];

            // Build 4 distinct number options
            const optionSet = new Set([count]);
            if (level === 'hard') {
              const nearbyOffsets = [-3, -2, -1, 1, 2, 3].sort(() => 0.5 - Math.random());
              for (const off of nearbyOffsets) {
                if (optionSet.size >= 4) break;
                const cand = count + off;
                if (cand >= 1 && cand <= 20) optionSet.add(cand);
              }
            }
            while (optionSet.size < 4) {
              const cand = 1 + Math.floor(Math.random() * maxCount);
              optionSet.add(cand);
            }

            const options = Array.from(optionSet).sort((a, b) => a - b);
            const positions = level === 'hard' ? generateScatteredPositions(count, 15) : [];

            setRoundId(prev => prev + 1);
            setFeedback('');
            setQuestion({ count, itemType, options, positions });
          };

          useEffect(() => {
            generateQuestion(difficulty);
          }, [difficulty]);

          useEffect(() => {
            if (!hasSpokenIntroRef.current && question) {
              hasSpokenIntroRef.current = true;
              const t = setTimeout(() => speak('כַּמָּה יֵשׁ כָּאן?'), 450);
              return () => clearTimeout(t);
            }
          }, [question, speak]);

          const handleSelectOption = (num, e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            if (!question || feedback === 'correct') return;

            const numWord = HEBREW_NUMBER_WORDS[num - 1] || num.toString();
            speak(numWord);

            if (num === question.count) {
              setFeedback('correct');
              setTimeout(() => {
                generateQuestion(difficulty);
              }, 1150);
            } else {
              setFeedback('wrong');
              setTimeout(() => {
                speak('נַסּוּ שׁוּב');
              }, 850);
            }
          };

          if (!question) return null;

          return (
            <div className="flex flex-col items-center w-full max-w-3xl mx-auto">
              {/* בורר רמת קושי */}
              <div className="flex gap-2 bg-gray-100 p-1.5 rounded-2xl mb-6">
                <button
                  type="button"
                  onClick={() => setDifficulty('easy')}
                  className={`px-6 py-2 rounded-xl font-bold transition-all ${difficulty === 'easy' ? 'bg-white text-purple-600 shadow-md' : 'text-gray-500 hover:text-gray-700'}`}
                >
                  קל
                </button>
                <button
                  type="button"
                  onClick={() => setDifficulty('hard')}
                  className={`px-6 py-2 rounded-xl font-bold transition-all ${difficulty === 'hard' ? 'bg-white text-purple-600 shadow-md' : 'text-gray-500 hover:text-gray-700'}`}
                >
                  קשה
                </button>
              </div>

              <button
                type="button"
                onClick={() => speak(`כַּמָּה ${question.itemType.plural} יֵשׁ כָּאן?`)}
                className="mb-6 bg-purple-100 hover:bg-purple-200 text-purple-700 px-6 py-3 rounded-full font-bold text-lg md:text-2xl flex items-center gap-2 shadow-sm transition-all"
              >
                <Volume2Icon /> כמה {question.itemType.plural} יש כאן?
              </button>

              {/* תצוגת הפריטים */}
              {difficulty === 'easy' ? (
                <div className="bg-purple-50 border-4 border-purple-200 rounded-3xl p-6 md:p-10 w-full min-h-[200px] flex flex-wrap items-center justify-center gap-4 md:gap-6 mb-8 shadow-inner">
                  {Array.from({ length: question.count }).map((_, idx) => (
                    <span key={`${roundId}-item-${idx}`} className="text-5xl md:text-6xl select-none">
                      {question.itemType.emoji}
                    </span>
                  ))}
                </div>
              ) : (
                <div className="relative bg-purple-50 border-4 border-purple-200 rounded-3xl w-full h-72 md:h-96 mb-8 shadow-inner overflow-hidden">
                  {question.positions.map((pos, idx) => (
                    <span
                      key={`${roundId}-scatter-${idx}`}
                      style={{
                        left: `${pos.x}%`,
                        top: `${pos.y}%`,
                        transform: `translate(-50%, -50%) rotate(${pos.rot}deg)`
                      }}
                      className="absolute text-3xl md:text-5xl select-none"
                    >
                      {question.itemType.emoji}
                    </span>
                  ))}
                </div>
              )}

              {/* חיווי ויזואלי */}
              <div className="h-8 mb-4">
                {feedback === 'correct' && <div className="text-2xl font-black text-green-500 animate-bounce">נכון מאוד! 🎉</div>}
                {feedback === 'wrong' && <div className="text-xl font-bold text-red-500 animate-pulse">נסו שוב! 💪</div>}
              </div>

              {/* כפתורי תשובות */}
              <div key={`count-opts-${roundId}`} className="grid grid-cols-4 gap-3 md:gap-6 w-full max-w-xl">
                {question.options.map(num => {
                  const isCorrect = feedback === 'correct' && num === question.count;
                  return (
                    <button
                      key={`${roundId}-opt-${num}`}
                      type="button"
                      onClick={(e) => handleSelectOption(num, e)}
                      className={`
                        h-20 md:h-24 rounded-3xl font-black text-3xl md:text-4xl border-4 transition-all shadow-md hover:shadow-xl hover:-translate-y-1 focus:outline-none
                        ${isCorrect ? 'bg-green-100 border-green-400 text-green-700 scale-105' : 'bg-white border-purple-200 text-purple-700 hover:bg-purple-50'}
                      `}
                    >
                      {num}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        };

        // --- Math Comparison Game (השוואה: קל עד 9 מסודר | קשה עד 15 מפוזר, אייקונים שונים) ---
        const ComparisonGame = () => {
          const [difficulty, setDifficulty] = useState('easy'); // 'easy' | 'hard'
          const [round, setRound] = useState(null);
          const [feedback, setFeedback] = useState('');
          const [winnerGroup, setWinnerGroup] = useState(null);
          const [roundId, setRoundId] = useState(0);
          const speak = useSpeech('he-IL');
          const hasSpokenIntroRef = React.useRef(false);

          const generateRound = (level = difficulty) => {
            const minVal = level === 'hard' ? 6 : 1;
            const maxVal = level === 'hard' ? 15 : 9;

            let c1 = minVal + Math.floor(Math.random() * (maxVal - minVal + 1));
            let c2 = minVal + Math.floor(Math.random() * (maxVal - minVal + 1));
            while (c2 === c1) {
              c2 = minVal + Math.floor(Math.random() * (maxVal - minVal + 1));
            }

            const shuffledItems = [...COUNTING_ITEMS].sort(() => 0.5 - Math.random());
            const item1 = shuffledItems[0];
            const item2 = shuffledItems[1];

            const pos1 = level === 'hard' ? generateScatteredPositions(c1, 17) : [];
            const pos2 = level === 'hard' ? generateScatteredPositions(c2, 17) : [];

            setRoundId(prev => prev + 1);
            setFeedback('');
            setWinnerGroup(null);
            setRound({ c1, c2, item1, item2, pos1, pos2 });
          };

          useEffect(() => {
            generateRound(difficulty);
          }, [difficulty]);

          useEffect(() => {
            if (!hasSpokenIntroRef.current && round) {
              hasSpokenIntroRef.current = true;
              const t = setTimeout(() => speak('אֵיפֹה יֵשׁ יוֹתֵר?'), 450);
              return () => clearTimeout(t);
            }
          }, [round, speak]);

          const handleChoose = (side, e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            if (!round || feedback === 'correct') return;

            const chosenCount = side === 'right' ? round.c1 : round.c2;
            const otherCount = side === 'right' ? round.c2 : round.c1;

            if (chosenCount > otherCount) {
              setFeedback('correct');
              setWinnerGroup(side);
              speak('כל הכבוד!');
              setTimeout(() => generateRound(difficulty), 1350);
            } else {
              setFeedback('wrong');
              speak('נַסּוּ שׁוּב');
            }
          };

          if (!round) return null;

          const renderGroupBox = (side, count, itemType, positions) => {
            const isWin = winnerGroup === side;
            return (
              <button
                type="button"
                onClick={(e) => handleChoose(side, e)}
                className={`
                  flex-1 min-h-[210px] md:min-h-[280px] rounded-3xl border-4 p-4 md:p-6 transition-all focus:outline-none cursor-pointer
                  ${isWin
                    ? 'bg-green-50 border-green-400 ring-4 ring-green-200 scale-[1.03] shadow-xl'
                    : 'bg-purple-50/70 border-purple-200 hover:border-purple-400 hover:bg-purple-50 shadow-md hover:shadow-xl'
                  }
                `}
              >
                {difficulty === 'easy' ? (
                  <div className="w-full h-full flex flex-wrap items-center justify-center gap-3 md:gap-4">
                    {Array.from({ length: count }).map((_, i) => (
                      <span key={`${roundId}-${side}-${i}`} className="text-4xl md:text-5xl select-none">
                        {itemType.emoji}
                      </span>
                    ))}
                  </div>
                ) : (
                  <div className="relative w-full h-56 md:h-72 overflow-hidden">
                    {positions.map((pos, i) => (
                      <span
                        key={`${roundId}-${side}-s-${i}`}
                        style={{
                          left: `${pos.x}%`,
                          top: `${pos.y}%`,
                          transform: `translate(-50%, -50%) rotate(${pos.rot}deg)`
                        }}
                        className="absolute text-2xl sm:text-3xl md:text-4xl select-none"
                      >
                        {itemType.emoji}
                      </span>
                    ))}
                  </div>
                )}
              </button>
            );
          };

          return (
            <div className="flex flex-col items-center w-full max-w-4xl mx-auto">
              <div className="flex gap-2 bg-gray-100 p-1.5 rounded-2xl mb-6">
                <button
                  type="button"
                  onClick={() => setDifficulty('easy')}
                  className={`px-6 py-2 rounded-xl font-bold transition-all ${difficulty === 'easy' ? 'bg-white text-purple-600 shadow-md' : 'text-gray-500 hover:text-gray-700'}`}
                >
                  קל
                </button>
                <button
                  type="button"
                  onClick={() => setDifficulty('hard')}
                  className={`px-6 py-2 rounded-xl font-bold transition-all ${difficulty === 'hard' ? 'bg-white text-purple-600 shadow-md' : 'text-gray-500 hover:text-gray-700'}`}
                >
                  קשה
                </button>
              </div>

              <button
                type="button"
                onClick={() => speak('אֵיפֹה יֵשׁ יוֹתֵר?')}
                className="mb-6 bg-purple-100 hover:bg-purple-200 text-purple-700 px-6 py-3 rounded-full font-bold text-lg md:text-2xl flex items-center gap-2 shadow-sm transition-all"
              >
                <Volume2Icon /> איפה יש יותר?
              </button>

              <div className="h-8 mb-4">
                {feedback === 'correct' && <div className="text-2xl font-black text-green-500 animate-bounce">כל הכבוד! 🎉</div>}
                {feedback === 'wrong' && <div className="text-xl font-bold text-red-500 animate-pulse">נסו שוב! 💪</div>}
              </div>

              <div className="flex flex-col sm:flex-row items-stretch justify-center gap-4 md:gap-8 w-full">
                {renderGroupBox('right', round.c1, round.item1, round.pos1)}
                <div className="flex items-center justify-center text-3xl md:text-4xl font-black text-purple-400 select-none">
                  ⚖️
                </div>
                {renderGroupBox('left', round.c2, round.item2, round.pos2)}
              </div>
            </div>
          );
        };

        // --- YouTube Songs Module ---
        const SongsModule = ({ videos, themeClass = 'amber' }) => {
          const [selectedIdx, setSelectedIdx] = useState(0);
          const theme = getThemeClasses(themeClass);
          const currentVideo = videos[selectedIdx] || videos[0];

          if (!currentVideo) return null;

          return (
            <div className="flex flex-col items-center w-full max-w-3xl mx-auto">
              {videos.length > 1 && (
                <div className="flex flex-wrap justify-center gap-3 mb-6 w-full">
                  {videos.map((vid, idx) => (
                    <button
                      key={vid.id}
                      type="button"
                      onClick={() => setSelectedIdx(idx)}
                      className={`px-4 py-2.5 rounded-2xl font-bold text-sm md:text-base transition-all border-2 ${
                        idx === selectedIdx
                          ? `${theme.button} text-white border-transparent shadow-md scale-105`
                          : 'bg-amber-50 text-amber-800 border-amber-200 hover:bg-amber-100'
                      }`}
                    >
                      🎵 {vid.title}
                    </button>
                  ))}
                </div>
              )}

              <div className="w-full aspect-video rounded-3xl overflow-hidden shadow-xl border-4 border-amber-200 bg-black">
                <iframe
                  key={currentVideo.videoId}
                  className="w-full h-full"
                  src={`https://www.youtube.com/embed/${currentVideo.videoId}?rel=0`}
                  title={currentVideo.title}
                  frameBorder="0"
                  referrerPolicy="strict-origin-when-cross-origin"
                  allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                  allowFullScreen
                />
              </div>

              <a
                href={`https://www.youtube.com/watch?v=${currentVideo.videoId}`}
                target="_blank"
                rel="noopener noreferrer"
                className="mt-4 text-sm font-bold text-amber-600 hover:text-amber-700 underline"
              >
                פתיחה ישירה ביוטיוב ↗
              </a>
            </div>
          );
        };

        // --- Memory Game (משחק זיכרון רב-לשוני) ---
        const MemoryGame = () => {
          const [topic, setTopic] = useState('animals'); // 'letters' | 'numbers' | 'animals' | 'colors'
          const [langKey, setLangKey] = useState('he'); // 'he' | 'ar' | 'en'
          const [boardSize, setBoardSize] = useState(12); // 12 | 18
          const [cards, setCards] = useState([]);
          const [flippedIndices, setFlippedIndices] = useState([]);
          const [matchedIds, setMatchedIds] = useState([]);
          const [moves, setMoves] = useState(0);
          const [isLocked, setIsLocked] = useState(false);

          const effectiveLang = topic === 'letters' ? 'he' : langKey;
          const speechLangMap = { he: 'he-IL', ar: 'ar-SA', en: 'en-US' };
          const speak = useSpeech(speechLangMap[effectiveLang] || 'he-IL');

          const getPool = () => {
            if (topic === 'letters') {
              return HEBREW_LETTERS.map(l => ({
                id: l.id,
                type: 'text',
                display: l.display,
                speakText: l.spoken
              }));
            }
            if (topic === 'numbers') {
              if (effectiveLang === 'ar') {
                return ARABIC_NUMBERS.map(n => ({ id: n.id, type: 'text', display: n.display, sub: n.sub, speakText: n.spoken }));
              }
              if (effectiveLang === 'en') {
                return ENGLISH_NUMBERS.map(n => ({ id: n.id, type: 'text', display: n.display, sub: n.sub, speakText: n.spoken }));
              }
              return MATH_NUMBERS.slice(0, 20).map(n => ({ id: n.id, type: 'text', display: n.display, speakText: n.spoken }));
            }
            if (topic === 'animals') {
              const src = effectiveLang === 'ar' ? ARABIC_ANIMALS : effectiveLang === 'en' ? ENGLISH_ANIMALS : HEBREW_ANIMALS;
              return src.map(a => ({ id: a.id, type: 'animal', emoji: a.emoji, label: a.text, speakText: a.speak }));
            }
            // colors
            const cSrc = effectiveLang === 'ar' ? ARABIC_COLORS : effectiveLang === 'en' ? ENGLISH_COLORS : HEBREW_COLORS;
            return cSrc.map(c => ({
              id: c.id,
              type: 'color',
              bg: c.bg,
              label: c.text,
              textColor: c.textColor,
              border: c.border,
              speakText: c.speak
            }));
          };

          const initMemoryBoard = () => {
            const pool = getPool();
            const pairCount = Math.min(boardSize / 2, pool.length);
            const selected = [...pool].sort(() => 0.5 - Math.random()).slice(0, pairCount);
            const deck = [...selected, ...selected]
              .map((item, idx) => ({ ...item, uid: `mem-${idx}-${Math.random().toString(36).slice(2, 6)}` }))
              .sort(() => 0.5 - Math.random());

            setCards(deck);
            setFlippedIndices([]);
            setMatchedIds([]);
            setMoves(0);
            setIsLocked(false);
          };

          useEffect(() => {
            initMemoryBoard();
          }, [topic, langKey, boardSize]);

          const handleCardFlip = (idx) => {
            if (isLocked) return;
            if (flippedIndices.includes(idx)) return;
            const card = cards[idx];
            if (!card || matchedIds.includes(card.id)) return;

            speak(card.speakText);
            const nextFlipped = [...flippedIndices, idx];
            setFlippedIndices(nextFlipped);

            if (nextFlipped.length === 2) {
              setMoves(m => m + 1);
              setIsLocked(true);
              const [firstIdx, secondIdx] = nextFlipped;
              if (cards[firstIdx].id === cards[secondIdx].id) {
                setTimeout(() => {
                  setMatchedIds(prev => [...prev, cards[firstIdx].id]);
                  setFlippedIndices([]);
                  setIsLocked(false);
                }, 650);
              } else {
                setTimeout(() => {
                  setFlippedIndices([]);
                  setIsLocked(false);
                }, 1150);
              }
            }
          };

          const isComplete = cards.length > 0 && matchedIds.length === cards.length / 2;

          return (
            <div className="flex flex-col items-center w-full max-w-3xl mx-auto">
              <div className="flex flex-wrap items-center justify-center gap-2 mb-3">
                {[
                  { id: 'animals', label: '🐾 חיות' },
                  { id: 'colors', label: '🎨 צבעים' },
                  { id: 'numbers', label: '🔢 מספרים' },
                  { id: 'letters', label: '🔠 אותיות' }
                ].map(t => (
                  <button
                    key={t.id}
                    type="button"
                    onClick={() => setTopic(t.id)}
                    className={`px-4 py-2 rounded-xl font-bold text-sm transition-all ${
                      topic === t.id ? 'bg-orange-500 text-white shadow-md' : 'bg-gray-100 text-gray-600 hover:bg-gray-200'
                    }`}
                  >
                    {t.label}
                  </button>
                ))}
              </div>

              <div className="flex flex-wrap items-center justify-center gap-3 mb-6">
                {topic !== 'letters' && (
                  <div className="flex gap-1.5 bg-gray-100 p-1 rounded-xl">
                    {[
                      { id: 'he', label: 'עברית' },
                      { id: 'ar', label: 'ערבית' },
                      { id: 'en', label: 'אנגלית' }
                    ].map(l => (
                      <button
                        key={l.id}
                        type="button"
                        onClick={() => setLangKey(l.id)}
                        className={`px-3 py-1.5 rounded-lg font-bold text-xs sm:text-sm transition-all ${
                          langKey === l.id ? 'bg-white text-orange-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'
                        }`}
                      >
                        {l.label}
                      </button>
                    ))}
                  </div>
                )}

                <div className="flex gap-1.5 bg-gray-100 p-1 rounded-xl">
                  {[12, 18].map(sz => (
                    <button
                      key={sz}
                      type="button"
                      onClick={() => setBoardSize(sz)}
                      className={`px-3 py-1.5 rounded-lg font-bold text-xs sm:text-sm transition-all ${
                        boardSize === sz ? 'bg-white text-orange-600 shadow-sm' : 'text-gray-500 hover:text-gray-700'
                      }`}
                    >
                      {sz} קלפים
                    </button>
                  ))}
                </div>

                <button
                  type="button"
                  onClick={initMemoryBoard}
                  className="px-4 py-2 rounded-xl bg-orange-100 text-orange-700 font-bold text-xs sm:text-sm hover:bg-orange-200 transition-all"
                >
                  🔄 ערבב מחדש
                </button>
              </div>

              {isComplete && (
                <div className="mb-6 bg-green-50 border-4 border-green-300 rounded-3xl px-6 py-4 text-center animate-bounce">
                  <div className="text-xl md:text-2xl font-black text-green-700">
                    כל הכבוד! מצאתם את כל הזוגות ב-{moves} מהלכים! 🎉
                  </div>
                </div>
              )}

              <div className={`grid gap-3 md:gap-4 w-full ${boardSize === 18 ? 'grid-cols-3 sm:grid-cols-6 max-w-3xl' : 'grid-cols-3 sm:grid-cols-4 max-w-xl'}`}>
                {cards.map((card, idx) => {
                  const isOpen = flippedIndices.includes(idx) || matchedIds.includes(card.id);
                  const isMatched = matchedIds.includes(card.id);

                  return (
                    <button
                      key={card.uid}
                      type="button"
                      onClick={() => handleCardFlip(idx)}
                      className={`
                        aspect-square rounded-2xl border-4 flex flex-col items-center justify-center p-2 transition-all duration-300 focus:outline-none
                        ${isOpen
                          ? isMatched
                            ? 'bg-green-50 border-green-400 scale-95 shadow-sm'
                            : 'bg-white border-orange-300 shadow-lg scale-105'
                          : 'bg-gradient-to-br from-orange-400 to-amber-500 border-amber-200 text-white shadow-md hover:scale-105 cursor-pointer'
                        }
                      `}
                    >
                      {!isOpen ? (
                        <span className="text-3xl md:text-4xl select-none">🌸</span>
                      ) : card.type === 'color' ? (
                        <div className="flex flex-col items-center justify-center gap-1.5">
                          <div
                            style={{ background: card.bg }}
                            className={`${boardSize === 18 ? 'w-9 h-9 md:w-11 md:h-11' : 'w-10 h-10 md:w-14 md:h-14'} rounded-full shadow-inner ${card.border ? 'border-2 border-gray-300' : ''}`}
                          />
                          <span className="text-xs md:text-sm font-black text-gray-700 text-center leading-tight">{card.label}</span>
                        </div>
                      ) : card.type === 'animal' ? (
                        <div className="flex flex-col items-center justify-center">
                          <span className={`${boardSize === 18 ? 'text-3xl md:text-4xl mb-0.5' : 'text-3xl md:text-5xl mb-1'}`}>{card.emoji}</span>
                          <span className="text-xs md:text-sm font-black text-gray-700 text-center leading-tight">{card.label}</span>
                        </div>
                      ) : (
                        <div className="flex flex-col items-center justify-center">
                          <span className={`${boardSize === 18 ? 'text-3xl md:text-4xl' : 'text-3xl md:text-5xl'} font-black text-orange-600`}>{card.display}</span>
                          {card.sub && <span className="text-[11px] md:text-xs font-bold text-gray-500 mt-1">{card.sub}</span>}
                        </div>
                      )}
                    </button>
                  );
                })}
              </div>
            </div>
          );
        };

        // --- War Card Game (משחק "מלחמה" בקלפים - סידור סמלים של קלפים אמיתיים) ---
        const WAR_SUITS = [
          { id: 'hearts', symbol: '♥', colorClass: 'text-rose-600' },
          { id: 'diamonds', symbol: '♦', colorClass: 'text-rose-600' },
          { id: 'spades', symbol: '♠', colorClass: 'text-slate-800' },
          { id: 'clubs', symbol: '♣', colorClass: 'text-slate-800' }
        ];

        const WAR_RANKS = [
          { value: 2, label: '2', name: 'שתיים', speak: 'שְׁתַּיִם' },
          { value: 3, label: '3', name: 'שלוש', speak: 'שָׁלוֹשׁ' },
          { value: 4, label: '4', name: 'ארבע', speak: 'אַרְבַּע' },
          { value: 5, label: '5', name: 'חמש', speak: 'חָמֵשׁ' },
          { value: 6, label: '6', name: 'שש', speak: 'שֵׁשׁ' },
          { value: 7, label: '7', name: 'שבע', speak: 'שֶׁבַע' },
          { value: 8, label: '8', name: 'שמונה', speak: 'שְׁמוֹנֶה' },
          { value: 9, label: '9', name: 'תשע', speak: 'תֵּשַׁע' },
          { value: 10, label: '10', name: 'עשר', speak: 'עֶשֶׂר' },
          { value: 11, label: 'J', royalIcon: '🤴', royalTitle: 'נסיך', speak: 'נָסִיךְ' },
          { value: 12, label: 'Q', royalIcon: '👸', royalTitle: 'מלכה', speak: 'מַלְכָּה' },
          { value: 13, label: 'K', royalIcon: '👑', royalTitle: 'מלך', speak: 'מֶלֶךְ' },
          { value: 14, label: 'A', royalIcon: '⭐', royalTitle: 'אס', speak: 'אָס' }
        ];

        // סידור סמלים קלאסי כמו בחפיסת קלפים אמיתית (כולל היפוך הסמלים בחצי התחתון)
        const REAL_CARD_PIP_LAYOUTS = {
          2: [
            { x: 50, y: 18 },
            { x: 50, y: 82, flip: true }
          ],
          3: [
            { x: 50, y: 16 },
            { x: 50, y: 50 },
            { x: 50, y: 84, flip: true }
          ],
          4: [
            { x: 28, y: 18 }, { x: 72, y: 18 },
            { x: 28, y: 82, flip: true }, { x: 72, y: 82, flip: true }
          ],
          5: [
            { x: 28, y: 18 }, { x: 72, y: 18 },
            { x: 50, y: 50 },
            { x: 28, y: 82, flip: true }, { x: 72, y: 82, flip: true }
          ],
          6: [
            { x: 28, y: 18 }, { x: 72, y: 18 },
            { x: 28, y: 50 }, { x: 72, y: 50 },
            { x: 28, y: 82, flip: true }, { x: 72, y: 82, flip: true }
          ],
          7: [
            { x: 28, y: 18 }, { x: 72, y: 18 },
            { x: 50, y: 34 },
            { x: 28, y: 50 }, { x: 72, y: 50 },
            { x: 28, y: 82, flip: true }, { x: 72, y: 82, flip: true }
          ],
          8: [
            { x: 28, y: 18 }, { x: 72, y: 18 },
            { x: 50, y: 34 },
            { x: 28, y: 50 }, { x: 72, y: 50 },
            { x: 50, y: 66, flip: true },
            { x: 28, y: 82, flip: true }, { x: 72, y: 82, flip: true }
          ],
          9: [
            { x: 28, y: 14 }, { x: 72, y: 14 },
            { x: 28, y: 38 }, { x: 72, y: 38 },
            { x: 50, y: 50 },
            { x: 28, y: 62, flip: true }, { x: 72, y: 62, flip: true },
            { x: 28, y: 86, flip: true }, { x: 72, y: 86, flip: true }
          ],
          10: [
            { x: 28, y: 14 }, { x: 72, y: 14 },
            { x: 50, y: 26 },
            { x: 28, y: 38 }, { x: 72, y: 38 },
            { x: 28, y: 62, flip: true }, { x: 72, y: 62, flip: true },
            { x: 50, y: 74, flip: true },
            { x: 28, y: 86, flip: true }, { x: 72, y: 86, flip: true }
          ]
        };

        const TOTAL_WAR_BATTLES = 15;

        const WarCardGame = () => {
          const [battles, setBattles] = useState([]);
          const [battleIndex, setBattleIndex] = useState(0);
          const [collectedCards, setCollectedCards] = useState(0);
          const [feedback, setFeedback] = useState(''); // '' | 'correct' | 'wrong'
          const [winnerSide, setWinnerSide] = useState(null); // 'right' | 'left' | null
          const [wrongSide, setWrongSide] = useState(null); // 'right' | 'left' | null
          const [isFinished, setIsFinished] = useState(false);

          const speak = useSpeech('he-IL');
          const timerRef = React.useRef(null);
          const hasSpokenIntroRef = React.useRef(false);

          const clearWarTimer = () => {
            if (timerRef.current) {
              clearTimeout(timerRef.current);
              timerRef.current = null;
            }
          };

          useEffect(() => {
            return () => clearWarTimer();
          }, []);

          const buildBattles = () => {
            clearWarTimer();
            const generated = [];
            let lastKey = '';

            for (let i = 0; i < TOTAL_WAR_BATTLES; i++) {
              let r1 = WAR_RANKS[0];
              let r2 = WAR_RANKS[1];
              for (let attempt = 0; attempt < 30; attempt++) {
                r1 = WAR_RANKS[Math.floor(Math.random() * WAR_RANKS.length)];
                r2 = WAR_RANKS[Math.floor(Math.random() * WAR_RANKS.length)];
                const key = `${r1.value}-${r2.value}`;
                if (r1.value !== r2.value && key !== lastKey) {
                  lastKey = key;
                  break;
                }
              }
              if (r1.value === r2.value) {
                r2 = WAR_RANKS.find(r => r.value !== r1.value) || WAR_RANKS[0];
              }

              const s1 = WAR_SUITS[Math.floor(Math.random() * WAR_SUITS.length)];
              const s2 = WAR_SUITS[Math.floor(Math.random() * WAR_SUITS.length)];

              generated.push({
                id: `war-round-${i}-${Math.random().toString(36).slice(2, 6)}`,
                right: { rank: r1, suit: s1 },
                left: { rank: r2, suit: s2 }
              });
            }

            setBattles(generated);
            setBattleIndex(0);
            setCollectedCards(0);
            setFeedback('');
            setWinnerSide(null);
            setWrongSide(null);
            setIsFinished(false);
          };

          useEffect(() => {
            buildBattles();
          }, []);

          useEffect(() => {
            if (!hasSpokenIntroRef.current && battles.length > 0) {
              hasSpokenIntroRef.current = true;
              const t = setTimeout(() => speak('אֵיזֶה קְלָף מְנַצֵּחַ?'), 450);
              return () => clearTimeout(t);
            }
          }, [battles, speak]);

          const currentBattle = battles[battleIndex];

          const handleSelectCard = (side, e) => {
            if (e && e.currentTarget) e.currentTarget.blur();
            if (!currentBattle || feedback === 'correct' || isFinished) return;

            const chosen = side === 'right' ? currentBattle.right : currentBattle.left;
            const other = side === 'right' ? currentBattle.left : currentBattle.right;

            speak(chosen.rank.speak);

            if (chosen.rank.value > other.rank.value) {
              clearWarTimer();
              setWrongSide(null);
              setWinnerSide(side);
              setFeedback('correct');
              setCollectedCards(prev => prev + 2);

              timerRef.current = setTimeout(() => {
                if (battleIndex + 1 >= battles.length) {
                  setIsFinished(true);
                  speak('כל הכבוד! ניצחתם בכל הקלפים!');
                } else {
                  setBattleIndex(prev => prev + 1);
                  setFeedback('');
                  setWinnerSide(null);
                  setWrongSide(null);
                }
              }, 1350);
            } else {
              setWrongSide(side);
              setFeedback('wrong');
              clearWarTimer();
              timerRef.current = setTimeout(() => {
                speak('נַסּוּ שׁוּב');
              }, 750);
            }
          };

          const renderPlayingCard = (side, cardData) => {
            const isWinner = winnerSide === side;
            const isLoser = winnerSide !== null && winnerSide !== side;
            const isWrong = wrongSide === side && feedback === 'wrong';
            const { rank, suit } = cardData;
            const isAce = rank.value === 14;
            const isCourtCard = rank.value >= 11 && rank.value <= 13;
            const pipCoords = REAL_CARD_PIP_LAYOUTS[rank.value] || [];

            const pipSizeClass =
              rank.value <= 3
                ? 'text-2xl sm:text-4xl md:text-[42px]'
                : rank.value <= 6
                  ? 'text-xl sm:text-3xl md:text-4xl'
                  : rank.value <= 8
                    ? 'text-lg sm:text-2xl md:text-3xl'
                    : 'text-base sm:text-xl md:text-2xl';

            return (
              <div className="relative flex flex-col items-center">
                {/* כתר מעל הקלף המנצח */}
                <div className="h-9 flex items-center justify-center mb-1">
                  {isWinner && <span className="text-3xl sm:text-4xl animate-bounce">👑</span>}
                </div>

                <button
                  type="button"
                  onClick={(e) => handleSelectCard(side, e)}
                  dir="ltr"
                  className={`
                    relative w-[138px] h-[200px] sm:w-48 sm:h-[272px] md:w-56 md:h-80 bg-white rounded-2xl sm:rounded-3xl
                    transition-all duration-300 focus:outline-none select-none cursor-pointer overflow-hidden
                    ${isWinner
                      ? 'border-4 border-green-400 ring-4 ring-green-200 shadow-2xl scale-105 bg-green-50/20'
                      : isWrong
                        ? 'border-4 border-red-300 opacity-75 scale-95 shadow-md'
                        : isLoser
                          ? 'border-4 border-gray-200 opacity-60 scale-95 shadow-sm'
                          : 'border-2 sm:border-4 border-slate-200 hover:border-orange-400 shadow-lg hover:shadow-2xl hover:-translate-y-2'
                    }
                  `}
                >
                  {/* אינדקס פינה שמאלית-עליונה */}
                  <div className={`absolute top-2 left-2 sm:top-3 sm:left-3 flex flex-col items-center leading-none ${suit.colorClass}`}>
                    <span className="text-base sm:text-2xl md:text-[26px] font-black tracking-tighter">{rank.label}</span>
                    <span className="text-xs sm:text-lg md:text-xl leading-none mt-0.5">{suit.symbol}</span>
                  </div>

                  {/* אינדקס פינה ימנית-תחתונה (הפוך כמו בקלף אמיתי) */}
                  <div className={`absolute bottom-2 right-2 sm:bottom-3 sm:right-3 flex flex-col items-center leading-none rotate-180 ${suit.colorClass}`}>
                    <span className="text-base sm:text-2xl md:text-[26px] font-black tracking-tighter">{rank.label}</span>
                    <span className="text-xs sm:text-lg md:text-xl leading-none mt-0.5">{suit.symbol}</span>
                  </div>

                  {/* אזור מרכז הקלף */}
                  {isAce ? (
                    <div className="absolute inset-6 sm:inset-9 md:inset-11 flex flex-col items-center justify-center">
                      <span className={`text-6xl sm:text-8xl md:text-9xl leading-none ${suit.colorClass} drop-shadow-sm`}>
                        {suit.symbol}
                      </span>
                    </div>
                  ) : isCourtCard ? (
                    <div className="absolute inset-x-7 inset-y-6 sm:inset-x-10 sm:inset-y-8 md:inset-x-12 md:inset-y-9 rounded-xl border-2 border-amber-300/80 bg-gradient-to-b from-amber-50/70 via-white to-amber-50/70 flex flex-col items-center justify-center p-1">
                      <span className={`text-sm sm:text-lg ${suit.colorClass} opacity-80 mb-0.5`}>{suit.symbol}</span>
                      <span className="text-4xl sm:text-6xl md:text-7xl leading-none my-0.5">{rank.royalIcon}</span>
                      <span dir="rtl" className="text-[11px] sm:text-sm md:text-base font-black text-slate-700 mt-1">
                        {rank.royalTitle}
                      </span>
                    </div>
                  ) : (
                    /* פריסת הסמלים המדויקת לקלפי מספרים 2 עד 10 */
                    <div className="absolute inset-x-6 inset-y-4 sm:inset-x-9 sm:inset-y-6 md:inset-x-11 md:inset-y-7">
                      {pipCoords.map((pt, idx) => (
                        <span
                          key={idx}
                          style={{
                            left: `${pt.x}%`,
                            top: `${pt.y}%`,
                            transform: `translate(-50%, -50%)${pt.flip ? ' rotate(180deg)' : ''}`
                          }}
                          className={`absolute leading-none ${suit.colorClass} ${pipSizeClass}`}
                        >
                          {suit.symbol}
                        </span>
                      ))}
                    </div>
                  )}
                </button>
              </div>
            );
          };

          if (!currentBattle) return null;

          return (
